# JVM flags configuration for virtual thread testing in Java 21
# This file contains recommended settings for running tests with virtual threads

# ===== Virtual Thread Configuration =====

# Enable virtual thread pinning detection (basic mode to avoid potential hangs)
# Full mode can be enabled for specific tests but may cause hangs in some scenarios (JDK-8322846)
jdk.tracePinnedThreads=true

# Configure virtual thread scheduler parallelism (number of carrier threads)
# Default is set to match available processors, but can be tuned for testing
jdk.virtualThreadScheduler.parallelism=16

# Maximum carrier thread pool size
jdk.virtualThreadScheduler.maxPoolSize=256

# ===== Garbage Collection Configuration =====

# Enable ZGC (Z Garbage Collector) with generational mode
# This is the recommended GC for Java 21 with virtual threads
-XX:+UseZGC
-XX:+ZGenerational

# ZGC tuning parameters
-XX:ConcGCThreads=2
-XX:ZCollectionInterval=5

# ===== Memory Configuration =====

# Memory settings for test environment
# Using fixed heap size to avoid resizing during tests
-Xms512m
-Xmx1g

# Pre-touch memory pages to avoid latency spikes during tests
-XX:+AlwaysPreTouch

# ===== Debugging and Monitoring =====

# Enable thread stack traces in exceptions for better debugging
-XX:+ShowCodeDetailsInExceptionMessages

# Enable JFR events for virtual threads
-XX:StartFlightRecording:settings=profile,virtualthread=true

# ===== Test-Specific Settings =====

# Increase metaspace size for test classes
-XX:MaxMetaspaceSize=256m

# Disable background compilation for more predictable test behavior
-XX:CompileThreshold=100000

# Enable assertions for tests
-ea

# ===== System Properties =====

# Set system property to indicate virtual thread test mode
test.virtual.threads=true

# Configure test timeouts for virtual thread tests
test.timeout.factor=2.0