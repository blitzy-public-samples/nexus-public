# Performance Test Configuration for nexus-base Virtual Thread Benchmarks
# This file contains configuration settings for comparing platform threads vs virtual threads

# General test configuration
test.enabled=true
test.iterations=100
test.warmup.iterations=20
test.report.directory=target/performance-reports
test.timeout.seconds=300

# Thread configuration
thread.platform.count=200
thread.virtual.enabled=true
thread.virtual.carrier.parallelism=16
thread.virtual.carrier.maxPoolSize=256

# Metrics collection
metrics.enabled=true
metrics.memory.enabled=true
metrics.cpu.enabled=true
metrics.thread.enabled=true
metrics.gc.enabled=true
metrics.sampling.interval.ms=100

# Performance thresholds
# Virtual threads should support at least 5x more concurrent connections
threshold.connections.multiplier=5.0
# Virtual threads should provide at least 30% better P95 response time
threshold.response.time.improvement=0.3
# Memory utilization should be significantly lower with virtual threads
threshold.memory.improvement=0.7

# Test scenarios

# Event processing test
scenario.event.enabled=true
scenario.event.concurrent.events=10000
scenario.event.batch.size=100
scenario.event.listeners=50
scenario.event.processing.delay.ms=5

# Node operations test
scenario.node.enabled=true
scenario.node.concurrent.operations=5000
scenario.node.operation.types=read,write,update,delete
scenario.node.data.size.bytes=4096
scenario.node.processing.delay.ms=10

# Web resource handling test
scenario.web.enabled=true
scenario.web.concurrent.requests=10000
scenario.web.request.types=static,dynamic,streaming
scenario.web.resource.size.bytes=8192
scenario.web.processing.delay.ms=15

# Security operations test
scenario.security.enabled=true
scenario.security.concurrent.authentications=2000
scenario.security.concurrent.authorizations=5000
scenario.security.processing.delay.ms=5

# Internal service operations test
scenario.service.enabled=true
scenario.service.concurrent.calls=8000
scenario.service.call.types=template,log,app,node,jwt
scenario.service.processing.delay.ms=8

# Reporting configuration
report.html.enabled=true
report.csv.enabled=true
report.jfr.enabled=true
report.comparison.chart.enabled=true
report.include.raw.data=true
report.include.system.info=true

# JVM configuration for tests
jvm.args.common=-XX:+UseZGC -XX:+ZGenerational
jvm.args.platform=-Djava.util.concurrent.ForkJoinPool.common.parallelism=16
jvm.args.virtual=-Djdk.tracePinnedThreads=full -Djdk.virtualThreadScheduler.parallelism=16 -Djdk.virtualThreadScheduler.maxPoolSize=256