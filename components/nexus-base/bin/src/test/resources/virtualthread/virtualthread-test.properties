#
# Core configuration properties for virtual thread testing of nexus-base module operations
#

# Virtual Thread Factory Configuration
virtualthread.factory.enabled=true
virtualthread.factory.name.prefix=nexus-vt-
virtualthread.factory.inherit.inheritable.threadlocals=true

# Thread Executor Configuration
virtualthread.executor.max.pool.size=10000
virtualthread.executor.scheduler.parallelism=16
virtualthread.executor.task.timeout.seconds=60
virtualthread.executor.shutdown.timeout.seconds=10

# Thread Pinning Detection
virtualthread.pinning.detection.enabled=true
virtualthread.pinning.detection.log.level=WARN
virtualthread.pinning.detection.threshold.ms=100
virtualthread.pinning.detection.stack.trace.enabled=true
virtualthread.pinning.detection.carrier.thread.monitoring=true
virtualthread.pinning.detection.carrier.thread.monitoring.interval.ms=500

# Virtual Thread Analytics
virtualthread.analytics.enabled=true
virtualthread.analytics.creation.rate.reporting=true
virtualthread.analytics.termination.rate.reporting=true
virtualthread.analytics.sampling.interval.ms=1000
virtualthread.analytics.report.interval.seconds=10

# Base Module Specific Settings
virtualthread.base.event.processing.enabled=true
virtualthread.base.node.operations.enabled=true
virtualthread.base.web.resources.enabled=true
virtualthread.base.security.operations.enabled=true
virtualthread.base.jwt.operations.enabled=true
virtualthread.base.log.operations.enabled=true

# Test Execution Settings
virtualthread.test.concurrent.users=1000
virtualthread.test.operations.per.user=100
virtualthread.test.warmup.iterations=5
virtualthread.test.measurement.iterations=10
virtualthread.test.timeout.seconds=300

# Debugging Settings
virtualthread.debug.enabled=false
virtualthread.debug.log.level=INFO
virtualthread.debug.thread.dump.interval.seconds=30
virtualthread.debug.memory.usage.reporting=true
virtualthread.debug.thread.creation.stack.trace=false

# Comparison Testing
virtualthread.comparison.platform.thread.pool.size=200
virtualthread.comparison.run.platform.thread.tests=true
virtualthread.comparison.expected.throughput.improvement.percent=200
virtualthread.comparison.expected.latency.improvement.percent=30