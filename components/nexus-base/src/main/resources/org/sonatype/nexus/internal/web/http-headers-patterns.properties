#
# Joined Regex for validating Host header with the following components:
# - Valid IPv4 Address: Matches standard dotted decimal notation (e.g., 192.168.1.1)
# - Valid IPv6 Address: Matches standard IPv6 format with 8 groups of hexadecimal digits
# - Valid IPv6 Hex Compressed Address: Matches IPv6 addresses with :: compression notation
#   including all valid forms of compressed IPv6 addresses (e.g., ::1, 2001:db8::1)
# - Valid Hostname according to RFC-1123: Matches domain names with proper formatting
# - Optional Port suffix: Matches port numbers appended with colon
# Optimized for Java 21's regex engine performance characteristics
# See also HostnameValidator.java and Validator.js for other uses of this regex.
Host=^(((([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5]))|\
  (\\[(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}\\])|\
  (\\[((?:[0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{1,4})*)?)::((?:[0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{1,4})*)?)\\])|\
  (([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\\-]*[a-zA-Z0-9])\\.)*([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9\\-]*[A-Za-z0-9]))\
  (:([0-9]+))?$

# Validates X-Forwarded-Proto header to ensure it contains only alphabetic protocol names
# Simple pattern that efficiently matches standard protocol names (http, https, etc.)
# Optimized for Java 21's regex engine performance characteristics
X-Forwarded-Proto=^[a-zA-Z]+$

# RFC 7239 compliant Forwarded header validation (https://tools.ietf.org/html/rfc7239)
# Validates that either:
# - The header contains a 'proto' parameter with an alphabetic value (left side), OR
# - The header doesn't contain 'proto' at all (right side)
# Supports both quoted and unquoted parameter values as per RFC 7239 section 4
# Handles whitespace variations and parameter ordering flexibility
# This ensures proper handling of proxy forwarding information in various formats
Forwarded=(^|.*;)\\s*proto=["']?[a-zA-Z]+["']?.*|^((?!proto).)*$