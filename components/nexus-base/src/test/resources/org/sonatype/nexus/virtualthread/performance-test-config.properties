# Performance Test Configuration for Virtual Threads vs Platform Threads
# This configuration is used for benchmarking nexus-base services with Java 21 virtual threads

#------------------------------------------------------------------------------
# General Test Configuration
#------------------------------------------------------------------------------

# Enable/disable performance testing
performance.testing.enabled=true

# Number of warmup iterations before measurements begin
performance.warmup.iterations=5

# Number of measurement iterations for collecting metrics
performance.measurement.iterations=10

# Duration of each iteration in seconds
performance.iteration.duration=30

# Random seed for reproducible test runs
performance.random.seed=42

#------------------------------------------------------------------------------
# Thread Configuration
#------------------------------------------------------------------------------

# Platform thread pool size for baseline tests
performance.platform.thread.pool.size=200

# Maximum number of carrier threads for virtual thread executor
performance.virtual.thread.carrier.pool.size=16

# Enable thread pinning detection during tests
performance.virtual.thread.pinning.detection=true

# Log stack traces when thread pinning is detected
performance.virtual.thread.pinning.log.stacktrace=true

#------------------------------------------------------------------------------
# Concurrency Test Configuration
#------------------------------------------------------------------------------

# Starting number of concurrent clients
performance.concurrency.start=10

# Maximum number of concurrent clients for platform threads
performance.concurrency.max.platform=1000

# Maximum number of concurrent clients for virtual threads
performance.concurrency.max.virtual=10000

# Step size for increasing concurrent clients
performance.concurrency.step=100

#------------------------------------------------------------------------------
# Performance Thresholds
#------------------------------------------------------------------------------

# Required improvement for P95 response time with virtual threads (percentage)
# Virtual threads should provide at least 30% better P95 response time
performance.threshold.p95.improvement=30

# Required improvement for maximum concurrent connections with virtual threads (multiplier)
# Virtual threads should support at least 5x more concurrent connections
performance.threshold.concurrency.improvement=5

# Maximum allowed memory overhead for virtual threads compared to platform threads (percentage)
performance.threshold.memory.overhead.max=50

# Maximum allowed error rate percentage
performance.threshold.error.rate.max=0.1

#------------------------------------------------------------------------------
# Metrics Collection Configuration
#------------------------------------------------------------------------------

# Enable/disable memory usage metrics collection
performance.metrics.memory=true

# Enable/disable CPU usage metrics collection
performance.metrics.cpu=true

# Enable/disable thread utilization metrics collection
performance.metrics.thread=true

# Enable/disable garbage collection metrics collection
performance.metrics.gc=true

# Metrics collection interval in milliseconds
performance.metrics.collection.interval=1000

# Enable/disable JFR (Java Flight Recorder) recording during tests
performance.metrics.jfr.enabled=true

# JFR recording file path template
performance.metrics.jfr.path=target/jfr/nexus-base-performance-test-${test.name}-${thread.type}.jfr

#------------------------------------------------------------------------------
# Test Scenarios Configuration
#------------------------------------------------------------------------------

# Event Processing Test
#------------------------------------------------------------------------------
performance.test.event.enabled=true
performance.test.event.events.per.iteration=10000
performance.test.event.listener.count=20
performance.test.event.async.ratio=0.7

# Task Scheduling Test
#------------------------------------------------------------------------------
performance.test.scheduling.enabled=true
performance.test.scheduling.tasks.per.iteration=5000
performance.test.scheduling.task.duration.min.ms=10
performance.test.scheduling.task.duration.max.ms=100

# System Check Test
#------------------------------------------------------------------------------
performance.test.systemcheck.enabled=true
performance.test.systemcheck.checks.count=50
performance.test.systemcheck.check.duration.ms=20

# Node Service Test
#------------------------------------------------------------------------------
performance.test.node.enabled=true
performance.test.node.operations.per.iteration=1000
performance.test.node.read.ratio=0.8

# Security Service Test
#------------------------------------------------------------------------------
performance.test.security.enabled=true
performance.test.security.operations.per.iteration=5000
performance.test.security.permission.check.ratio=0.9

#------------------------------------------------------------------------------
# Reporting Configuration
#------------------------------------------------------------------------------

# Enable/disable HTML report generation
performance.report.html.enabled=true

# HTML report file path template
performance.report.html.path=target/performance-reports/nexus-base-performance-report-${test.timestamp}.html

# Enable/disable CSV data export
performance.report.csv.enabled=true

# CSV report file path template
performance.report.csv.path=target/performance-reports/nexus-base-performance-data-${test.timestamp}.csv

# Include raw data in reports
performance.report.include.raw.data=true

# Enable/disable comparison with previous test runs
performance.report.compare.with.previous=true

# Previous test results path for comparison
performance.report.previous.results.path=target/performance-reports/previous-results