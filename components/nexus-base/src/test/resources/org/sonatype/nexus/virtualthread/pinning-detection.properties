# Thread Pinning Detection Configuration for Nexus Repository
# This file configures detection of virtual thread pinning in Java 21
# Thread pinning occurs when a virtual thread cannot be unmounted from its carrier thread,
# which reduces the scalability benefits of virtual threads

# ======================================================================
# General Configuration
# ======================================================================

# Enable thread pinning detection (true/false)
pinning.detection.enabled=true

# Minimum duration (in milliseconds) for a pinning event to be reported
# Short-lived pinning events are usually not problematic
pinning.detection.threshold.ms=20

# Maximum number of pinning events to report per minute (to prevent log flooding)
pinning.detection.rate.limit=100

# ======================================================================
# Stack Trace Collection
# ======================================================================

# Enable collection of stack traces for pinning events (true/false)
pinning.stacktrace.enabled=true

# Maximum depth of stack traces to collect
pinning.stacktrace.max.depth=50

# Include Java platform frames in stack traces (true/false)
pinning.stacktrace.include.platform.frames=false

# ======================================================================
# JVM Flag Configuration
# ======================================================================

# JVM flag for thread pinning detection
# This will be automatically applied when detection is enabled
# Note: This flag will be removed in Java 24+ as pinning with synchronized is fixed
pinning.jvm.flag=-Djdk.tracePinnedThreads=full

# ======================================================================
# JFR (Java Flight Recorder) Configuration
# ======================================================================

# Enable JFR recording for thread pinning events (true/false)
pinning.jfr.enabled=true

# JFR recording duration in seconds (0 for continuous)
pinning.jfr.duration.seconds=0

# JFR recording file path (leave empty for in-memory recording)
pinning.jfr.file.path=

# JFR event threshold in milliseconds (minimum duration to record an event)
pinning.jfr.event.threshold.ms=20

# ======================================================================
# Warning Configuration
# ======================================================================

# Enable warnings for excessive pinning (true/false)
pinning.warning.enabled=true

# Threshold for warning about excessive pinning (events per minute)
pinning.warning.threshold=50

# Enable notification for pinning warnings (true/false)
pinning.warning.notification.enabled=true

# Email addresses for pinning warning notifications (comma-separated)
pinning.warning.notification.emails=

# ======================================================================
# Known Pinning Patterns
# ======================================================================

# Patterns to identify known causes of pinning in stack traces
# Format: pattern.name=regex pattern

# Synchronized blocks/methods
pattern.synchronized=.*synchronized.*

# JDBC operations that may cause pinning
pattern.jdbc=.*java\.sql\..*

# Native method calls
pattern.native=.*native method.*

# Common libraries known to cause pinning
pattern.libraries=.*(ConcurrentHashMap|HashMap|ArrayList|LinkedList).*

# ======================================================================
# Exclusion Patterns
# ======================================================================

# Stack trace patterns to exclude from pinning detection
# Format: exclude.name=regex pattern

# Short-lived synchronized blocks in core classes
exclude.short.sync=.*java\.util\.concurrent\.ConcurrentHashMap\.get.*

# Expected pinning in initialization code
exclude.init=.*<clinit>.*

# ======================================================================
# Reporting Configuration
# ======================================================================

# Enable logging of pinning events (true/false)
pinning.reporting.log.enabled=true

# Log level for pinning events (INFO, WARN, ERROR)
pinning.reporting.log.level=WARN

# Enable metrics collection for pinning events (true/false)
pinning.reporting.metrics.enabled=true

# Metric name prefix for pinning events
pinning.reporting.metrics.prefix=nexus.virtualthread.pinning

# Enable detailed reporting with stack traces (true/false)
pinning.reporting.detailed=true

# Maximum number of pinning events to store in memory
pinning.reporting.max.events=1000