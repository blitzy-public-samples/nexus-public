# Virtual Thread Test Configuration for Nexus Base Module
# This file contains configuration properties for virtual thread testing
# in the nexus-base module, supporting Java 21 virtual thread capabilities.
#
# This configuration is used by all nexus-base virtual thread test cases to ensure
# consistent behavior and validation of Java 21 threading implementation.

# Thread Factory Configuration
# Configure the virtual thread factory used in tests
virtualthread.factory.enabled=true                      # Enable virtual thread factory
virtualthread.factory.name=nexus-base-vt                # Thread factory name prefix
virtualthread.factory.inherit.inheritable.threadlocals=true # Inherit thread locals

# Thread Pool Configuration
# Configure the thread pools used for virtual thread execution
virtualthread.pool.parallelism=16       # Number of carrier threads
virtualthread.pool.max.size=256        # Maximum pool size
virtualthread.pool.keepalive.ms=60000  # Thread keepalive time in milliseconds

# Timeout Settings
# Configure timeouts for various operations
virtualthread.operation.timeout.ms=30000  # General operation timeout
virtualthread.shutdown.timeout.ms=10000   # Executor shutdown timeout
virtualthread.task.timeout.ms=60000       # Task execution timeout

# Pinning Detection
# Configure detection of virtual thread pinning issues
virtualthread.pinning.detection.enabled=true       # Enable pinning detection
virtualthread.pinning.detection.log.level=WARN     # Log level for pinning events
virtualthread.pinning.detection.threshold.ms=100   # Pinning threshold in milliseconds
virtualthread.pinning.stack.trace.enabled=true     # Capture stack traces on pinning
virtualthread.pinning.stack.trace.max.depth=50     # Maximum stack trace depth
virtualthread.pinning.notification.enabled=true    # Send notifications on pinning

# Diagnostic Settings
# Configure diagnostic tools for virtual thread debugging
virtualthread.diagnostic.logging.enabled=true        # Enable diagnostic logging
virtualthread.diagnostic.jfr.enabled=true           # Enable Java Flight Recorder
virtualthread.diagnostic.jfr.path=target/virtualthread-jfr  # JFR output path
virtualthread.diagnostic.metrics.enabled=true        # Enable metrics collection
virtualthread.diagnostic.thread.dump.interval.ms=0   # Thread dump interval (0=disabled)
virtualthread.diagnostic.thread.dump.on.pinning=true  # Dump threads on pinning

# Monitoring Settings
# These settings control the collection of virtual thread metrics
virtualthread.monitoring.creation.rate.enabled=true     # Track thread creation rate
virtualthread.monitoring.termination.rate.enabled=true   # Track thread termination rate
virtualthread.monitoring.active.count.enabled=true       # Track active thread count
virtualthread.monitoring.blocked.count.enabled=true      # Track blocked thread count
virtualthread.monitoring.carrier.thread.utilization.enabled=true # Track carrier thread usage
virtualthread.monitoring.metrics.reporting.interval.ms=5000      # Metrics reporting interval

# Test Parameters
# These parameters control the behavior of virtual thread tests
virtualthread.test.concurrent.operations=1000  # Number of concurrent operations to run
virtualthread.test.operation.delay.ms=10       # Artificial delay per operation to simulate I/O
virtualthread.test.max.execution.time.ms=30000 # Maximum test execution time
virtualthread.test.assert.no.pinning=true      # Assert that no thread pinning occurs
virtualthread.test.assert.carrier.thread.count.max=64 # Maximum carrier thread count
virtualthread.test.compare.with.platform.threads=true # Compare with platform threads
virtualthread.test.performance.threshold.factor=1.3   # Expected performance improvement factor

# Service-specific Settings
# Control which services should use virtual threads in tests
virtualthread.service.repository.enabled=true   # Repository operations
virtualthread.service.blobstore.enabled=true    # BlobStore operations
virtualthread.service.httpclient.enabled=true   # HTTP client operations
virtualthread.service.datastore.enabled=true    # DataStore operations
virtualthread.service.tasks.enabled=true        # Task execution
virtualthread.service.rest.enabled=true         # REST API operations
virtualthread.service.security.enabled=true     # Security operations

# Thread Context Propagation
# Control how context is propagated across virtual thread boundaries
virtualthread.context.propagation.enabled=true           # Master switch for context propagation
virtualthread.context.mdc.propagation.enabled=true       # Propagate logging MDC context
virtualthread.context.security.propagation.enabled=true   # Propagate security context
virtualthread.context.transaction.propagation.enabled=true # Propagate transaction context
virtualthread.context.request.propagation.enabled=true    # Propagate HTTP request context

# JVM Flags (for reference, set via -D system properties)
# These flags should be set when running tests with virtual threads
# -Djdk.tracePinnedThreads=full            # Enable detailed pinning detection
# -Djdk.virtualThreadScheduler.parallelism=16  # Set carrier thread count
# -Djdk.virtualThreadScheduler.maxPoolSize=256 # Maximum carrier thread pool size
# -Djava.util.concurrent.ForkJoinPool.common.parallelism=16 # Common pool size
# -XX:+UseZGC                             # Use Z Garbage Collector
# -XX:+ZGenerational                       # Enable generational ZGC
# -Dtest.virtual.threads=true              # Enable virtual thread test mode