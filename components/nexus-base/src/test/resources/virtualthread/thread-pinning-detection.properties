# Thread Pinning Detection Configuration for Nexus Base Module
# This configuration is used for detecting and monitoring virtual thread pinning
# during tests to ensure optimal performance with Java 21 virtual threads.

#-----------------------------------------------------------------------
# General Configuration
#-----------------------------------------------------------------------

# Enable thread pinning detection during tests
enabled=true

# JVM flags to be applied during virtual thread tests
# The jdk.tracePinnedThreads flag enables detailed stack traces when pinning occurs
jvm.flags=-Djdk.tracePinnedThreads=full

# Minimum duration (in milliseconds) for a pinning event to be considered significant
# Short-lived pinning events (e.g., in-memory operations) are typically not problematic
pinning.threshold.ms=20

# Maximum acceptable pinning events per minute before triggering a warning
pinning.rate.threshold=5

#-----------------------------------------------------------------------
# Java Flight Recorder (JFR) Configuration
#-----------------------------------------------------------------------

# Enable JFR recording during pinning events
jfr.enabled=true

# Duration to record before and after a pinning event (in milliseconds)
jfr.recording.window.ms=5000

# Path to store JFR recordings relative to test output directory
jfr.output.path=pinning-recordings

# JFR event settings
jfr.events.enabled=jdk.VirtualThreadPinned,jdk.VirtualThreadStart,jdk.VirtualThreadEnd,jdk.JavaMonitorEnter,jdk.JavaMonitorWait

# Enable stack trace collection for pinning events
jfr.stacktrace.enabled=true

# Maximum depth of stack traces to collect
jfr.stacktrace.depth=64

#-----------------------------------------------------------------------
# Carrier Thread Monitoring
#-----------------------------------------------------------------------

# Enable monitoring of carrier thread utilization
carrier.monitoring.enabled=true

# Interval (in milliseconds) to check carrier thread status
carrier.monitoring.interval.ms=500

# Threshold percentage of carrier threads that can be pinned before warning
carrier.pinning.threshold.percent=25

# Maximum carrier thread pool size to use for tests
carrier.pool.size=16

#-----------------------------------------------------------------------
# Diagnostic Capture Configuration
#-----------------------------------------------------------------------

# Enable capturing thread dumps when pinning exceeds thresholds
diagnostic.threaddump.enabled=true

# Interval between thread dumps when pinning is detected (in milliseconds)
diagnostic.threaddump.interval.ms=2000

# Maximum number of thread dumps to capture per test
diagnostic.threaddump.max=5

# Enable heap dumps when severe pinning is detected
diagnostic.heapdump.enabled=false

# Enable capturing system metrics during pinning events
diagnostic.metrics.enabled=true

#-----------------------------------------------------------------------
# Pinning Pattern Detection
#-----------------------------------------------------------------------

# Patterns to identify common pinning causes in nexus-base operations
# Format: pattern.<name>=<regex pattern>

# Synchronized blocks in core operations
pattern.sync.core=org\.sonatype\.nexus\.(?:internal|bootstrap).*synchronized

# Database operations that may cause pinning
pattern.database=org\.sonatype\.nexus\.datastore.*(?:execute|query|update)

# HTTP client operations that may cause pinning
pattern.http=org\.sonatype\.nexus\.httpclient.*(?:execute|send|receive)

# File operations that may cause pinning
pattern.file=org\.sonatype\.nexus\.(?:blobstore|repository).*(?:read|write|delete|move)

# Security operations that may cause pinning
pattern.security=org\.sonatype\.nexus\.security.*(?:authenticate|authorize|validate)

#-----------------------------------------------------------------------
# Test-Specific Configuration
#-----------------------------------------------------------------------

# List of tests that should ignore pinning warnings (comma-separated)
test.ignore=ThreadPoolTest,LegacyThreadingTest

# Additional JVM arguments for specific test categories
test.category.io.jvm.args=-Djdk.virtualThreadScheduler.parallelism=4
test.category.security.jvm.args=-Djdk.virtualThreadScheduler.maxPoolSize=8

# Enable more verbose logging for thread pinning in tests
test.debug.enabled=true