# Virtual Thread Test Configuration for nexus-base module
# This file contains settings for testing Java 21 virtual thread capabilities

# Enable virtual threads for testing
virtualthread.enabled=true

# Thread Factory Configuration
virtualthread.factory.name=nexus-test-vt
virtualthread.factory.daemon=true

# Thread Executor Configuration
virtualthread.executor.parallelism=16
virtualthread.executor.maxPoolSize=256

# Thread Pinning Detection
virtualthread.pinning.detection.enabled=true
virtualthread.pinning.detection.threshold=20

# Monitoring and Analytics
virtualthread.monitoring.enabled=true
virtualthread.monitoring.interval.ms=1000
virtualthread.monitoring.metrics.enabled=true

# Thread Creation Rate Limits (for preventing resource exhaustion during tests)
virtualthread.creation.rate.limit=10000
virtualthread.creation.rate.timewindow.ms=1000

# Operation Timeouts
virtualthread.timeout.default.ms=5000
virtualthread.timeout.io.ms=10000
virtualthread.timeout.db.ms=15000

# Debug Settings
virtualthread.debug.stacktrace.enabled=true
virtualthread.debug.log.level=INFO

# Test Specific Settings
virtualthread.test.concurrent.threads=1000
virtualthread.test.io.simulation.enabled=true
virtualthread.test.io.simulation.delay.ms=100
virtualthread.test.db.simulation.enabled=true
virtualthread.test.db.simulation.delay.ms=200

# JVM System Properties (to be set programmatically by test framework)
# -Djdk.tracePinnedThreads=full
# -Djdk.virtualThreadScheduler.parallelism=16
# -Djdk.virtualThreadScheduler.maxPoolSize=256
# -Djdk.virtualThreadScheduler.priority=5

# Performance Comparison Settings
virtualthread.performance.compare.enabled=true
virtualthread.performance.compare.iterations=100
virtualthread.performance.compare.warmup.iterations=10

# Virtual Thread Analytics
virtualthread.analytics.enabled=true
virtualthread.analytics.creation.tracking=true
virtualthread.analytics.termination.tracking=true
virtualthread.analytics.pinning.tracking=true
virtualthread.analytics.mounting.tracking=true

# Thread Compatibility Testing
virtualthread.compatibility.jdbc.test=true
virtualthread.compatibility.http.test=true
virtualthread.compatibility.osgi.test=true

# Resource Limits
virtualthread.resource.memory.limit.mb=256
virtualthread.resource.cpu.limit.percent=80