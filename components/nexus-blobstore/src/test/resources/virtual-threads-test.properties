# Virtual Threads Test Configuration for Nexus BlobStore
# This file provides configuration settings for virtual thread testing in the Nexus BlobStore component

# ======================================================================
# Virtual Thread Scheduler Configuration
# ======================================================================

# Maximum number of carrier threads to use for virtual threads
# Higher values may improve throughput for I/O-bound operations but consume more resources
jdk.virtualThreadScheduler.maxPoolSize=256

# Number of carrier threads that can execute virtual threads in parallel
# Default is set to the number of available processors
jdk.virtualThreadScheduler.parallelism=16

# ======================================================================
# Thread Pinning Detection
# ======================================================================

# Enable thread pinning detection for virtual threads
# Options: 'full' (detailed stack traces), 'short' (abbreviated info), or empty to disable
jdk.tracePinnedThreads=full

# Threshold in milliseconds for how long a virtual thread must be pinned before logging a warning
# Lower values will catch more pinning events but may generate excessive logs
virtual.threads.pinning.warning.threshold=100

# ======================================================================
# Performance Measurement
# ======================================================================

# Enable collection of virtual thread performance metrics during tests
virtual.threads.metrics.enabled=true

# Interval in milliseconds for collecting virtual thread metrics
virtual.threads.metrics.interval=1000

# ======================================================================
# Test Execution Configuration
# ======================================================================

# Maximum number of concurrent virtual threads to create during stress tests
# This allows testing the system under high concurrency conditions
virtual.threads.test.max.concurrent=10000

# Duration in seconds for virtual thread stress tests
virtual.threads.test.duration=30

# ======================================================================
# Diagnostic Settings
# ======================================================================

# Enable detailed logging of virtual thread lifecycle events (creation, mounting, unmounting)
virtual.threads.debug.logging=false

# Enable collection of thread dumps at regular intervals during tests
virtual.threads.diagnostics.thread.dumps.enabled=false

# Interval in seconds between thread dumps when enabled
virtual.threads.diagnostics.thread.dumps.interval=5

# ======================================================================
# BlobStore-specific Settings
# ======================================================================

# Enable virtual threads for BlobStore I/O operations
# When true, file and S3 operations will use virtual threads instead of platform threads
blobstore.virtual.threads.enabled=true

# Maximum number of concurrent I/O operations allowed per BlobStore
blobstore.virtual.threads.max.concurrent.io=1000

# Timeout in milliseconds for BlobStore operations using virtual threads
blobstore.virtual.threads.operation.timeout=30000