# Virtual Thread Testing Configuration for BlobStore Component

# Thread Pool Configuration
# -----------------------

# Number of platform threads available for scheduling virtual threads
# Default is equal to the number of available processors
jdk.virtualThreadScheduler.parallelism=16

# Maximum number of platform threads in the scheduler's pool
# Default is 256, but can be increased for high I/O workloads
jdk.virtualThreadScheduler.maxPoolSize=256

# Minimum number of runnable threads that should be maintained
# This helps ensure responsiveness under load
jdk.virtualThreadScheduler.minRunnable=8

# Thread Pinning Detection
# -----------------------

# Enable full stack trace capture when a virtual thread is pinned
# Options: 'full' (complete stack trace), 'short' (only problematic frames), or 'none'
jdk.tracePinnedThreads=full

# Threshold in milliseconds for considering a pinned thread as problematic
# This aligns with the default JFR VirtualThreadPinned event threshold
pinnedThreadThreshold=20

# Performance Testing Configuration
# --------------------------------

# Number of concurrent operations to run during performance tests
performanceTest.concurrentOperations=1000

# Expected minimum throughput improvement factor when using virtual threads vs platform threads
# A value of 5.0 means virtual threads should be at least 5x faster under high concurrency
performanceTest.expectedThroughputImprovement=5.0

# Maximum acceptable memory overhead per virtual thread in bytes
# Virtual threads should use significantly less memory than platform threads
performanceTest.maxMemoryOverheadPerThread=10240

# Test Execution Configuration
# ---------------------------

# Whether to run tests with virtual threads enabled
# This can be overridden via system properties
testWithVirtualThreads=true

# Whether to compare performance between virtual and platform threads
performanceTest.compareWithPlatformThreads=true

# Whether to fail tests when thread pinning is detected
failOnThreadPinning=false