# Java 21 Bootstrap Configuration Properties
# This file contains Java 21-specific settings for Nexus Repository

#-------------------------------------------------------
# Java 21 Detection and Validation
#-------------------------------------------------------

# Minimum Java version required
java.version.minimum=21

# Verify Java 21 features are available
java.features.required=VIRTUAL_THREADS,GENERATIONAL_ZGC,PATTERN_MATCHING,RECORD_PATTERNS,STRING_TEMPLATES

# Exit with error if running on incompatible Java version
java.version.validation.strict=true

# Java 21 feature detection flags
java.detect.virtual.threads=true
java.detect.zgc.generational=true
java.detect.pattern.matching=true
java.detect.record.patterns=true
java.detect.string.templates=true

#-------------------------------------------------------
# Virtual Threads Configuration
#-------------------------------------------------------

# Enable Virtual Threads for Nexus Repository
# Virtual threads are lightweight threads that dramatically reduce the effort of writing,
# maintaining, and observing high-throughput concurrent applications
virtual.threads.enabled=true

# Virtual Thread Scheduler Configuration
# Controls the number of carrier threads in the virtual thread scheduler
# Default is set to the number of available processors
jdk.virtualThreadScheduler.parallelism=${available.processors}

# Maximum number of platform threads to use as carriers for virtual threads
# Setting this to 0 means no limit (uses JVM default)
virtual.threads.max.carriers=0

# Thread pool hints for Virtual Threads usage
# These settings provide hints to the application about thread pool sizing
# when using Virtual Threads. Setting to 0 means use Virtual Threads directly
# without traditional thread pooling, which is recommended for most I/O operations.

# HTTP thread pool sizing - set to 0 to use Virtual Threads without pooling
# This optimizes HTTP request handling for high concurrency
http.threadpool.max=0
http.threadpool.min=0

# Background task thread pool sizing - set to 0 to use Virtual Threads without pooling
# This optimizes background tasks like repository maintenance and cleanup
task.threadpool.max=0
task.threadpool.min=0

# I/O operations thread pool sizing - set to 0 to use Virtual Threads without pooling
# This optimizes file and network I/O operations like blob storage access
io.threadpool.max=0
io.threadpool.min=0

# Pinning detection and warning threshold (in milliseconds)
# Logs warnings when virtual threads are pinned for longer than this duration
# Pinning occurs when a virtual thread cannot be unmounted from its carrier thread,
# such as during synchronized blocks or native method calls
virtual.threads.pinned.threshold=100

# Virtual thread stack size in KB (0 means use JVM default)
# Virtual threads can use smaller stack sizes than platform threads
virtual.threads.stack.size=0

# Enable virtual thread monitoring and metrics collection
virtual.threads.monitoring.enabled=true

#-------------------------------------------------------
# ZGC (Z Garbage Collector) Configuration
#-------------------------------------------------------

# Enable the Z Garbage Collector with Generational mode (new in Java 21)
# ZGC is a scalable low-latency garbage collector that performs all expensive work concurrently
# Generational ZGC (new in Java 21) further improves performance by separating young and old objects
gc.zgc.enabled=true
gc.zgc.generational=true

# ZGC Heap Configuration
# SoftMaxHeapSize sets a soft limit that ZGC will try to stay under
# but can exceed up to MaxHeapSize if needed to prevent application stalls
gc.zgc.softmaxheapsize=80%

# Uncommit unused memory to return it to the OS
# Disable this for extremely low latency requirements by setting to false
# and setting min heap size equal to max heap size
gc.zgc.uncommit=true

# Minimum time (in seconds) memory should be unused before being uncommitted
gc.zgc.uncommit.delay=30

# Always pre-touch memory pages at startup for better initial performance
# Recommended when using same min and max heap size for extremely low latency
gc.pretouch=true

# Use large pages for better performance if available
# Requires system configuration (see JVM documentation)
# Large pages improve throughput, latency and startup time
gc.zgc.useLargePages=true

# Dynamic GC threads scaling (available since JDK 17)
# Allows ZGC to automatically adjust the number of GC threads based on workload
gc.zgc.dynamicGcThreads=true

# ZGC Logging Configuration
gc.zgc.logging.level=info

#-------------------------------------------------------
# Other Java 21 Optimizations
#-------------------------------------------------------

# Enable String deduplication to reduce memory usage
# This helps reduce heap memory usage by sharing identical String instances
string.deduplication.enabled=true

# Enable class data sharing for faster startup
# This improves startup time by sharing class metadata across JVM instances
cds.enabled=true

# Enable application class data sharing for even faster startup
# This extends class data sharing to application classes
cds.archive.enabled=true

# Enable preview features if needed
# Set to true only if you need to use preview features in Java 21
preview.features.enabled=false

# Enable JFR (Java Flight Recorder) for diagnostics
# This provides low-overhead profiling and monitoring capabilities
jfr.enabled=true

# Optimize for server deployments
# This enables various server-specific optimizations
server.optimizations.enabled=true

# Enable new Java 21 pattern matching optimizations
# This improves performance of pattern matching in switch statements
pattern.matching.optimizations.enabled=true

# Enable String template optimizations
# This improves performance of the new String template feature in Java 21
string.template.optimizations.enabled=true

# Enable Sequenced Collections optimizations
# This improves performance when using the new Sequenced Collections API
sequenced.collections.optimizations.enabled=true

# Enable Record Pattern optimizations
# This improves performance when using Record Patterns
record.pattern.optimizations.enabled=true