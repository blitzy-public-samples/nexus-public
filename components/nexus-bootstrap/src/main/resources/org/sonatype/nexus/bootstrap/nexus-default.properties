# Java 21 Runtime Configuration

# Java 21 runtime detection flags
# These properties help identify the Java version during bootstrap
java.specification.version=21
java.vm.specification.version=21

# Enable Virtual Threads for I/O-bound operations
# This significantly improves scalability for concurrent operations with minimal resource consumption
java.util.concurrent.SubmitterThreadPerTaskExecutor.enabled=true

# Configure Z Garbage Collector (ZGC) for improved memory management
# ZGC is a low-latency garbage collector that minimizes pause times
# These flags are passed to the JVM at startup
-XX:+UseZGC
-XX:+ZGenerational
-XX:ConcGCThreads=2
-XX:ZCollectionInterval=300

# Enable thread pinning detection to identify potential performance issues
# with Virtual Threads
jdk.tracePinnedThreads=full

# Configure Virtual Thread scheduler for optimal performance
jdk.virtualThreadScheduler.parallelism=16
jdk.virtualThreadScheduler.maxPoolSize=256

# Enable headless mode for containerized environments
# This prevents issues with AWT/Swing components in container deployments
java.awt.headless=true

# Configure Class-Data Sharing for improved startup performance
# CDS reduces startup time and memory footprint by sharing class metadata
-XX:+UseCompressedClassPointers
-XX:+UseCompressedOops
-XX:+ShareClassesWithCDS
-XX:SharedArchiveFile=${karaf.data}/app-cds.jsa
-XX:ArchiveClassesAtExit=${karaf.data}/app-cds.jsa

# Memory management optimizations for Java 21
# These settings help optimize memory usage and garbage collection
-XX:+AlwaysPreTouch
-XX:+DisableExplicitGC
-XX:+UseNUMA
-XX:+UseStringDeduplication
-XX:+OptimizeStringConcat
-XX:MaxRAMPercentage=75.0

# Security settings for Java 21
# These settings enhance security in the Java 21 runtime
jdk.tls.client.protocols=TLSv1.2,TLSv1.3
jdk.tls.server.protocols=TLSv1.2,TLSv1.3

# Logging improvements for Virtual Threads
# These settings help with debugging Virtual Thread issues
java.util.logging.manager=org.apache.logging.log4j.jul.LogManager

# JDBC optimizations for Virtual Threads
# These settings improve database operations with Virtual Threads
java.jdbc.virtualThreadsEnabled=true

# HTTP client optimizations for Virtual Threads
# These settings improve HTTP client operations with Virtual Threads
jdk.httpclient.enableVirtualThreads=true