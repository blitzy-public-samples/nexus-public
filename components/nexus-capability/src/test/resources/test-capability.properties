# Test Capability Properties File
# This file contains properties used for testing capability configuration and validation
# Used by CapabilityDescriptorSupportTest and other capability-related tests

# Basic capability properties
# ---------------------------
capability.id=test-capability
capability.name=Test Capability
capability.description=A test capability for unit testing
capability.enabled=true
capability.notes=Test notes for capability

# Repository-related properties
# ----------------------------
# Used for testing unique constraints in CapabilityDescriptorSupportTest
repository=maven-central
repository.name=Maven Central
repository.type=proxy

# Additional repository for testing multiple repositories
repository.secondary=maven-releases
repository.secondary.name=Maven Releases
repository.secondary.type=hosted

# Validation test properties
# -------------------------
# These properties are used to test validation in CapabilityDescriptorSupportTest
validation.required=required-value
validation.optional=optional-value
validation.numeric=123
validation.boolean=true

# Properties with special characters for testing escaping
# -----------------------------------------------------
special.property=Property with spaces and special chars: @#$%^&*()
special.unicode=Unicode test: \u00A9 Copyright symbol

# Multi-line property example
# --------------------------
multi.line.property=This is a test property \
that spans multiple lines \
for testing purposes

