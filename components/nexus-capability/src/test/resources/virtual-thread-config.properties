# Virtual Thread Configuration for Capability Testing
# This file contains settings for testing Virtual Thread behavior in capabilities
# as part of the Java 21 migration

# Enable/disable virtual threads for capability operations
capability.virtualThreads.enabled=true

# Thread pool configuration
capability.threadPool.virtualThreads.maxPoolSize=256
capability.threadPool.platformThreads.maxPoolSize=32
capability.threadPool.namePrefix=capability-test-

# Operation timeout values (in milliseconds)
capability.operation.timeout=5000
capability.operation.longRunning.timeout=30000
capability.operation.shutdown.timeout=10000

# Concurrency settings
capability.concurrency.maxOperations=1000
capability.concurrency.throttleThreshold=800

# Virtual Thread specific settings
capability.virtualThreads.pinningDetection=true
capability.virtualThreads.scheduler.parallelism=16
capability.virtualThreads.delayedExecutor.enabled=true

# Performance test settings
capability.performance.warmupIterations=10
capability.performance.measurementIterations=50
capability.performance.clientStepSize=100
capability.performance.maxClients=1000

# Thread monitoring settings
capability.monitoring.threadDumpInterval=60000
capability.monitoring.pinnedThreadLogging=true
capability.monitoring.threadMetrics.enabled=true

# Backward compatibility settings
capability.backwardCompatibility.forcePlatformThreads=false
capability.backwardCompatibility.mixedModeEnabled=true

# Diagnostic settings
capability.diagnostic.detailedThreadInfo=true
capability.diagnostic.stackTraceOnBlocking=true
capability.diagnostic.logVirtualThreadCreation=true

# Java 21 specific JVM flags (for reference, not used directly by the application)
# -XX:+UseZGC
# -XX:+ZGenerational
# -Djdk.tracePinnedThreads=full
# -Djdk.virtualThreadScheduler.parallelism=16
# -Djdk.virtualThreadScheduler.maxPoolSize=256