# Virtual Thread Configuration for Capability Testing
# This file contains settings for testing Virtual Thread behavior in capabilities
# as part of the Java 21 migration effort.

# -----------------------------------------------------------------------
# Thread Pool Configuration
# -----------------------------------------------------------------------

# Number of carrier threads in the virtual thread scheduler
# Default is set to the number of available processors
jdk.virtualThreadScheduler.parallelism=4

# Maximum number of virtual threads to create in tests
capability.virtualthread.maxThreads=1000

# Thread naming pattern for virtual threads in capability tests
capability.virtualthread.namePattern=capability-vthread-%d

# Thread factory class to use for virtual thread creation
capability.virtualthread.threadFactoryClass=org.sonatype.nexus.thread.NexusForkJoinWorkerThreadFactory

# -----------------------------------------------------------------------
# Thread Behavior Settings
# -----------------------------------------------------------------------

# Enable thread pinning detection (values: off, short, full)
# - off: No pinning detection
# - short: Basic pinning information
# - full: Detailed stack traces for pinned threads
jdk.tracePinnedThreads=short

# Timeout values (in milliseconds) for thread operations
capability.virtualthread.defaultTimeout=5000
capability.virtualthread.longRunningTimeout=30000
capability.virtualthread.shutdownTimeout=10000

# Maximum time (in milliseconds) a virtual thread can be pinned before logging a warning
capability.virtualthread.maxPinningTime=1000

# -----------------------------------------------------------------------
# Capability-specific Thread Settings
# -----------------------------------------------------------------------

# Enable virtual threads for capability condition evaluation
capability.condition.useVirtualThreads=true

# Number of virtual threads to use for parallel capability operations
capability.virtualthread.parallelOperations=16

# Enable virtual threads for capability activation/passivation
capability.lifecycle.useVirtualThreads=true

# Enable virtual threads for capability validation
capability.validation.useVirtualThreads=true

# -----------------------------------------------------------------------
# I/O Operation Settings
# -----------------------------------------------------------------------

# Buffer size for I/O operations with virtual threads (in bytes)
capability.virtualthread.ioBufferSize=8192

# Enable non-blocking I/O operations with virtual threads
capability.virtualthread.nonBlockingIO=true

# -----------------------------------------------------------------------
# Backward Compatibility Settings
# -----------------------------------------------------------------------

# Flag to fall back to platform threads when virtual threads are not available
capability.thread.fallbackToPlatformThreads=true

# Minimum Java version required for virtual thread tests
capability.virtualthread.minJavaVersion=21

# Thread pool size to use when falling back to platform threads
capability.thread.platformThreadPoolSize=32

# -----------------------------------------------------------------------
# Test Scenario Configuration
# -----------------------------------------------------------------------

# Enable high concurrency test scenarios
capability.test.highConcurrency=true

# Number of concurrent operations in high concurrency tests
capability.test.concurrentOperations=100

# Enable long-running operation tests
capability.test.longRunningOperations=true

# Duration of long-running operations in tests (milliseconds)
capability.test.longRunningDuration=5000

# Enable I/O-bound operation tests
capability.test.ioBoundOperations=true

# Size of test data for I/O operations (in bytes)
capability.test.ioDataSize=1048576