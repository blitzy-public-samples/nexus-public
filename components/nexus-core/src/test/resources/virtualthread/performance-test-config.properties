# Performance Test Configuration for Java 21 Virtual Thread Migration
# This file contains configuration parameters for benchmarking nexus-core operations
# comparing platform threads vs virtual threads performance.

#-------------------------------------------------------
# General Test Configuration
#-------------------------------------------------------
# Enable/disable performance testing
performance.testing.enabled=true

# Test duration in seconds
performance.test.duration=60

# Warmup iterations before measurement
performance.warmup.iterations=10

# Measurement iterations for statistics
performance.measurement.iterations=100

# Test output directory for reports
performance.output.directory=target/performance-reports

# Enable detailed logging during tests
performance.detailed.logging=false

#-------------------------------------------------------
# Thread Configuration
#-------------------------------------------------------
# Platform thread pool size for baseline tests
performance.platform.thread.pool.size=200

# Maximum platform threads to use in tests
performance.platform.thread.max=1000

# Platform thread step size for escalation tests
performance.platform.thread.step.size=100

# Virtual thread maximum concurrent count
performance.virtual.thread.max=10000

# Virtual thread step size for escalation tests
performance.virtual.thread.step.size=1000

# Virtual thread scheduler parallelism
performance.virtual.thread.scheduler.parallelism=16

# Virtual thread scheduler maximum pool size
performance.virtual.thread.scheduler.max.pool.size=256

#-------------------------------------------------------
# Performance Thresholds
#-------------------------------------------------------
# Expected minimum improvement for P95 response time with virtual threads (30%)
performance.virtual.thread.p95.improvement.threshold=0.7

# Expected minimum improvement for P99 response time with virtual threads (25%)
performance.virtual.thread.p99.improvement.threshold=0.75

# Expected minimum improvement for maximum concurrent connections with virtual threads (10x)
performance.virtual.thread.max.connections.improvement.factor=10

# Expected thread scaling efficiency for virtual threads (>90%)
performance.virtual.thread.scaling.efficiency.threshold=0.9

# Maximum acceptable error rate during performance tests
performance.max.error.rate=0.001

#-------------------------------------------------------
# Response Time Thresholds (milliseconds)
#-------------------------------------------------------
# Platform thread baseline P95 response time (ms)
performance.platform.thread.p95.baseline=500

# Virtual thread target P95 response time (ms)
performance.virtual.thread.p95.target=350

# Platform thread baseline P99 response time (ms)
performance.platform.thread.p99.baseline=800

# Virtual thread target P99 response time (ms)
performance.virtual.thread.p99.target=600

#-------------------------------------------------------
# Memory Utilization Thresholds
#-------------------------------------------------------
# Platform thread memory utilization baseline for 1k connections (MB)
performance.platform.thread.memory.baseline=1024

# Virtual thread memory utilization target for 1k connections (MB)
performance.virtual.thread.memory.target=300

# Memory sampling interval during tests (ms)
performance.memory.sampling.interval=1000

# Enable heap dump on memory threshold violation
performance.memory.heap.dump.enabled=false

#-------------------------------------------------------
# Test Scenarios
#-------------------------------------------------------
# Repository operations to benchmark
performance.test.scenarios=repository-browse,asset-download,component-search,metadata-update,blob-upload

# Number of assets to use in repository browse tests
performance.repository.browse.asset.count=10000

# Size of test assets for download tests (bytes)
performance.asset.download.size=1048576

# Number of components for search tests
performance.component.search.count=5000

# Size of metadata files for update tests (bytes)
performance.metadata.update.size=102400

# Size of blobs for upload tests (bytes)
performance.blob.upload.size=5242880

#-------------------------------------------------------
# Thread Pinning Detection
#-------------------------------------------------------
# Enable thread pinning detection during tests
performance.thread.pinning.detection.enabled=true

# Log stack traces for pinned threads
performance.thread.pinning.stack.trace.enabled=true

# Maximum acceptable thread pinning percentage
performance.thread.pinning.threshold=0.05

#-------------------------------------------------------
# JVM Configuration
#-------------------------------------------------------
# Enable ZGC for tests
performance.zgc.enabled=true

# Enable generational ZGC
performance.zgc.generational=true

# JVM flags for performance tests
performance.jvm.flags=-XX:+UseZGC -XX:+ZGenerational -Djdk.tracePinnedThreads=full -Djdk.virtualThreadScheduler.parallelism=16 -Djdk.virtualThreadScheduler.maxPoolSize=256