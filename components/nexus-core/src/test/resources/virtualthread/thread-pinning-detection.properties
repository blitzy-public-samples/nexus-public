# Thread Pinning Detection Configuration for Java 21 Virtual Threads
# Used during testing to identify scenarios where Virtual Threads may pin to carrier threads

# ======================================================================
# General Configuration
# ======================================================================

# Enable thread pinning detection during tests
pinning.detection.enabled=true

# Minimum duration (in milliseconds) for a pinning event to be considered significant
# Short-lived pinning events (e.g., in-memory operations) are typically not problematic
pinning.threshold.duration=20

# Maximum acceptable frequency of pinning events per minute
# Higher values indicate potential scalability issues
pinning.threshold.frequency=5

# ======================================================================
# JVM Configuration
# ======================================================================

# JVM flag for pinning detection during tests
# This will be automatically added to test JVM arguments when enabled
pinning.jvm.trace.flag=-Djdk.tracePinnedThreads=full

# ======================================================================
# Stack Trace Configuration
# ======================================================================

# Whether to capture full stack traces for pinning events
pinning.stacktrace.enabled=true

# Maximum depth of stack traces to capture
pinning.stacktrace.max.depth=64

# Whether to filter stack traces to focus on application code
pinning.stacktrace.filter.enabled=true

# Packages to include in filtered stack traces (comma-separated)
pinning.stacktrace.filter.include=org.sonatype.nexus

# Packages to exclude from filtered stack traces (comma-separated)
pinning.stacktrace.filter.exclude=java.lang.Thread,jdk.internal

# ======================================================================
# JFR (Java Flight Recorder) Configuration
# ======================================================================

# Whether to use JFR for pinning detection
pinning.jfr.enabled=true

# JFR event name for virtual thread pinning
pinning.jfr.event.name=jdk.VirtualThreadPinned

# Whether to include stack traces in JFR events
pinning.jfr.stacktrace.enabled=true

# Duration threshold for JFR pinning events (in milliseconds)
pinning.jfr.threshold.duration=20

# ======================================================================
# Reporting Configuration
# ======================================================================

# Whether to log pinning events to the test log
pinning.reporting.log.enabled=true

# Log level for pinning events (INFO, WARN, ERROR)
pinning.reporting.log.level=WARN

# Whether to fail tests when significant pinning is detected
pinning.reporting.fail.tests=false

# Whether to generate a report of pinning events after test execution
pinning.reporting.summary.enabled=true

# ======================================================================
# Monitoring Configuration
# ======================================================================

# Interval (in milliseconds) for checking pinning metrics during tests
pinning.monitoring.interval=1000

# Whether to track pinning metrics per test class
pinning.monitoring.per.test.class=true

# Whether to track pinning metrics per test method
pinning.monitoring.per.test.method=true

# ======================================================================
# Integration Configuration
# ======================================================================

# Whether to expose pinning metrics via JMX
pinning.integration.jmx.enabled=true

# Whether to expose pinning metrics via Prometheus endpoint
pinning.integration.prometheus.enabled=true

# ======================================================================
# Advanced Configuration
# ======================================================================

# Whether to attempt to identify root causes of pinning
pinning.analysis.root.cause.enabled=true

# Whether to group similar pinning events
pinning.analysis.grouping.enabled=true

# Maximum number of pinning events to track
pinning.tracking.max.events=1000

# Whether to track carrier thread utilization
pinning.tracking.carrier.utilization=true