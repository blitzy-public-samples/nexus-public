# Virtual Thread Test Configuration for Nexus Core Components
# This file contains configuration properties for virtual thread testing
# as part of the Java 21 migration.

# -----------------------------------------------------------------------
# Virtual Thread Scheduler Configuration
# -----------------------------------------------------------------------

# Number of platform threads (carrier threads) available for scheduling virtual threads
# Default is the number of available processors
jdk.virtualThreadScheduler.parallelism=16

# Maximum size of the carrier thread pool
# Default is max(parallelism, 256)
jdk.virtualThreadScheduler.maxPoolSize=256

# Minimum number of core threads not blocked allowed
# Default is half the pool size
jdk.virtualThreadScheduler.minRunnable=8

# -----------------------------------------------------------------------
# Diagnostic Properties
# -----------------------------------------------------------------------

# Enables stack trace emission when a virtual thread blocks while pinned
# Values: "full" (complete stack trace), "short" (only problematic frames), or not set
# Uncomment to enable pinning detection during tests
#jdk.tracePinnedThreads=short

# -----------------------------------------------------------------------
# Test Framework Configuration
# -----------------------------------------------------------------------

# Enable virtual threads for test execution
# When set to true, tests will use virtual threads instead of platform threads
test.virtual.threads=true

# -----------------------------------------------------------------------
# Test Execution Parameters
# -----------------------------------------------------------------------

# Default timeout for operations running in virtual thread context (milliseconds)
virtualthread.test.operation.timeout=5000

# Default timeout for test completion when using virtual threads (milliseconds)
virtualthread.test.completion.timeout=30000

# Maximum number of concurrent virtual threads to create during testing
virtualthread.test.max.concurrent.threads=10000

# -----------------------------------------------------------------------
# Monitoring and Diagnostics
# -----------------------------------------------------------------------

# Enable collection of virtual thread metrics during tests
virtualthread.test.metrics.enabled=true

# Threshold in milliseconds for reporting long-running virtual thread operations
virtualthread.test.metrics.long.operation.threshold=1000

# Interval in milliseconds for collecting virtual thread statistics
virtualthread.test.metrics.collection.interval=5000

# -----------------------------------------------------------------------
# Thread Pinning Detection
# -----------------------------------------------------------------------

# Enable detection of thread pinning issues during tests
virtualthread.test.detect.pinning=true

# Threshold in milliseconds for reporting pinned virtual threads
virtualthread.test.pinning.threshold=100

# -----------------------------------------------------------------------
# Performance Testing
# -----------------------------------------------------------------------

# Enable comparative performance testing between platform and virtual threads
virtualthread.test.performance.comparison.enabled=true

# Number of iterations for performance comparison tests
virtualthread.test.performance.iterations=1000

# Warmup iterations before measuring performance
virtualthread.test.performance.warmup.iterations=100