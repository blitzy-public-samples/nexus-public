# HikariCP configuration optimized for Java 21 Virtual Threads with H2 database

# Connection pool sizing - optimized for Virtual Threads
# Smaller pool size since Virtual Threads are lightweight and don't need large thread pools
maximumPoolSize=20
minimumIdle=5

# Reduced timeouts to minimize Virtual Thread pinning
connectionTimeout=1000
validationTimeout=500

# Enable leak detection - important for Virtual Thread debugging
leakDetectionThreshold=10000

# Transaction isolation level suitable for Virtual Thread execution
# READ_COMMITTED provides a good balance between isolation and performance
transactionIsolation=TRANSACTION_READ_COMMITTED

# Connection testing for reliability - using H2-compatible query
connectionTestQuery=SELECT 1

# Enable metrics for Virtual Thread performance analysis
registerMbeans=true
metricsTrackerFactory=com.zaxxer.hikari.metrics.micrometer.MicrometerMetricsTrackerFactory

# Connection lifecycle settings
autoCommit=false
keepaliveTime=30000
maxLifetime=600000
idleTimeout=300000

# Allow pool suspension during tests
allowPoolSuspension=true

# Initialize pool eagerly for testing
initializationFailTimeout=0

# Use fair scheduling for Virtual Thread compatibility
useFairLock=true

# Disable JMX reporting to avoid thread pinning during JMX operations
jmxEnabled=false

# H2-specific settings for Virtual Thread compatibility
# These settings help minimize thread pinning with H2 database
dataSource.cachePrepStmts=true
dataSource.prepStmtCacheSize=250
dataSource.prepStmtCacheSqlLimit=2048

# Additional H2 optimizations for Virtual Threads
dataSource.cacheResultSetMetadata=true
dataSource.cacheServerConfiguration=true
dataSource.elideSetAutoCommits=true
dataSource.maintainTimeStats=false