# H2 JDBC Connection Properties for Virtual Thread Testing
# Updated for Java 21 compatibility

# Driver class for H2 database version 2.2.224+ (certified for Java 21)
driverClassName=org.h2.Driver

# JDBC URL with PostgreSQL mode for database compatibility
# Using file-based storage with PostgreSQL compatibility mode
jdbcUrl=jdbc:h2:mem:nexus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH

# Authentication parameters
username=sa
password=

# Virtual Thread optimizations
# Prevent connection pool blocking with appropriate timeout settings
connectionTimeout=5000
validationTimeout=3000
maxLifetime=1800000

# Optimize for Virtual Thread operations
# Smaller batch sizes work better with Virtual Threads to avoid blocking
batchSize=50
fetchSize=100

# Transaction management for Virtual Thread compatibility
# Shorter transaction timeouts prevent thread blocking
transactionIsolation=TRANSACTION_READ_COMMITTED
minimumIdle=5
maximumPoolSize=20

# Query timeout settings to avoid thread blocking
queryTimeout=30

# H2-specific settings for Virtual Thread performance
autoCommit=true
DB_CLOSE_DELAY=-1
DB_CLOSE_ON_EXIT=FALSE
AUTO_RECONNECT=TRUE
AUTO_SERVER=TRUE

# Additional optimizations for Virtual Threads
# These settings help preserve transaction context across virtual thread handoffs
LOCK_TIMEOUT=10000
MVCC=TRUE