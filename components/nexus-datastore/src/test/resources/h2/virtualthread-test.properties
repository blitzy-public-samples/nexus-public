# -----------------------------------------------------------------------
# Virtual Thread Test Configuration for H2 Database
# -----------------------------------------------------------------------
# This file contains configuration properties for Java 21 Virtual Thread testing
# with H2 database. It defines settings for Virtual Thread monitoring, thread pool
# configuration, and performance test parameters.

# -----------------------------------------------------------------------
# Thread Pinning Detection Configuration
# -----------------------------------------------------------------------

# Enable thread pinning detection and monitoring
# This helps identify when virtual threads are pinned to carrier threads
virtualthread.pinning.detection.enabled=true

# Threshold in milliseconds for pinning detection
# Pinning events shorter than this will not be reported
virtualthread.pinning.threshold.ms=20

# Configure JFR event recording for virtual thread pinning
virtualthread.jfr.pinning.events.enabled=true
virtualthread.jfr.pinning.stack.depth=64

# -----------------------------------------------------------------------
# Virtual Thread Scheduler Parameters
# -----------------------------------------------------------------------

# Configure the number of carrier threads for the ForkJoinPool
# Default is based on available processors
virtualthread.carrier.threads=0

# Maximum number of virtual threads to create in tests
virtualthread.max.threads=10000

# Timeout for virtual thread operations in milliseconds
virtualthread.operation.timeout.ms=5000

# -----------------------------------------------------------------------
# Thread Metrics Collection
# -----------------------------------------------------------------------

# Enable collection of thread creation/termination metrics
virtualthread.metrics.creation.enabled=true

# Enable collection of thread execution time metrics
virtualthread.metrics.execution.enabled=true

# Enable collection of thread pinning metrics
virtualthread.metrics.pinning.enabled=true

# Configure metrics reporting interval in milliseconds
virtualthread.metrics.reporting.interval.ms=1000

# -----------------------------------------------------------------------
# Connection Validation Parameters
# -----------------------------------------------------------------------

# Configure connection validation timeout in milliseconds
# Lower values help prevent virtual thread pinning during connection validation
virtualthread.connection.validation.timeout.ms=250

# Configure connection acquisition timeout in milliseconds
virtualthread.connection.acquisition.timeout.ms=500

# Configure transaction isolation level for virtual thread testing
# Options: TRANSACTION_READ_UNCOMMITTED, TRANSACTION_READ_COMMITTED,
#          TRANSACTION_REPEATABLE_READ, TRANSACTION_SERIALIZABLE
virtualthread.transaction.isolation=TRANSACTION_READ_COMMITTED

# -----------------------------------------------------------------------
# Performance Test Parameters
# -----------------------------------------------------------------------

# Number of operations to perform in performance tests
virtualthread.performance.operations=1000

# Delay between operations in milliseconds (simulates I/O latency)
virtualthread.performance.operation.delay.ms=50

# Enable comparison between platform threads and virtual threads
virtualthread.performance.comparison.enabled=true

# Number of iterations for performance tests
virtualthread.performance.iterations=5

# -----------------------------------------------------------------------
# Thread Pinning Simulation (for testing pinning detection)
# -----------------------------------------------------------------------

# Enable simulation of thread pinning scenarios
virtualthread.pinning.simulation.enabled=false

# Duration of simulated pinning in milliseconds
virtualthread.pinning.simulation.duration.ms=100

# Frequency of simulated pinning (1 in X operations)
virtualthread.pinning.simulation.frequency=100