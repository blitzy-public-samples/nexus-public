# H2 Database Configuration for Java 21 Virtual Thread Testing
# This configuration enables detailed analysis of Virtual Thread behavior with database operations
#
# Java 21 Virtual Threads provide lightweight concurrency for I/O-bound operations like database access.
# This configuration file enables comprehensive testing of Virtual Thread interactions with H2 database,
# focusing on performance comparison, thread pinning detection, and scalability validation.
#
# Key features enabled by this configuration:
# 1. Thread pinning detection to identify when Virtual Threads are unable to unmount from carrier threads
# 2. Performance metrics collection to compare Virtual Threads vs Platform Threads
# 3. Connection validation optimized for Virtual Thread operations
# 4. JFR (Java Flight Recorder) event monitoring for detailed thread behavior analysis

# Basic Database Connection Properties
driverClassName=org.h2.Driver
url=jdbc:h2:mem:virtualthread_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000;QUERY_TIMEOUT=60000
username=sa
password=

# Virtual Thread Monitoring Configuration
# Enables JFR (Java Flight Recorder) events for Virtual Thread monitoring
virtualthread.monitoring.enabled=true
virtualthread.monitoring.pinning.detection=true
virtualthread.monitoring.pinning.threshold=20
virtualthread.monitoring.jfr.event.period=100ms

# Thread Pinning Detection Settings
# Configuration for detecting when Virtual Threads are pinned to carrier threads
virtualthread.pinning.log.enabled=true
virtualthread.pinning.log.stacktrace=full
virtualthread.pinning.jfr.enabled=true
virtualthread.pinning.jfr.threshold.ms=20
virtualthread.pinning.alert.threshold.ms=500

# Thread Pool Configuration for Virtual Thread Scheduler
virtualthread.scheduler.parallelism=16
virtualthread.scheduler.maxPoolSize=256
virtualthread.scheduler.keepAliveTime=60000
virtualthread.scheduler.daemon=true
virtualthread.scheduler.priority=5

# Performance Test Parameters
# Settings for comparing Virtual Threads vs Platform Threads performance
performance.test.iterations=1000
performance.test.concurrency=100
performance.test.compare.platform.threads=true
performance.test.metrics.collection.enabled=true
performance.test.warmup.iterations=100
performance.test.duration.seconds=60

# Connection Validation Parameters
# Parameters to ensure connections are valid when used with Virtual Threads
validationQuery=SELECT 1
validationQueryTimeout=3000
testOnBorrow=true
testWhileIdle=true
testOnReturn=false
validationInterval=5000

# Connection Pool Settings for Virtual Thread Testing
# Optimized for Virtual Thread testing scenarios
minimumIdle=5
maximumPoolSize=20
connectionTimeout=30000
idleTimeout=600000
maxLifetime=1800000
autoCommit=true
isolationLevel=TRANSACTION_READ_COMMITTED

# Thread Metrics Collection
# Enables detailed metrics collection for thread performance analysis
metrics.thread.cpu.time=true
metrics.thread.blocked.time=true
metrics.thread.waited.time=true
metrics.thread.allocated.bytes=true
metrics.thread.context.switches=true
metrics.thread.pinning.events=true
metrics.collection.interval.ms=1000

# Virtual Thread Specific Settings
# Fine-tuning of Virtual Thread behavior for database operations
virtualthread.unmount.on.park=true
virtualthread.carrier.thread.preemption=true
virtualthread.pinning.monitor.synchronized=true
virtualthread.pinning.monitor.native=true
virtualthread.debug.unmount.events=true
virtualthread.debug.mount.events=true

# Database Operations Settings
# Configuration for database operations during Virtual Thread testing
database.operations.batch.size=100
database.operations.timeout=5000
database.operations.retry.count=3
database.operations.retry.delay=1000
database.operations.transaction.timeout=10000

# H2 Specific Settings for Virtual Thread Testing
# These settings optimize H2 database for use with Java 21 Virtual Threads
h2.server.thread.model=virtual
h2.mvStore.autoCommitBufferSize=1024
h2.lobInDatabase=true
h2.lobClientMaxSizeMemory=16384
h2.asyncConnection=true
h2.pooled=true
h2.poolMaxSize=50
h2.poolTimeout=10000

# Virtual Thread JDBC Connection Settings
# These settings help prevent thread pinning during JDBC operations
jdbc.virtualthread.enabled=true
jdbc.statement.timeout=30000
jdbc.fetch.size=100
jdbc.batch.size=50
jdbc.result.set.type=TYPE_FORWARD_ONLY
jdbc.result.set.concurrency=CONCUR_READ_ONLY
jdbc.connection.holdability=CLOSE_CURSORS_AT_COMMIT

# Virtual Thread Test Monitoring
# Settings for monitoring and analyzing Virtual Thread behavior during tests
test.monitor.thread.count=true
test.monitor.thread.pinning=true
test.monitor.thread.scheduling=true
test.monitor.thread.blocking=true
test.monitor.thread.io.operations=true
test.monitor.thread.database.operations=true

# Virtual Thread Debug Settings
# Enable these settings to get detailed debug information during tests
debug.virtualthread.lifecycle=false
debug.virtualthread.scheduling=false
debug.virtualthread.pinning=true
debug.virtualthread.blocking=true
debug.jdbc.operations=false