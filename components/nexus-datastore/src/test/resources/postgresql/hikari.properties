# HikariCP configuration optimized for Java 21 Virtual Threads

# Connection pool sizing optimized for Virtual Thread workloads
# Lower values prevent excessive connection creation that can occur with Virtual Threads
minimumIdle=5
maximumPoolSize=20

# Reduced timeouts to minimize Virtual Thread blocking
# Virtual Threads are lightweight, so we can afford shorter timeouts
connectionTimeout=2500
validationTimeout=2000

# Leak detection optimized for Virtual Thread context
# Helps identify connection leaks in Virtual Thread workloads
leakDetectionThreshold=30000

# Enable connection testing to ensure validity
autoCommit=true
connectionTestQuery=SELECT 1

# Allow pool suspension for testing connection behavior with Virtual Threads
allowPoolSuspension=true

# Idle timeout and max lifetime settings
# Balanced for Virtual Thread workloads where connections may be used differently
idleTimeout=30000
maxLifetime=1800000

# Transaction isolation level
transactionIsolation=TRANSACTION_READ_COMMITTED

# Register MBeans for monitoring
registerMbeans=true

# Pool name for easier identification in logs and monitoring
poolName=NexusPostgreSQLVirtualThreadPool