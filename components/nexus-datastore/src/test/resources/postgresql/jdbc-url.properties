# PostgreSQL JDBC URL properties for Java 21 Virtual Thread testing

# JDBC driver class for PostgreSQL - version 42.7.2 compatible with Java 21
driverClassName=org.postgresql.Driver

# JDBC URL template for PostgreSQL
jdbcUrl=jdbc:postgresql://${host}:${port}/${database}

# Default credentials
username=postgres
password=postgres

# PostgreSQL-specific settings optimized for Virtual Thread operations

# Cancel command timeout - prevents thread pinning during cancellation
cancelSignalTimeout=5

# Rewrite batched inserts for better performance with Virtual Threads
reWriteBatchedInserts=true

# Disable TCP delay for better network performance with Virtual Threads
tcpNoDelay=true

# Enable TCP keep-alive for connection stability
tcpKeepAlive=true

# Optimal fetch size for Virtual Thread throughput
defaultRowFetchSize=100

# Batch size for optimal Virtual Thread performance
defaultBatchSize=100

# Disable auto-commit for better transaction control
autoCommit=false

# Connection pool settings optimized for Virtual Threads
minimumIdle=5
maximumPoolSize=20

# Connection timeout optimized for Virtual Threads (shorter to prevent blocking)
connectionTimeout=5000

# Idle timeout for connection pool management
idleTimeout=30000

# Maximum lifetime of a connection in the pool
maxLifetime=1800000

# Socket timeout to prevent thread pinning during long-running operations
socketTimeout=10000

# Prepare threshold for statement caching
prepareThreshold=5

# Enable binary transfer for improved performance
binaryTransfer=true

# Disable SSL for test environments (enable in production)
sslmode=disable