# PostgreSQL-specific Virtual Thread Test Configuration for Nexus Repository Manager
# This file contains settings for testing PostgreSQL datastore operations with Java 21 virtual threads

# Virtual Thread Scheduler Configuration
# -------------------------------------
# Controls the number of carrier threads in the virtual thread scheduler for PostgreSQL tests
jdk.virtualThreadScheduler.parallelism=16
# Maximum pool size for carrier threads when testing with PostgreSQL
jdk.virtualThreadScheduler.maxPoolSize=256
# FIFO scheduling mode for the virtual thread scheduler
jdk.virtualThreadScheduler.schedulingMode=FIFO

# Thread Pinning Detection for PostgreSQL
# -------------------------------------
# Enable thread pinning detection with full stack traces for JDBC operations
jdk.tracePinnedThreads=full
# Minimum duration (in milliseconds) for pinning events to be reported - lower for PostgreSQL due to complex queries
jdk.virtualThread.pinningThreshold=10
# Enable detailed pinning analysis for PostgreSQL JDBC operations
nexus.virtualThread.postgresql.detailedPinningAnalysis=true

# PostgreSQL Connection Settings
# ----------------------------
# Maximum number of connections in the PostgreSQL connection pool for virtual thread tests
nexus.virtualThread.postgresql.maxPoolSize=100
# Connection validation timeout in milliseconds
nexus.virtualThread.postgresql.validationTimeout=2500
# Connection acquisition timeout in milliseconds
nexus.virtualThread.postgresql.connectionTimeout=5000
# Maximum lifetime of a connection in the pool (milliseconds)
nexus.virtualThread.postgresql.maxLifetime=1800000
# Minimum idle connections to maintain in the pool
nexus.virtualThread.postgresql.minimumIdle=10
# Enable connection leak detection
nexus.virtualThread.postgresql.leakDetectionThreshold=30000

# Virtual Thread Analytics for PostgreSQL
# ------------------------------------
# Enable virtual thread analytics collection
nexus.virtualThread.analytics.enabled=true
# Interval (in seconds) for virtual thread metrics collection
nexus.virtualThread.analytics.interval=5
# Enable PostgreSQL-specific thread metrics
nexus.virtualThread.postgresql.metrics.enabled=true
# Track JDBC operation latency
nexus.virtualThread.postgresql.metrics.trackLatency=true
# Track connection acquisition time
nexus.virtualThread.postgresql.metrics.trackConnectionAcquisition=true

# Default Timeouts for PostgreSQL Operations
# --------------------------------------
# Default timeout (in milliseconds) for database operations in virtual thread context
nexus.virtualThread.postgresql.operationTimeout=10000
# Default timeout (in milliseconds) for transaction operations
nexus.virtualThread.postgresql.transactionTimeout=30000
# Default timeout (in milliseconds) for query operations
nexus.virtualThread.postgresql.queryTimeout=5000

# Stack Trace Capture Configuration
# -------------------------------
# Enable stack trace capture for thread pinning events
nexus.virtualThread.captureStackTraces=true
# Maximum depth of stack traces to capture
nexus.virtualThread.stackTraceMaxDepth=64
# Include JDK internal frames in stack traces
nexus.virtualThread.includeInternalFrames=true
# Enable PostgreSQL driver-specific stack frame filtering
nexus.virtualThread.postgresql.filterDriverFrames=false

# Virtual Thread Test Configuration for PostgreSQL
# --------------------------------------------
# Number of concurrent operations to execute during PostgreSQL tests
nexus.virtualThread.postgresql.test.concurrentOperations=1000
# Duration (in seconds) for PostgreSQL load tests
nexus.virtualThread.postgresql.test.loadTestDuration=60
# Enable comparison testing between platform and virtual threads
nexus.virtualThread.postgresql.test.enableComparison=true
# Maximum number of virtual threads to create during PostgreSQL tests
nexus.virtualThread.postgresql.test.maxThreadCount=10000
# Timeout (in milliseconds) for virtual thread termination during test cleanup
nexus.virtualThread.postgresql.test.shutdownTimeout=5000

# JFR Configuration for Virtual Thread Monitoring with PostgreSQL
# -----------------------------------------------------------
# Enable JFR recording during PostgreSQL virtual thread tests
nexus.virtualThread.postgresql.jfr.enabled=true
# JFR recording duration (in seconds)
nexus.virtualThread.postgresql.jfr.duration=120
# JFR file path pattern
nexus.virtualThread.postgresql.jfr.path=target/jfr/postgresql-virtualthread-test-${timestamp}.jfr

# PostgreSQL JDBC Driver Configuration for Virtual Threads
# ----------------------------------------------------
# Enable prepared statement caching
nexus.virtualThread.postgresql.preparedStatementCacheSize=250
# Enable result set fetch size optimization
nexus.virtualThread.postgresql.defaultFetchSize=100
# Enable batch size optimization
nexus.virtualThread.postgresql.defaultBatchSize=50
# Enable connection validation before use
nexus.virtualThread.postgresql.validateConnectionBeforeUse=true
# Set default transaction isolation level (1=READ_UNCOMMITTED, 2=READ_COMMITTED, 4=REPEATABLE_READ, 8=SERIALIZABLE)
nexus.virtualThread.postgresql.defaultTransactionIsolation=2