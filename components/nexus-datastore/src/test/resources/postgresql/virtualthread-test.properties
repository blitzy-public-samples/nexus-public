# PostgreSQL Virtual Thread Test Configuration
# Configuration for Java 21 Virtual Thread testing with PostgreSQL

# Thread Pinning Detection
# -----------------------
virtualthread.pinning.detection.enabled=true
virtualthread.pinning.detection.threshold=20
virtualthread.pinning.detection.stacktrace=true
virtualthread.pinning.detection.logging=true

# Virtual Thread Scheduler Configuration
# -------------------------------------
virtualthread.scheduler.maxPoolSize=16
virtualthread.scheduler.parallelism=4
virtualthread.scheduler.monitorInterval=1000
virtualthread.scheduler.unmountOnBlocking=true

# Thread Monitoring Thresholds
# ---------------------------
virtualthread.monitoring.enabled=true
virtualthread.monitoring.pinningThreshold=20
virtualthread.monitoring.longRunningThreshold=5000
virtualthread.monitoring.deadlockDetection=true
virtualthread.monitoring.jfrEvents=true

# Connection Validation Parameters
# ------------------------------
connection.validation.enabled=true
connection.validation.timeout=2500
connection.validation.query=SELECT 1
connection.validation.interval=30000
connection.leakDetectionThreshold=60000

# PostgreSQL-specific JDBC Parameters
# ---------------------------------
postgresql.jdbc.minVersion=42.7.2
postgresql.jdbc.cancelSignalTimeout=10000
postgresql.jdbc.reWriteBatchedInserts=true
postgresql.jdbc.preparedStatementCacheSize=250
postgresql.jdbc.preparedStatementCacheSqlLimit=2048

# Performance Test Parameters
# -------------------------
performance.test.batchSize=100
performance.test.fetchSize=100
performance.test.transactionIsolation=READ_COMMITTED
performance.test.concurrentThreads=50
performance.test.operationsPerThread=1000
performance.test.threadPinningAnalysis=true

# Virtual Thread Diagnostic Options
# -------------------------------
# These properties correspond to JVM options that would be set at runtime
# -Djdk.tracePinnedThreads=full
# -Djdk.virtualThreadScheduler.maxPoolSize=16
# -Djdk.virtualThreadScheduler.parallelism=4
diagnostic.tracePinnedThreads=full
diagnostic.virtualThreadScheduler.maxPoolSize=16
diagnostic.virtualThreadScheduler.parallelism=4

# Thread Pinning Mitigation
# ------------------------
# Settings to help avoid thread pinning with PostgreSQL JDBC
pinning.mitigation.useSynchronizedBlocks=false
pinning.mitigation.useReentrantLocks=true
pinning.mitigation.minimizeNativeOperations=true
pinning.mitigation.avoidThreadLocals=true