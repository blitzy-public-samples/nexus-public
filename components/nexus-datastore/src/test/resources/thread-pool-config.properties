# Thread Pool Configuration for Testing
# This file defines settings for both platform threads and Java 21 Virtual Threads

#-------------------------------------------------------
# Platform Thread Pool Configuration
#-------------------------------------------------------

# Core thread pool size for platform thread executors
platform.thread.pool.core.size=16

# Maximum thread pool size for platform thread executors
platform.thread.pool.max.size=64

# Keep-alive time in milliseconds for idle threads
platform.thread.pool.keep.alive.time=60000

# Queue capacity for platform thread executors
platform.thread.pool.queue.capacity=1000

# Thread name prefix for platform threads
platform.thread.name.prefix=nexus-platform-

# Transaction timeout in milliseconds for platform threads
platform.transaction.timeout=30000

#-------------------------------------------------------
# Virtual Thread Configuration (Java 21)
#-------------------------------------------------------

# Enable virtual threads for I/O-bound operations
virtual.threads.enabled=true

# Virtual thread scheduler parallelism (number of carrier threads)
# Maps to JVM flag: -Djdk.virtualThreadScheduler.parallelism
virtual.thread.scheduler.parallelism=16

# Maximum carrier thread pool size for virtual threads
# Maps to JVM flag: -Djdk.virtualThreadScheduler.maxPoolSize
virtual.thread.scheduler.max.pool.size=256

# Thread name prefix for virtual threads
virtual.thread.name.prefix=nexus-vt-

# Transaction timeout in milliseconds for virtual threads (can be higher due to efficiency)
virtual.transaction.timeout=60000

#-------------------------------------------------------
# Thread Monitoring Configuration
#-------------------------------------------------------

# Enable thread pinning detection
# Maps to JVM flag: -Djdk.tracePinnedThreads
thread.pinning.detection.enabled=true

# Thread pinning detection level (none, short, full)
thread.pinning.detection.level=full

# Enable thread utilization monitoring
thread.utilization.monitoring.enabled=true

# Thread utilization monitoring interval in milliseconds
thread.utilization.monitoring.interval=5000

# Enable thread stack trace collection for pinned threads
thread.stack.trace.collection.enabled=true

# Maximum stack trace depth for pinned threads
thread.stack.trace.max.depth=50

#-------------------------------------------------------
# Database Connection Pool Configuration
#-------------------------------------------------------

# Maximum number of database connections for platform thread tests
db.connection.pool.max.size.platform=32

# Maximum number of database connections for virtual thread tests
# Can be smaller due to more efficient thread utilization
db.connection.pool.max.size.virtual=16

# Connection timeout in milliseconds
db.connection.timeout=5000

# Connection idle timeout in milliseconds
db.connection.idle.timeout=600000

#-------------------------------------------------------
# I/O Operation Configuration
#-------------------------------------------------------

# I/O buffer size in bytes
io.buffer.size=8192

# Maximum concurrent I/O operations for platform threads
io.max.concurrent.operations.platform=32

# Maximum concurrent I/O operations for virtual threads
# Can be much higher due to virtual thread efficiency
io.max.concurrent.operations.virtual=1000

# I/O operation timeout in milliseconds
io.operation.timeout=10000