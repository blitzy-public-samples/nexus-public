# H2 JDBC Connection Pool Configuration optimized for Virtual Threads
# For use with Java 21+ Virtual Threads in Sonatype Nexus Repository
# This configuration supports the Java 21 migration requirements for database operations

# Basic Connection Properties
driverClassName=org.h2.Driver
url=jdbc:h2:mem:nexus;DB_CLOSE_DELAY=-1
username=sa
password=

# Connection Pool Settings optimized for Virtual Threads
# Smaller pool size is sufficient with virtual threads as they are lightweight
# Virtual threads are cheap, so we can create many of them without exhausting resources
# This allows for higher concurrency without the overhead of platform threads
maxPoolSize=20
minIdle=5

# Connection Timeouts
# Shorter timeouts work well with virtual threads as they don't block OS threads
# Virtual threads can park and resume efficiently during I/O operations
# This prevents resource exhaustion when many virtual threads are waiting for connections
connectionTimeout=3000
validationTimeout=2000
initializationFailTimeout=5000

# Connection Lifecycle
# Appropriate lifecycle settings for test environments
# These settings help manage connection lifecycle in high-throughput virtual thread scenarios
maxLifetime=1800000
idleTimeout=300000

# Connection Validation
# Lightweight validation query for H2
# Ensures connections remain valid without significant overhead
connectionTestQuery=SELECT 1
validationInterval=30000

# Transaction Isolation
# READ_COMMITTED is generally a good default for H2
# Works well with concurrent virtual thread operations
# Provides a good balance between consistency and performance for repository operations
transactionIsolation=TRANSACTION_READ_COMMITTED

# H2 Driver Specific Properties
# These properties ensure optimal performance with virtual threads
# H2 is generally lightweight and works well with virtual threads
# but we still need to minimize thread pinning for optimal performance
dataSource.ifExists=true
dataSource.ignoreUnknownSettings=true

# Virtual Thread Specific Optimizations
# Avoid thread pinning with H2 driver
# H2 uses synchronized blocks in some places which can pin carrier threads
# These settings help minimize pinning and improve performance with virtual threads

# Leak Detection
# Important for detecting connection leaks in virtual thread environments
# Virtual threads make it easier to create many concurrent operations, increasing leak risk
leakDetectionThreshold=60000

# Connection Initialization
# Standard initialization settings
# These settings ensure consistent connection behavior across virtual threads
autoCommit=false
readOnly=false
registerMbeans=true

# H2 Virtual Thread Specific Settings
# H2 is generally lightweight but can still benefit from virtual thread optimizations
# These settings help minimize thread pinning and improve performance with virtual threads
dataSource.DB_CLOSE_ON_EXIT=false
dataSource.LOCK_MODE=0
dataSource.LOCK_TIMEOUT=10000

# Virtual Thread Testing Support
# These settings enable proper testing of virtual thread behavior with JDBC connections
# Ensures that database integration tests can validate Java 21 virtual thread interactions
allowPoolSuspension=true
registerMbeans=true