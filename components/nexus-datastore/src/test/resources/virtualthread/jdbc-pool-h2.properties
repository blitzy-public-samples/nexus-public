# H2 Database JDBC Connection Pool Configuration for Virtual Threads
# Optimized for Java 21 Virtual Thread testing with H2 database

# Basic connection settings
driverClassName=org.h2.Driver
jdbcUrl=jdbc:h2:mem:nexus;DB_CLOSE_DELAY=-1
username=sa
password=

# Connection pool sizing
# Moderate pool size as virtual threads are lightweight but database connections are still limited resources
maxPoolSize=20
minimumIdle=5

# Connection acquisition settings
# Short timeout to fail fast if no connections are available
connectionTimeout=5000
# Allow connections to be used for a reasonable time before being eligible for eviction
idleTimeout=60000
# Maximum lifetime of a connection to prevent potential memory leaks
maxLifetime=1800000

# Virtual thread optimization settings
# Avoid thread pinning by disabling JMX which uses synchronized methods
registerMbeans=false
# Minimize use of synchronized blocks that can cause virtual thread pinning
allowPoolSuspension=false

# Transaction settings
# Read committed is a good balance for most test scenarios
transactionIsolation=TRANSACTION_READ_COMMITTED
# Auto-commit should be disabled for transactional tests
autoCommit=false

# Connection validation
# Use a fast query for connection testing
connectionTestQuery=SELECT 1
# Test connections before giving them to virtual threads to ensure they're valid
testConnectionOnCheckout=true

# H2-specific settings
# Enable multi-threaded mode for better concurrency with virtual threads
h2.multiThreaded=true
# Optimize for in-memory operations
h2.cacheSize=8192

# Leak detection for tests
# Enable leak detection with a reasonable timeout
leakDetectionThreshold=60000

# Logging settings for debugging virtual thread interactions
# Set to true only when debugging connection issues
metricsTrackerFactory=com.zaxxer.hikari.metrics.micrometer.MicrometerMetricsTrackerFactory