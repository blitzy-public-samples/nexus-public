# Performance Test Configuration for Java 21 Virtual Threads vs Platform Threads
# This configuration is used for benchmarking datastore operations

# ======================================================================
# General Test Configuration
# ======================================================================

# Enable/disable performance testing
performance.testing.enabled=true

# Test duration in seconds
performance.test.duration=60

# Warmup iterations before measurement
performance.warmup.iterations=10

# Measurement iterations for statistics
performance.measurement.iterations=30

# Random seed for reproducible tests
performance.random.seed=42

# ======================================================================
# Thread Configuration
# ======================================================================

# Platform thread pool size for comparison tests
platform.thread.pool.size=200

# Maximum platform threads to test with
platform.thread.max=500

# Platform thread step size for escalation tests
platform.thread.step=50

# Virtual thread maximum count for tests
# Set high as virtual threads are lightweight
virtual.thread.max=10000

# Virtual thread step size for escalation tests
virtual.thread.step=1000

# Thread factory class for platform threads
platform.thread.factory=java.util.concurrent.Executors.defaultThreadFactory()

# Thread factory class for virtual threads
virtual.thread.factory=java.lang.Thread.ofVirtual().factory()

# ======================================================================
# Performance Thresholds and Expectations
# ======================================================================

# Minimum improvement ratio for throughput (operations/second)
# Virtual threads should provide at least this much improvement
performance.threshold.throughput.ratio=1.5

# Minimum improvement for P95 response time (in percent)
# Virtual threads should be at least 30% faster
performance.threshold.p95.improvement=30

# Minimum improvement for P99 response time (in percent)
performance.threshold.p99.improvement=25

# Maximum acceptable error rate (percentage)
performance.threshold.error.rate=0.01

# Minimum concurrent connection ratio
# Virtual threads should support at least 5x more concurrent connections
performance.threshold.concurrency.ratio=5.0

# ======================================================================
# Test Scenario Configuration
# ======================================================================

# Database operations to test (comma-separated)
test.operations=read,write,query,transaction

# Entity types to test (comma-separated)
test.entities=component,asset,blobstore,repository

# Test with increasing load (true/false)
test.escalating.load=true

# Test with constant load (true/false)
test.constant.load=true

# Test with mixed read/write operations (true/false)
test.mixed.operations=true

# ======================================================================
# Timeout Configuration
# ======================================================================

# Operation timeout in milliseconds
operation.timeout.ms=5000

# Connection timeout in milliseconds
connection.timeout.ms=2000

# Test execution timeout in seconds
test.execution.timeout.seconds=300

# ======================================================================
# Metrics Collection Configuration
# ======================================================================

# Enable memory usage tracking
metrics.memory.enabled=true

# Enable CPU usage tracking
metrics.cpu.enabled=true

# Enable thread utilization tracking
metrics.thread.enabled=true

# Enable carrier thread monitoring for virtual threads
metrics.carrier.thread.enabled=true

# Enable thread pinning detection
metrics.thread.pinning.detection=true

# Metrics collection interval in milliseconds
metrics.collection.interval.ms=500

# ======================================================================
# Reporting Configuration
# ======================================================================

# Enable HTML report generation
report.html.enabled=true

# Enable CSV data export
report.csv.enabled=true

# Enable console summary output
report.console.enabled=true

# Report directory (relative to project)
report.directory=target/performance-reports

# Include thread dumps in report
report.include.thread.dumps=true

# Include memory histograms in report
report.include.memory.histograms=true

# ======================================================================
# Database-Specific Configuration
# ======================================================================

# Database connection pool size for platform thread tests
database.platform.connection.pool.size=50

# Database connection pool size for virtual thread tests
# Can be smaller since virtual threads don't block
database.virtual.connection.pool.size=20

# Database statement timeout in seconds
database.statement.timeout.seconds=30

# Database transaction timeout in seconds
database.transaction.timeout.seconds=60

# ======================================================================
# Virtual Thread Specific Configuration
# ======================================================================

# Enable thread pinning detection
virtual.thread.pinning.detection=true

# Maximum carrier thread pool size
virtual.thread.carrier.pool.max=256

# Virtual thread scheduler parallelism
# If not set, defaults to available processors
virtual.thread.scheduler.parallelism=16

# Virtual thread scheduling fairness (true/false)
virtual.thread.scheduler.fairness=true

# JVM flags for virtual thread tests
virtual.thread.jvm.flags=-Djdk.tracePinnedThreads=full -XX:+UnlockExperimentalVMOptions -XX:+UseZGC -XX:+ZGenerational