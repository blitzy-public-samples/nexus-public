# Virtual Thread Pinning Detection Configuration
# This file configures the detection and monitoring of virtual thread pinning
# during tests to identify scenarios where datastore operations inadvertently
# cause virtual threads to pin to carrier threads.

# ======================================================================
# General Configuration
# ======================================================================

# Enable virtual thread pinning detection
pinning.detection.enabled=true

# Minimum duration (in milliseconds) for a pinning event to be reported
# This filters out very short pinning events that don't significantly impact performance
pinning.threshold.duration=20

# Maximum number of pinning events to track in memory
pinning.tracking.maxEvents=1000

# ======================================================================
# JVM Configuration
# ======================================================================

# JVM flag to enable pinning detection with stack traces
# This will be automatically added to test JVM arguments
jvm.flags.pinning=-Djdk.tracePinnedThreads=full

# Additional JVM flags for virtual thread optimization
jvm.flags.virtualThread=-Djdk.virtualThreadScheduler.parallelism=16 -Djdk.virtualThreadScheduler.maxPoolSize=256

# ======================================================================
# Java Flight Recorder (JFR) Configuration
# ======================================================================

# Enable JFR recording for pinning events
jfr.enabled=true

# JFR event name for virtual thread pinning
jfr.event.name=jdk.VirtualThreadPinned

# Enable stack trace capture for pinning events
jfr.stacktrace.enabled=true

# Maximum stack depth to capture
jfr.stacktrace.depth=64

# Duration threshold for JFR event recording (in milliseconds)
jfr.threshold.duration=20

# Maximum age of JFR recording data (in seconds)
jfr.maxage=600

# Maximum size of JFR recording data (in megabytes)
jfr.maxsize=100

# ======================================================================
# Alert Configuration
# ======================================================================

# Enable alerts for pinning events exceeding thresholds
alerts.enabled=true

# Critical threshold for pinning duration (in milliseconds)
# Pinning events exceeding this threshold will trigger critical alerts
alerts.threshold.critical=500

# Warning threshold for pinning duration (in milliseconds)
# Pinning events exceeding this threshold will trigger warning alerts
alerts.threshold.warning=100

# Maximum number of alerts to log per test run
alerts.maxCount=50

# ======================================================================
# Carrier Thread Monitoring
# ======================================================================

# Enable carrier thread monitoring
carrier.monitoring.enabled=true

# Interval for carrier thread utilization sampling (in milliseconds)
carrier.monitoring.interval=1000

# Alert threshold for carrier thread utilization (percentage)
# When carrier thread utilization exceeds this value, an alert will be triggered
carrier.utilization.threshold=80

# ======================================================================
# Known Pinning Patterns
# ======================================================================

# Patterns to identify known causes of pinning in stack traces
# These are regular expressions that will be matched against stack traces

# JDBC driver pinning patterns
patterns.jdbc.1=java\.sql\..*\.getConnection

# Synchronized block pinning patterns
patterns.sync.1=java\.util\.concurrent\.ConcurrentHashMap\.compute.*

# Logging framework pinning patterns
patterns.logging.1=ch\.qos\.logback\.core\.OutputStreamAppender\.append

# Native method pinning patterns
patterns.native.1=sun\.nio\.ch\.FileChannelImpl\..*

# ======================================================================
# Test Integration
# ======================================================================

# Enable automatic test failure on critical pinning events
test.failOnCriticalPinning=false

# Enable detailed pinning reports in test output
test.detailedReports=true

# Include pinning metrics in test results
test.includePinningMetrics=true