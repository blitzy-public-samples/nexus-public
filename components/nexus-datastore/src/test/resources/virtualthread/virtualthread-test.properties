# Virtual Thread Test Configuration for Nexus Repository Datastore
# This file contains configuration properties for virtual thread testing
# of datastore operations as part of the Java 21 migration.

# -----------------------------------------------------------------------
# Virtual Thread Executor Configuration
# -----------------------------------------------------------------------

# Parallelism level for the virtual thread scheduler
# Controls how many carrier threads are available for virtual threads
# Default is set to the number of available processors (0)
# For testing, we can set this to a specific value to control resource usage
virtualthread.scheduler.parallelism=0

# Maximum number of virtual threads to create in the test pool
# Set to 0 for unlimited (bounded only by system memory)
# For high concurrency testing, this allows creating millions of virtual threads
virtualthread.pool.max-size=0

# Minimum number of carrier threads to maintain in the pool
# Ensures responsiveness even under low load conditions
virtualthread.carrier.min-threads=4

# Maximum number of carrier threads to allow
# Prevents excessive resource consumption while still allowing scalability
virtualthread.carrier.max-threads=256

# -----------------------------------------------------------------------
# Thread Monitoring and Debugging
# -----------------------------------------------------------------------

# Enable thread pinning detection
# Detects when virtual threads are pinned to carrier threads, which reduces scalability
virtualthread.pinning.detection.enabled=true

# Capture stack traces when thread pinning is detected
# Helps identify code causing thread pinning for optimization
virtualthread.pinning.stacktrace.enabled=true

# Stack trace depth to capture (0 for full stack trace)
# Full stack traces provide complete context but consume more memory
virtualthread.pinning.stacktrace.depth=0

# Log level for thread pinning events (ERROR, WARN, INFO, DEBUG, TRACE)
# WARN level ensures pinning issues are visible without flooding logs
virtualthread.pinning.log-level=WARN

# Enable thread creation/termination rate tracking
# Provides analytics on virtual thread lifecycle for performance tuning
virtualthread.analytics.enabled=true

# Sampling interval for thread analytics in milliseconds
# Balance between accuracy and overhead
virtualthread.analytics.sampling-interval=1000

# -----------------------------------------------------------------------
# Timeout Settings
# -----------------------------------------------------------------------

# Default timeout for blocking operations in virtual thread context (ms)
# General timeout for operations that don't have a specific timeout
virtualthread.timeout.default=30000

# Database connection timeout in virtual thread context (ms)
# Shorter than query timeout to fail fast on connection issues
virtualthread.timeout.db-connection=5000

# Database query timeout in virtual thread context (ms)
# Prevents long-running queries from consuming resources
virtualthread.timeout.db-query=10000

# Transaction timeout in virtual thread context (ms)
# Longer than individual operations to allow complex transactions to complete
virtualthread.timeout.transaction=15000

# Retry count for operations that can be retried after timeout
# Helps handle transient failures in virtual thread operations
virtualthread.timeout.retry-count=3

# Delay between retries in milliseconds
# Exponential backoff is applied to this base value
virtualthread.timeout.retry-delay=100

# -----------------------------------------------------------------------
# Performance Testing
# -----------------------------------------------------------------------

# Enable performance comparison between platform and virtual threads
# Allows side-by-side comparison of threading models
virtualthread.performance.comparison.enabled=true

# Number of iterations for performance tests
# Higher values provide more statistically significant results
virtualthread.performance.iterations=1000

# Warmup iterations before measuring performance
# Eliminates JIT compilation and class loading overhead from measurements
virtualthread.performance.warmup-iterations=100

# Enable detailed performance metrics collection
# Includes memory usage, GC activity, and thread statistics
virtualthread.performance.detailed-metrics=true

# Concurrency levels to test (comma-separated list)
# Tests scalability across different thread counts
virtualthread.performance.concurrency-levels=10,100,1000,10000

# Enable memory usage tracking during performance tests
# Measures heap and non-heap memory consumption
virtualthread.performance.track-memory=true

# -----------------------------------------------------------------------
# JVM Flags (for reference, set these via JVM arguments)
# -----------------------------------------------------------------------

# Enable tracing of pinned virtual threads with full stack traces
# -Djdk.tracePinnedThreads=full

# Set the parallelism level for the virtual thread scheduler
# -Djdk.virtualThreadScheduler.parallelism=<value>

# Set the maximum pool size for the virtual thread scheduler
# -Djdk.virtualThreadScheduler.maxPoolSize=<value>

# Set the minimum number of runnable virtual threads
# -Djdk.virtualThreadScheduler.minRunnable=<value>

# -----------------------------------------------------------------------
# Database-Specific Settings
# -----------------------------------------------------------------------

# PostgreSQL JDBC driver virtual thread compatibility mode
# Ensures proper operation with virtual threads
virtualthread.jdbc.postgresql.virtual-thread-mode=true

# H2 database virtual thread compatibility settings
virtualthread.jdbc.h2.virtual-thread-mode=true

# Connection pool sizing for virtual thread testing
# Lower than platform thread pools due to reduced overhead
virtualthread.jdbc.connection-pool.size=20

# -----------------------------------------------------------------------
# Test Case Configuration
# -----------------------------------------------------------------------

# Enable virtual thread test suite
virtualthread.test.enabled=true

# Run tests in both virtual and platform thread mode for comparison
virtualthread.test.run-comparison=true

# Maximum test duration in seconds (0 for unlimited)
virtualthread.test.max-duration=300

# Test data volume multiplier for virtual thread tests
# Higher volumes can be tested with virtual threads
virtualthread.test.data-volume-multiplier=10