# HTTP Client Test Properties for Java 21
# Configuration for HTTP client tests with Virtual Thread support

# Global connection settings
http.connection.timeout=30000
http.socket.timeout=60000
http.connection.max=200
http.connection.per.route=20

# Virtual Thread configuration
http.virtualthread.enabled=true
http.virtualthread.name.prefix=nexus-http-vt-

# Thread pool settings (for platform threads when virtual threads not used)
http.threadpool.size=20
http.threadpool.max.size=40
http.threadpool.keep.alive=60000
http.threadpool.name.prefix=nexus-http-

# Retry configuration
http.retry.count=3
http.retry.initial.delay=500
http.retry.max.delay=10000

# Circuit breaker settings
http.circuit.breaker.enabled=true
http.circuit.breaker.failure.threshold=5
http.circuit.breaker.reset.timeout=30000

# Proxy settings (disabled by default in tests)
http.proxy.enabled=false
http.proxy.host=
http.proxy.port=0
http.proxy.username=
http.proxy.password=
http.non.proxy.hosts=localhost|127.0.0.1

# TLS/SSL settings
http.https.protocols=TLSv1.2,TLSv1.3
http.https.ciphersuites=TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256

# User agent configuration
http.user.agent=Nexus-HttpClient-Test/1.0 (Java 21)

# Logging settings for tests
http.request.logging.enabled=true
http.response.logging.enabled=true
http.wire.logging.enabled=false