# SSL/TLS Performance Benchmark Configuration for Java 21 Virtual Threads vs Platform Threads
# This file contains configuration parameters for benchmarking SSL/TLS performance
# with Java 21 Virtual Threads compared to traditional platform threads.

# Thread Factory Configuration
# ---------------------------
thread.factory.virtual=true
thread.factory.platform=false
thread.factory.name.virtual=virtual-thread-factory
thread.factory.name.platform=platform-thread-factory

# Connection Pool Configuration
# ----------------------------
# Maximum number of connections in the pool
connection.pool.max=1000
# Maximum number of connections per route
connection.pool.max.per.route=200
# Connection request timeout in milliseconds
connection.request.timeout=30000
# Connection timeout in milliseconds
connection.timeout=10000
# Socket timeout in milliseconds
socket.timeout=30000

# SSL/TLS Configuration
# ---------------------
# Preferred TLS protocol versions (Java 21 defaults)
ssl.protocols=TLSv1.3,TLSv1.2
# Enable TLS session reuse
ssl.session.reuse=true
# Enable TLS session tickets (improves handshake performance)
ssl.session.tickets=true
# Enable OCSP stapling
ssl.ocsp.stapling=true
# Enable SNI extension
ssl.sni.enabled=true

# Performance Test Parameters
# --------------------------
# Number of concurrent connections for testing
test.concurrent.connections=500
# Number of connections to increment by in each test step
test.connection.step.size=100
# Maximum number of concurrent connections to test
test.max.concurrent.connections=2000
# Number of warm-up iterations before measurement
test.warmup.iterations=10
# Number of measurement iterations
test.measurement.iterations=30
# Test duration in seconds
test.duration.seconds=60
# Ramp-up period in seconds
test.rampup.seconds=10

# Performance Targets
# ------------------
# Expected minimum throughput improvement with Virtual Threads (percentage)
target.throughput.improvement=30
# Expected maximum response time improvement with Virtual Threads (percentage)
target.response.time.improvement=25
# Expected maximum memory utilization improvement with Virtual Threads (percentage)
target.memory.utilization.improvement=70
# Maximum acceptable error rate (percentage)
target.max.error.rate=0.1
# P95 response time target for Virtual Threads (milliseconds)
target.p95.response.time.virtual=350
# P95 response time target for Platform Threads (milliseconds)
target.p95.response.time.platform=500
# P99 response time target for Virtual Threads (milliseconds)
target.p99.response.time.virtual=600
# P99 response time target for Platform Threads (milliseconds)
target.p99.response.time.platform=800

# Thread Pinning Detection
# -----------------------
# Enable thread pinning detection
thread.pinning.detection=true
# Log thread pinning events
thread.pinning.logging=true
# Threshold for thread pinning warnings (milliseconds)
thread.pinning.threshold.ms=100

# Test Server Configuration
# ------------------------
# Test server host
test.server.host=localhost
# Test server port
test.server.port=8443
# Test server path
test.server.path=/benchmark
# Test server protocol
test.server.protocol=https
# Test request method
test.request.method=GET

# Reporting Configuration
# ----------------------
# Enable HTML report generation
report.html.enabled=true
# Enable CSV report generation
report.csv.enabled=true
# Report output directory
report.output.dir=target/ssl-benchmark-reports
# Include thread dumps in report
report.include.thread.dumps=true
# Include memory usage in report
report.include.memory.usage=true
# Include GC statistics in report
report.include.gc.stats=true