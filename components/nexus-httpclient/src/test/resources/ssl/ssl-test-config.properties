# SSL Test Configuration for Nexus Repository Manager
# Updated for Java 21 compatibility

# Standard keystore and truststore passwords for test automation
keystore.password=changeit
truststore.password=changeit

# TLS Protocol Configuration
# TLS 1.3 is primary with TLS 1.2 as fallback (Security Architecture 6.4.3)
enabled.protocols=TLSv1.3,TLSv1.2

# TLS 1.3 Cipher Suites (optimized for Java 21)
# Order matters - preferred ciphers should be listed first
tls13.cipher.suites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256

# TLS 1.2 Fallback Cipher Suites (for compatibility)
# Prioritizing GCM suites with forward secrecy (ECDHE)
tls12.cipher.suites=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256

# Test Server Configuration
test.server.hostname=localhost
test.server.port=8443
test.client.port=0

# Virtual Thread Testing Configuration (Testing Strategy 6.6.1.1)
virtual.thread.enabled=true
virtual.thread.pool.size=100

# Keystore and Truststore Paths (relative to test resources)
keystore.path=ssl/test-keystore.jks
truststore.path=ssl/test-truststore.jks

# Certificate Configuration
certificate.common.name=localhost
certificate.organization=Sonatype
certificate.organizational.unit=Nexus
certificate.locality=Fulton
certificate.state=MD
certificate.country=US

# Connection Timeout Settings
connection.timeout.ms=30000
read.timeout.ms=30000

# Hostname Verification Settings
hostname.verification.enabled=true

# Debug Settings
ssl.debug.enabled=false