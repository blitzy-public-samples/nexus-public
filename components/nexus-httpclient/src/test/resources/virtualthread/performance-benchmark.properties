# ============================================================================
# Nexus HTTP Client Performance Benchmark Configuration
# Comparing Platform Threads vs. Virtual Threads for Java 21
# 
# This configuration file provides settings for benchmarking HTTP client
# performance with Java 21 Virtual Threads compared to traditional Platform
# Threads. It supports the Technical Specification requirements for
# quantitative validation of throughput improvements and connection scaling
# efficiency with Virtual Threads.
# ============================================================================

# ============================================================================
# Client Concurrency Configuration
# 
# These settings control the number of concurrent clients and threads used
# during benchmark testing. The escalating client load allows measuring
# performance at different concurrency levels to validate Virtual Thread
# scaling capabilities compared to Platform Threads.
# ============================================================================

# Escalating client load levels for comparative testing
# Starting with a small number of clients and increasing to test scalability
benchmark.client.load.start=10
benchmark.client.load.step=50
benchmark.client.load.max=1000

# Thread pool sizes for platform thread testing
# These define the min/max thread pool sizes for traditional platform thread testing
benchmark.platform.thread.pool.min=10
benchmark.platform.thread.pool.max=200

# Virtual thread configuration
# Controls the carrier thread pool for virtual threads
# Parallelism sets the number of platform threads used to run virtual threads
# MaxPoolSize limits the maximum number of carrier threads that can be created
benchmark.virtual.thread.scheduler.parallelism=16
benchmark.virtual.thread.scheduler.maxPoolSize=256

# ============================================================================
# Iteration Settings
# 
# These settings define the number of warm-up and measurement iterations
# for reliable benchmarking. Warm-up iterations allow JIT compilation to
# stabilize before actual measurements begin, ensuring more consistent and
# accurate results for comparing thread models.
# ============================================================================

# Warm-up iterations to ensure JIT compilation and stable measurements
benchmark.warmup.iterations=10

# Measurement iterations for actual benchmarking
benchmark.measurement.iterations=20

# Duration settings
benchmark.iteration.time.seconds=5
benchmark.timeout.seconds=300

# ============================================================================
# Performance Thresholds
# 
# These thresholds define the expected performance improvements when using
# Virtual Threads compared to Platform Threads. They are based on the
# Technical Specification requirements and will be used to validate that
# the implementation meets or exceeds the expected performance targets.
# ============================================================================

# Response time thresholds (milliseconds)
# P95/P99 response time targets based on Technical Specification requirements
# Virtual threads should provide at least 30% improvement in response times
benchmark.threshold.response.p95.platform=500
benchmark.threshold.response.p95.virtual=350
benchmark.threshold.response.p99.platform=800
benchmark.threshold.response.p99.virtual=600

# Throughput expectations (operations per second)
# Virtual threads should provide at least 50% higher throughput
# compared to platform threads at high concurrency levels
benchmark.threshold.throughput.improvement.factor=1.5

# Memory utilization targets (MB)
# Virtual threads should use significantly less memory than platform threads
# when handling the same number of concurrent connections
benchmark.threshold.memory.platform=1000
benchmark.threshold.memory.virtual=300

# Thread scaling efficiency (percentage)
# Virtual threads should maintain high efficiency (>90%) even as
# concurrency increases, unlike platform threads which degrade
benchmark.threshold.scaling.efficiency=90

# ============================================================================
# HTTP Client Test Configuration
# 
# These settings configure the HTTP client behavior during benchmarking,
# including connection timeouts, pool sizes, and simulated network conditions.
# These parameters ensure realistic testing of HTTP client performance under
# various conditions that might be encountered in production environments.
# ============================================================================

# HTTP connection settings
benchmark.http.connection.timeout.ms=5000
benchmark.http.socket.timeout.ms=30000
benchmark.http.request.timeout.ms=60000

# Connection pool settings
benchmark.http.connection.pool.max=200
benchmark.http.connection.max.per.route=50

# Test endpoint configuration
benchmark.http.test.endpoint.count=5
benchmark.http.test.payload.size.bytes=1024

# Simulated network conditions
benchmark.http.network.latency.ms=50
benchmark.http.network.bandwidth.kbps=1000

# ============================================================================
# Reporting Configuration
# 
# These settings control how benchmark results are reported and visualized.
# The configuration supports multiple output formats including HTML charts
# for visual comparison of Platform Thread vs. Virtual Thread performance
# across different concurrency levels and metrics.
# ============================================================================

# Output directory for benchmark results
benchmark.report.output.dir=target/benchmark-reports

# Report file names
benchmark.report.html.filename=http-client-benchmark-results.html
benchmark.report.csv.filename=http-client-benchmark-results.csv
benchmark.report.json.filename=http-client-benchmark-results.json

# Chart configuration
benchmark.report.chart.width=1200
benchmark.report.chart.height=800
benchmark.report.chart.title=HTTP Client Performance: Platform vs. Virtual Threads

# ============================================================================
# JVM Configuration Hints
# 
# These are recommended JVM flags for optimal Virtual Thread performance
# during benchmark testing. These settings help configure the Virtual Thread
# scheduler, enable thread pinning detection, and optimize garbage collection
# for the benchmark environment.
# ============================================================================

# Recommended JVM flags for virtual thread testing
# -Djdk.virtualThreadScheduler.parallelism=16       # Set carrier thread count
# -Djdk.virtualThreadScheduler.maxPoolSize=256      # Maximum carrier threads
# -Djdk.tracePinnedThreads=full                     # Detect thread pinning issues
# -XX:+UseZGC                                       # Use Z Garbage Collector
# -XX:+ZGenerational                                # Enable generational ZGC