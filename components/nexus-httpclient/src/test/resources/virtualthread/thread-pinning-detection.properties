# ============================================================================
# Nexus HTTP Client Thread Pinning Detection Configuration
# For Java 21 Virtual Thread Testing
# 
# This configuration file provides settings for detecting and monitoring
# thread pinning issues in Virtual Thread tests of the HTTP client. It supports
# the Technical Specification requirements for verifying that thread pinning
# is minimized and identifying performance bottlenecks in I/O operations.
# ============================================================================

# ============================================================================
# Thread Pinning Detection Thresholds
# 
# These settings control the sensitivity of thread pinning detection.
# Thresholds determine how long a virtual thread must be pinned before
# it is reported, allowing focus on pinning events that have significant
# performance impact while ignoring brief pinning that is less problematic.
# ============================================================================

# Minimum duration (in milliseconds) for a pinning event to be reported
# Short-lived pinning events may not significantly impact performance
pinning.detection.threshold.ms=20

# Threshold for warning level pinning events (milliseconds)
# Pinning events exceeding this duration trigger warning-level alerts
pinning.detection.warning.threshold.ms=100

# Threshold for critical level pinning events (milliseconds)
# Pinning events exceeding this duration trigger critical-level alerts
pinning.detection.critical.threshold.ms=500

# Maximum number of pinning events to report per test run
# Prevents overwhelming logs when many pinning events occur
pinning.detection.max.events=1000

# ============================================================================
# Stack Trace Capture Configuration
# 
# These settings control how stack traces are captured and reported for
# pinning events. Stack traces help identify the code causing pinning,
# but full traces can be verbose, so options are provided to control
# the level of detail captured.
# ============================================================================

# Enable stack trace capture for pinning events
# When enabled, stack traces are captured for each pinning event
pinning.stacktrace.enabled=true

# Stack trace capture mode (full, filtered, or minimal)
# - full: Captures complete stack trace
# - filtered: Captures stack trace with common framework calls filtered out
# - minimal: Captures only the frames most likely related to pinning
pinning.stacktrace.mode=filtered

# Maximum stack depth to capture
# Limits the number of frames in captured stack traces
pinning.stacktrace.max.depth=50

# Include JDK internal frames in stack traces
# When enabled, includes frames from JDK internal classes
pinning.stacktrace.include.jdk.frames=true

# Highlight synchronized blocks and native methods in stack traces
# Makes it easier to identify potential causes of pinning
pinning.stacktrace.highlight.pinning.causes=true

# ============================================================================
# Monitoring Interval Settings
# 
# These settings control how frequently the system checks for pinned threads
# and inspects carrier thread states. More frequent checks provide more
# detailed data but may introduce more overhead.
# ============================================================================

# Interval for checking thread states (milliseconds)
# How frequently the system inspects thread states to detect pinning
pinning.monitoring.check.interval.ms=100

# Duration of monitoring after test start (milliseconds)
# How long monitoring continues after a test begins
pinning.monitoring.duration.ms=60000

# Sampling rate for carrier thread state inspection (percentage)
# Reduces overhead by only sampling a percentage of checks
pinning.monitoring.sampling.rate=100

# Enable continuous monitoring throughout test execution
# When disabled, monitoring only occurs during specific test phases
pinning.monitoring.continuous=true

# ============================================================================
# Warning Thresholds for Thread Mounting Time
# 
# These settings define thresholds for excessive thread mounting time,
# which can indicate performance issues with the virtual thread scheduler.
# Mounting time is how long it takes to mount a virtual thread onto a
# carrier platform thread.
# ============================================================================

# Warning threshold for thread mounting time (milliseconds)
# Mounting operations exceeding this threshold trigger warnings
pinning.mounting.warning.threshold.ms=5

# Critical threshold for thread mounting time (milliseconds)
# Mounting operations exceeding this threshold trigger critical alerts
pinning.mounting.critical.threshold.ms=20

# Maximum acceptable percentage of time spent mounting threads
# Tests exceeding this percentage may indicate scheduler inefficiency
pinning.mounting.max.percentage=5

# ============================================================================
# Pinning Event Capture Parameters
# 
# These settings control how pinning events are captured, stored, and
# reported. They determine the level of detail recorded for each event
# and how the data is presented for analysis.
# ============================================================================

# Enable detailed event capture for pinning events
# When enabled, captures additional metadata for each pinning event
pinning.event.detailed.capture=true

# Capture thread context information with pinning events
# Includes information about what the thread was doing when pinned
pinning.event.capture.context=true

# Group similar pinning events in reports
# Consolidates similar events to make reports more readable
pinning.event.group.similar=true

# Include carrier thread information in pinning events
# Helps identify patterns in which carrier threads experience pinning
pinning.event.include.carrier.info=true

# ============================================================================
# Reporting and Logging Configuration
# 
# These settings control how pinning events are reported and logged.
# Options include console output, file logging, and integration with
# monitoring systems for real-time alerting.
# ============================================================================

# Enable console logging of pinning events
# When enabled, pinning events are logged to the console
pinning.reporting.console.enabled=true

# Console logging level (INFO, WARNING, SEVERE)
# Determines the minimum severity level for console logging
pinning.reporting.console.level=WARNING

# Enable file logging of pinning events
# When enabled, pinning events are logged to a file
pinning.reporting.file.enabled=true

# File path for pinning event logs
# Where pinning event logs are stored
pinning.reporting.file.path=target/pinning-events.log

# Enable summary report generation
# When enabled, generates a summary report of pinning events
pinning.reporting.summary.enabled=true

# Summary report format (text, html, json)
# Format of the generated summary report
pinning.reporting.summary.format=html

# ============================================================================
# JVM Configuration Hints
# 
# These are recommended JVM flags for thread pinning detection during testing.
# These settings help configure the JVM to detect and report thread pinning
# issues effectively.
# ============================================================================

# Recommended JVM flags for thread pinning detection
# -Djdk.tracePinnedThreads=full       # Enable full stack traces for pinned threads
# -Djdk.virtualThreadScheduler.maxPoolSize=256  # Maximum carrier threads
# -Djdk.virtualThreadScheduler.parallelism=16   # Set carrier thread count
# -XX:+UnlockDiagnosticVMOptions      # Required for some advanced options
# -XX:+DebugNonSafepoints             # Improves accuracy of stack traces