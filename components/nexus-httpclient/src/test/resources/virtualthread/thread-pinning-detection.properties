# Thread Pinning Detection Configuration for Virtual Thread Tests
# This file configures detection and monitoring of thread pinning in HTTP client operations

# ===== Pinning Detection Thresholds =====

# Minimum duration (in milliseconds) for a pinning event to be logged
# Shorter pinning events are common and usually not problematic
pinning.threshold.log=20

# Threshold (in milliseconds) for pinning events to trigger warnings
# Pinning events longer than this are considered potentially problematic
pinning.threshold.warn=100

# Threshold (in milliseconds) for pinning events to trigger errors
# Pinning events longer than this are considered severe performance issues
pinning.threshold.error=500

# ===== Stack Trace Configuration =====

# Whether to capture full stack traces for pinning events (true/false)
pinning.stacktrace.enabled=true

# Maximum depth of stack traces to capture
# Lower values reduce memory usage but provide less diagnostic information
pinning.stacktrace.maxDepth=50

# Whether to filter stack traces to show only relevant frames (true/false)
# When enabled, only frames related to pinning causes are shown
pinning.stacktrace.filtered=false

# ===== Monitoring Configuration =====

# Interval (in milliseconds) for checking carrier thread states
# Lower values provide more accurate detection but increase overhead
pinning.monitor.interval=100

# Maximum number of pinning events to track simultaneously
# Higher values consume more memory but prevent event loss under high load
pinning.monitor.maxEvents=1000

# Whether to monitor thread mounting time (true/false)
pinning.monitor.mountingTime=true

# Threshold (in milliseconds) for excessive thread mounting time warnings
pinning.threshold.mountingTime=10

# ===== Reporting Configuration =====

# Whether to log pinning events to the application log (true/false)
pinning.reporting.log=true

# Whether to emit JMX metrics for pinning events (true/false)
pinning.reporting.jmx=true

# Whether to include pinning events in health checks (true/false)
pinning.reporting.healthcheck=true

# ===== HTTP Client Specific Configuration =====

# Whether to monitor pinning in connection establishment operations (true/false)
pinning.http.monitorConnections=true

# Whether to monitor pinning in request execution operations (true/false)
pinning.http.monitorRequests=true

# Whether to monitor pinning in response processing operations (true/false)
pinning.http.monitorResponses=true

# Whether to detect pinning in SSL/TLS handshake operations (true/false)
pinning.http.monitorTlsHandshake=true

# ===== JFR Integration =====

# Whether to emit JFR events for pinning detection (true/false)
pinning.jfr.enabled=true

# Threshold (in milliseconds) for emitting JFR events
# This should typically match pinning.threshold.log
pinning.jfr.threshold=20

# Whether to include stack traces in JFR events (true/false)
pinning.jfr.includeStackTrace=true

# ===== Advanced Configuration =====

# Whether to attempt automatic mitigation of detected pinning (true/false)
# When enabled, the system will try to reduce the impact of pinning
pinning.mitigation.enabled=false

# Maximum number of carrier threads to allocate for pinned operations
# Higher values reduce the impact of pinning but increase resource usage
pinning.mitigation.maxCarrierThreads=16

# Whether to log detailed diagnostics about pinning causes (true/false)
pinning.diagnostics.detailed=true

# Whether to track historical pinning patterns (true/false)
pinning.diagnostics.trackHistory=true

# Maximum number of historical pinning events to retain
pinning.diagnostics.historySize=100