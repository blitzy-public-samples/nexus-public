# Virtual Thread Configuration for HTTP Client Tests

# Scheduler parallelism - controls the number of carrier threads per CPU core
# Default is 1, but can be increased for I/O-heavy workloads
jdk.virtualThreadScheduler.parallelism=4

# Maximum pool size for virtual thread scheduler
# Default is 256, but can be adjusted based on test requirements
jdk.virtualThreadScheduler.maxPoolSize=512

# Thread factory configuration
test.virtualthread.factory.enabled=true
test.virtualthread.factory.namePrefix=HttpClient-VT-

# System properties to toggle between platform and virtual threads for comparison testing
test.virtualthread.enabled=true
test.platformthread.enabled=false

# Pinning detection for debugging thread issues
jdk.tracePinnedThreads=short

# HTTP client specific settings
http.client.virtualthread.connectionTimeout=30000
http.client.virtualthread.socketTimeout=30000
http.client.virtualthread.maxConnections=10000
http.client.virtualthread.maxConnectionsPerRoute=1000

# Thread pool sizing for HTTP operations
http.client.virtualthread.connectionManagerMaxTotal=10000
http.client.virtualthread.connectionManagerDefaultMaxPerRoute=1000

# Performance testing configuration
test.virtualthread.performance.concurrentClients=1000
test.virtualthread.performance.requestsPerClient=100
test.virtualthread.performance.warmupIterations=10