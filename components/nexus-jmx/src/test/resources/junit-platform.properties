# JUnit 5 (Jupiter) configuration for parallel test execution with virtual threads
# This enables Java 21 virtual thread capabilities for JMX tests

# Test instance lifecycle - use per_method to ensure isolated test instances
junit.jupiter.testinstance.lifecycle.default=per_method

# Enable parallel test execution
junit.jupiter.execution.parallel.enabled=true

# Run tests concurrently by default
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Use dynamic parallelism strategy for optimal virtual thread utilization
junit.jupiter.execution.parallel.config.strategy=dynamic

# Configure maximum pool size for carrier threads
# This allows many virtual threads to be scheduled efficiently
junit.jupiter.execution.parallel.config.dynamic.factor=1.0

# Enable extension auto-detection
junit.jupiter.extensions.autodetection.enabled=true

# Configure virtual thread support
junit.virtualthread.enabled=true