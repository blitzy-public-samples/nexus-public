# JUnit 5 Platform configuration for Java 21 Virtual Thread support

# Test instance lifecycle - use per_method to ensure isolated test instances
junit.jupiter.testinstance.lifecycle.default=per_method

# Enable parallel test execution
junit.jupiter.execution.parallel.enabled=true

# Run tests concurrently by default
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Use dynamic strategy for thread allocation based on available processors
junit.jupiter.execution.parallel.config.strategy=dynamic

# Set factor for dynamic thread allocation (multiplied by available processors)
junit.jupiter.execution.parallel.config.dynamic.factor=2

# Configure maximum pool size for virtual threads
junit.jupiter.execution.parallel.config.dynamic.max-pool-size=256

# Enable auto-detection of test extensions
junit.jupiter.extensions.autodetection.enabled=true

# Configure virtual thread specific settings
jdk.virtualThreadScheduler.parallelism=16
jdk.virtualThreadScheduler.maxPoolSize=256

# Enable thread pinning detection for virtual threads
jdk.tracePinnedThreads=short