# JMX Virtual Thread Test Configuration
# Properties for testing JMX operations under Java 21 virtual threads

#-----------------------------------------------------------------------
# Virtual Thread Pool Configuration
#-----------------------------------------------------------------------

# Maximum number of virtual threads to create during testing
vthread.pool.size=10000

# Maximum carrier thread pool size (platform threads that host virtual threads)
vthread.carrier.pool.size=256

# Virtual thread scheduler parallelism (defaults to available processors)
vthread.scheduler.parallelism=16

# Whether to use unmounted mode for virtual threads
vthread.unmounted.mode=true

# Timeout in milliseconds for virtual thread operations
vthread.operation.timeout=5000

#-----------------------------------------------------------------------
# Thread Pinning Detection Configuration
#-----------------------------------------------------------------------

# Enable detection of thread pinning during JMX operations
vthread.pinning.detection.enabled=true

# Threshold in milliseconds to consider a virtual thread as pinned
vthread.pinning.threshold.ms=100

# Maximum number of stack traces to capture for pinned threads
vthread.pinning.max.stack.traces=50

# Whether to log stack traces for pinned threads
vthread.pinning.log.stack.traces=true

# Whether to fail tests when thread pinning is detected
vthread.pinning.fail.on.detection=false

#-----------------------------------------------------------------------
# Test Concurrency Parameters
#-----------------------------------------------------------------------

# Number of concurrent JMX operations to execute
test.concurrency.operations=1000

# Number of warmup iterations before measurement
test.warmup.iterations=10

# Number of measurement iterations
test.measurement.iterations=30

# Test duration in seconds (0 for iteration-based only)
test.duration.seconds=60

# Ramp-up period in seconds
test.rampup.seconds=5

#-----------------------------------------------------------------------
# MBean Test Configuration
#-----------------------------------------------------------------------

# Comma-separated list of MBean domains to test
test.mbean.domains=org.sonatype.nexus,java.lang,com.sun.management

# Comma-separated list of MBean attribute access patterns to test (read, write, readwrite)
test.mbean.attribute.patterns=read,readwrite

# Comma-separated list of MBean operation patterns to test
test.mbean.operation.patterns=noargs,primitive,complex

# Maximum depth for complex object graphs in operation parameters
test.mbean.operation.max.depth=3

# Maximum collection size for operation parameters
test.mbean.operation.max.collection.size=100

#-----------------------------------------------------------------------
# Performance Comparison Configuration
#-----------------------------------------------------------------------

# Enable comparison between platform threads and virtual threads
test.comparison.enabled=true

# Number of platform threads to use for comparison
test.comparison.platform.threads=200

# Minimum performance improvement factor expected for virtual threads
test.comparison.min.improvement.factor=1.5

# Whether to generate performance comparison charts
test.comparison.generate.charts=true

#-----------------------------------------------------------------------
# Reporting Configuration
#-----------------------------------------------------------------------

# Directory for test reports relative to project root
test.report.directory=target/vthread-test-reports

# Enable detailed logging of test execution
test.report.detailed.logging=true

# Enable JFR recording during tests
test.jfr.recording.enabled=true

# JFR recording file path
test.jfr.recording.path=target/vthread-test-jfr.jfr

# JFR recording settings profile (default, profile, or custom path)
test.jfr.recording.settings=profile