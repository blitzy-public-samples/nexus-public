# JDBC Connection Pool Configuration for H2 Database with Virtual Threads
# Optimized for repository content operations in Java 21 environment

# Basic Connection Settings
# -----------------------
driverClassName=org.h2.Driver
url=jdbc:h2:mem:content;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
username=sa
password=

# Connection Pool Size
# -------------------
# Optimized for virtual threads - smaller pool size is sufficient since
# virtual threads are more efficient with I/O operations
# Virtual threads can handle many more concurrent operations with fewer connections
maximumPoolSize=20
minimumIdle=5

# Connection Lifecycle
# -------------------
# Shorter max lifetime for connections to prevent stale connections
# With virtual threads, connections can be recycled more frequently
maxLifetime=1800000
# Idle timeout reduced for more efficient resource usage with virtual threads
# Virtual threads release resources quickly when idle
idleTimeout=600000
# Connection timeout optimized for content operations
# Virtual threads can handle more concurrent connection attempts
connectionTimeout=10000

# Statement and Transaction Settings
# ---------------------------------
# Enable prepared statement caching for repository content queries
# Optimized for content query patterns in repository operations
cachePrepStmts=true
prepStmtCacheSize=250
prepStmtCacheSqlLimit=2048
# Transaction isolation level appropriate for content repository operations
# READ_COMMITTED provides good balance between consistency and concurrency
transactionIsolation=TRANSACTION_READ_COMMITTED

# Connection Testing and Validation
# --------------------------------
# More aggressive connection testing for virtual thread environment
# Ensures connections remain valid when used across many virtual threads
connectionTestQuery=SELECT 1
validationTimeout=5000
# Leak detection threshold reduced for virtual thread environment
# Helps identify connection leaks that may occur with virtual threads
leakDetectionThreshold=30000
# Enable faster connection validation for virtual threads
# Reduces overhead when validating connections in a virtual thread context
fastConnectionFailover=true

# Virtual Thread Specific Optimizations
# ------------------------------------
# Avoid thread local usage which can cause issues with virtual threads
# Thread locals in virtual threads can lead to excessive connection creation
useThreadLocals=false
# Maximize throughput for content browsing and search scenarios
# Allows for dynamic adjustment of pool size based on load
maximumPoolSize.override=30
# Allow virtual threads to fully utilize connection pool
# Prevents artificial limitations on virtual thread concurrency
allowPoolSuspension=false
# Register MBeans for monitoring connection pool performance with virtual threads
# Important for observing virtual thread behavior with connection pool
registerMbeans=true

# H2-Specific Settings
# -------------------
# H2 database specific settings optimized for content repository
# Enhanced prepared statement caching for repository content queries
dataSource.cachePrepStmts=true
dataSource.prepStmtCacheSize=250
dataSource.prepStmtCacheSqlLimit=2048
dataSource.useServerPrepStmts=true
# H2 specific optimizations for virtual threads
dataSource.useThreadLocalConnections=false
dataSource.poolPreparedStatements=true
dataSource.maxOpenPreparedStatements=100

# Virtual Thread Compatibility Settings
# -----------------------------------
# Ensure compatibility with Java 21 virtual threads
# Auto-commit reduces the chance of pinning virtual threads during transactions
autoCommit=true
# Minimize connection acquisition contention with virtual threads
# Helps maintain connection availability for high-throughput virtual thread operations
keepaliveTime=30000
# Avoid pinning virtual threads with synchronized blocks
# Reduces the chance of virtual thread carrier thread blocking
minimizeJoin=true