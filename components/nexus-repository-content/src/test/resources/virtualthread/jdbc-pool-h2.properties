# HikariCP configuration for H2 database optimized for repository content operations with Java 21 Virtual Threads

# Connection Pool Size Settings
# Optimized for repository content operations which typically involve many concurrent read operations
# and fewer write operations
maximumPoolSize=30
minimumIdle=8

# Connection Timeout Settings
# Reduced timeouts to minimize Virtual Thread pinning during content operations
connectionTimeout=2000
validationTimeout=1000
initializationFailTimeout=2000

# Idle Timeout and Max Lifetime
# Configured for repository content access patterns
# Content operations often have bursts of activity followed by periods of lower usage
idleTimeout=45000
maxLifetime=900000

# Connection Test Query
# Simple query that executes quickly to validate connections
connectionTestQuery=SELECT 1

# Auto-commit behavior
# Set to false for better transaction control in content operations
autoCommit=false

# Transaction Isolation
# TRANSACTION_READ_COMMITTED provides a good balance for content repository operations
# where consistency is important but maximum concurrency is also needed
transactionIsolation=TRANSACTION_READ_COMMITTED

# Metrics Tracking for Virtual Thread Performance Analysis with content operations
registerMbeans=true
metricsTrackerFactory=com.zaxxer.hikari.metrics.prometheus.PrometheusMetricsTrackerFactory

# Leak Detection Threshold
# Content operations can be long-running, so set a higher threshold
leakDetectionThreshold=60000

# Connection Initialization
# Minimize connection initialization time to reduce Virtual Thread pinning
initializationFailFast=true

# Allow pool suspension - useful for testing Virtual Thread behavior with content operations
allowPoolSuspension=true

# Statement Cache Size
# Larger cache for content operations which often use similar queries repeatedly
dataSource.prepStmtCacheSize=250
dataSource.prepStmtCacheSqlLimit=2048

# Virtual Thread Specific Optimizations
# These settings help minimize thread pinning and improve performance with Virtual Threads

# Use a small number of connection acquisition retries to avoid excessive pinning
acquisitionRetryAttempts=3

# Short delay between acquisition attempts
acquisitionRetryDelay=250

# Keep statistics for Virtual Thread performance analysis with content operations
recordMetrics=true

# Catalog configuration for H2 database
catalog=PUBLIC

# Pool name for identification in logs and metrics
poolName=H2ContentVirtualThreadPool

# Use fair scheduling for connection acquisition to prevent starvation
# Important for content operations which may have varying execution times
fairQueue=true

# Enable exception handling for Virtual Thread interruptions
exceptionOverrideClassName=org.sonatype.nexus.datastore.mybatis.VirtualThreadExceptionHandler

# Content-specific optimizations

# Batch operations settings optimized for content operations
dataSource.useServerPrepStmts=true
dataSource.cachePrepStmts=true
dataSource.cacheResultSetMetadata=true
dataSource.cacheServerConfiguration=true

# Fetch size optimized for content browsing and search operations
dataSource.defaultFetchSize=100

# Timeout settings for content operations
# Content operations may involve larger data transfers
dataSource.socketTimeout=60000
dataSource.loginTimeout=10000
dataSource.queryTimeout=30000

# Enable batch operations for content uploads and downloads
dataSource.rewriteBatchedStatements=true
dataSource.useBatchMultiSend=true

# Optimize for read-heavy content operations
dataSource.useReadAheadInput=true

# Disable auto-reconnect to prevent Virtual Thread pinning during reconnection attempts
dataSource.autoReconnect=false

# Set appropriate transaction isolation for content operations
dataSource.defaultTransactionIsolation=2

# Enable result set streaming for large content queries
dataSource.useStreamLengthsInPrepStmts=true

# Optimize network buffer sizes for content transfers
dataSource.tcpKeepAlive=true
dataSource.tcpNoDelay=true

# Disable unnecessary features to reduce overhead
dataSource.useCompression=false
dataSource.useSSL=false

# Enable Virtual Thread-friendly connection validation
dataSource.testOnBorrow=true
dataSource.testWhileIdle=true
dataSource.validationInterval=5000