# PostgreSQL JDBC Connection Pool Configuration for Virtual Threads (Java 21)
# Optimized for repository content operations with Sonatype Nexus

#-----------------------------------------------------------------------
# Basic connection settings
#-----------------------------------------------------------------------
driverClassName=org.postgresql.Driver
validationQuery=SELECT 1
testOnBorrow=true
testWhileIdle=true
testOnReturn=false

#-----------------------------------------------------------------------
# Connection pool sizing optimized for virtual threads
#-----------------------------------------------------------------------
# Virtual threads are lightweight, but database connections are still a limited resource
# Setting a reasonable pool size prevents database connection exhaustion
# For repository content operations, this is tuned for high throughput I/O operations
maxPoolSize=50
initialSize=10
minIdle=10
maxWait=10000

#-----------------------------------------------------------------------
# Connection acquisition settings
#-----------------------------------------------------------------------
# Shorter timeout for virtual threads to fail fast and allow other operations to proceed
# Virtual threads can handle many more concurrent operations, so quick failure is important
connectionTimeout=10000
validationTimeout=5000

#-----------------------------------------------------------------------
# Connection lifecycle management
#-----------------------------------------------------------------------
# Shorter max lifetime to ensure connections are refreshed regularly
# This helps prevent stale connections when using virtual threads
maxLifetime=1800000
idleTimeout=600000

# Time between eviction runs - check for idle connections to close or validate
# More frequent for virtual threads to ensure pool health with high concurrency
timeBetweenEvictionRunsMillis=30000
minEvictableIdleTimeMillis=60000

#-----------------------------------------------------------------------
# Leak detection and prevention
#-----------------------------------------------------------------------
# Important for virtual threads which may be created in large numbers
# Virtual threads make it easier to accidentally leak connections
leakDetectionThreshold=60000

#-----------------------------------------------------------------------
# Transaction settings
#-----------------------------------------------------------------------
# Transaction isolation level appropriate for repository content operations
# READ_COMMITTED provides a good balance for content repository operations
defaultTransactionIsolation=READ_COMMITTED
autoCommit=false

#-----------------------------------------------------------------------
# Statement cache settings
#-----------------------------------------------------------------------
# Optimized for repository content query patterns
# Content repositories often use a limited set of queries repeatedly
prepStmtCacheSize=250
prepStmtCacheSqlLimit=2048
cachePrepStmts=true

#-----------------------------------------------------------------------
# Virtual thread specific optimizations
#-----------------------------------------------------------------------
# Avoid thread starvation by using fair scheduling for connection acquisition
# Critical for virtual threads to ensure fair distribution of database connections
fairQueue=true

# Avoid connection leaks with proper handling of abandoned connections
# Virtual threads make it easier to create many concurrent operations
removeAbandoned=true
removeAbandonedTimeout=300
logAbandoned=true

# Monitoring and metrics for virtual thread connection usage
registerMbeans=true
allowPoolSuspension=false

# Avoid pinning virtual threads with synchronized blocks
# These settings help prevent virtual thread pinning issues
useLocalSessionState=true
useServerPrepStmts=true

#-----------------------------------------------------------------------
# PostgreSQL specific optimizations
#-----------------------------------------------------------------------
# Optimize batch operations for content storage
reWriteBatchedInserts=true

# Optimize network settings for virtual threads
tcpKeepAlive=true
socketTimeout=60000
connectTimeout=10000

# Enable PostgreSQL specific features for better performance
preferQueryMode=extended

#-----------------------------------------------------------------------
# JDBC interceptors for monitoring and performance
#-----------------------------------------------------------------------
# Add interceptors for connection state tracking and statement finalization
# These help manage resources properly with virtual threads
jdbcInterceptors=org.apache.tomcat.jdbc.pool.interceptor.ConnectionState;org.apache.tomcat.jdbc.pool.interceptor.StatementFinalizer