# Performance Test Configuration for Repository Content Operations
# Comparing Platform Threads vs Virtual Threads (Java 21)

#-------------------------------------------------------
# General Test Configuration
#-------------------------------------------------------
performance.test.enabled=true
performance.test.iterations=5
performance.test.warmup.iterations=2
performance.test.duration.seconds=60
performance.test.report.directory=target/performance-reports
performance.test.report.format=html,csv

#-------------------------------------------------------
# Thread Model Configuration
#-------------------------------------------------------
# Enable comparison between platform and virtual threads
performance.test.thread.comparison.enabled=true

# Platform thread configuration
performance.test.platform.thread.pool.size=200
performance.test.platform.thread.queue.size=1000

# Virtual thread configuration
performance.test.virtual.thread.enabled=true
performance.test.virtual.thread.carrier.thread.count=16

#-------------------------------------------------------
# Performance Thresholds and Expectations
#-------------------------------------------------------
# Response time improvement thresholds (virtual vs platform)
performance.threshold.response.time.p50.improvement=20
performance.threshold.response.time.p95.improvement=30
performance.threshold.response.time.p99.improvement=25

# Concurrency improvement thresholds
performance.threshold.max.concurrent.connections.platform=1000
performance.threshold.max.concurrent.connections.virtual=5000

# Memory utilization thresholds
performance.threshold.memory.platform.mb=1000
performance.threshold.memory.virtual.mb=300

# Error rate thresholds
performance.threshold.error.rate.max=0.001

#-------------------------------------------------------
# Content Repository Test Scenarios
#-------------------------------------------------------
# Asset browsing test
test.scenario.asset.browse.enabled=true
test.scenario.asset.browse.page.size=100
test.scenario.asset.browse.max.pages=10
test.scenario.asset.browse.concurrent.users.platform=50,100,200
test.scenario.asset.browse.concurrent.users.virtual=50,100,200,500,1000,2000,5000

# Component retrieval test
test.scenario.component.retrieve.enabled=true
test.scenario.component.retrieve.batch.size=20
test.scenario.component.retrieve.concurrent.users.platform=50,100,200
test.scenario.component.retrieve.concurrent.users.virtual=50,100,200,500,1000,2000,5000

# Asset content download test
test.scenario.asset.download.enabled=true
test.scenario.asset.download.file.sizes.kb=10,100,1000,10000
test.scenario.asset.download.concurrent.users.platform=20,50,100
test.scenario.asset.download.concurrent.users.virtual=20,50,100,200,500,1000

# Asset upload test
test.scenario.asset.upload.enabled=true
test.scenario.asset.upload.file.sizes.kb=10,100,1000,10000
test.scenario.asset.upload.concurrent.users.platform=10,20,50
test.scenario.asset.upload.concurrent.users.virtual=10,20,50,100,200,500

# Content routing test
test.scenario.content.routing.enabled=true
test.scenario.content.routing.repository.count=5
test.scenario.content.routing.paths.per.test=20
test.scenario.content.routing.concurrent.users.platform=50,100,200
test.scenario.content.routing.concurrent.users.virtual=50,100,200,500,1000,2000

# Content search test
test.scenario.content.search.enabled=true
test.scenario.content.search.query.complexity=simple,medium,complex
test.scenario.content.search.result.size=10,50,100
test.scenario.content.search.concurrent.users.platform=20,50,100
test.scenario.content.search.concurrent.users.virtual=20,50,100,200,500,1000

#-------------------------------------------------------
# Metrics Collection Configuration
#-------------------------------------------------------
# Enable detailed metrics collection
metrics.collection.enabled=true

# Thread metrics
metrics.thread.stats.enabled=true
metrics.thread.pinning.detection.enabled=true
metrics.thread.creation.rate.tracking=true

# Memory metrics
metrics.memory.heap.tracking=true
metrics.memory.non.heap.tracking=true
metrics.memory.gc.tracking=true

# Content operation metrics
metrics.content.store.operations.tracking=true
metrics.content.retrieve.operations.tracking=true
metrics.content.browse.operations.tracking=true
metrics.content.search.operations.tracking=true

# Database metrics
metrics.database.connection.pool.tracking=true
metrics.database.query.time.tracking=true
metrics.database.transaction.tracking=true

#-------------------------------------------------------
# Reporting Configuration
#-------------------------------------------------------
# Report generation settings
report.generate.summary=true
report.generate.detailed=true
report.generate.charts=true
report.include.thread.comparison=true
report.include.memory.usage=true
report.include.gc.statistics=true
report.include.thread.pinning.events=true

# Chart configuration
report.chart.response.time.percentiles=50,90,95,99
report.chart.throughput.enabled=true
report.chart.concurrent.users.vs.response.time=true
report.chart.memory.usage.over.time=true
report.chart.thread.count.over.time=true

# Export formats
report.export.formats=html,csv,json

#-------------------------------------------------------
# Advanced Configuration
#-------------------------------------------------------
# JVM flags for virtual thread tests
jvm.flags.virtual=-Djdk.virtualThreadScheduler.parallelism=16 -Djdk.virtualThreadScheduler.maxPoolSize=256 -Djdk.tracePinnedThreads=full

# JVM flags for platform thread tests
jvm.flags.platform=-XX:+UseZGC -XX:+ZGenerational

# Test data configuration
test.data.repository.count=3
test.data.assets.per.repository=10000
test.data.components.per.repository=2000
test.data.formats=maven,npm,raw

# Logging configuration
logging.level=INFO
logging.performance.events=true
logging.thread.pinning.events=true