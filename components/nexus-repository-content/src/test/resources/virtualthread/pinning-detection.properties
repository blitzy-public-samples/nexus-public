# Configuration for Virtual Thread Pinning Detection in Repository Content Operations

# General settings
# ---------------
virtualthread.pinning.detection.enabled=true
virtualthread.pinning.detection.jvm.flag=-Djdk.tracePinnedThreads=full

# Pinning detection thresholds (in milliseconds)
# ---------------------------------------------
# Default threshold for pinning detection (JFR default is 20ms)
virtualthread.pinning.threshold.default=20
# Content-specific thresholds - higher thresholds for expected longer operations
virtualthread.pinning.threshold.content.retrieval=50
virtualthread.pinning.threshold.content.storage=100
virtualthread.pinning.threshold.content.search=30
virtualthread.pinning.threshold.content.browse=40
virtualthread.pinning.threshold.content.routing=25

# Stack trace patterns for identifying pinning causes in repository content operations
# ---------------------------------------------------------------------------------
# Patterns are used to identify specific pinning causes in stack traces
virtualthread.pinning.pattern.jdbc=org\.sonatype\.nexus\.datastore.*\.jdbc
# Blob storage operations
virtualthread.pinning.pattern.blobstore=org\.sonatype\.nexus\.blobstore.*\.store
# Content facet operations
virtualthread.pinning.pattern.content=org\.sonatype\.nexus\.repository\.content\.facet
# Proxy repository operations
virtualthread.pinning.pattern.proxy=org\.sonatype\.nexus\.repository\.proxy
# Search operations
virtualthread.pinning.pattern.search=org\.sonatype\.nexus\.repository\.content\.search
# Content routing operations
virtualthread.pinning.pattern.routing=org\.sonatype\.nexus\.repository\.routing

# JFR recording settings for repository content operations
# -------------------------------------------------------
# Enable JFR recording for pinning detection
virtualthread.pinning.jfr.enabled=true
virtualthread.pinning.jfr.filename=repository-content-pinning.jfr
virtualthread.pinning.jfr.duration=1h
# JFR events to record
virtualthread.pinning.jfr.events=jdk.VirtualThreadStart,jdk.VirtualThreadEnd,jdk.VirtualThreadPinned,jdk.VirtualThreadSubmitFailed
# Stack trace depth for pinning events
virtualthread.pinning.jfr.stackdepth=64

# Monitoring configuration for content operations
# ----------------------------------------------
# Enable monitoring for specific content operations
virtualthread.pinning.monitor.content.retrieval=true
virtualthread.pinning.monitor.content.storage=true
virtualthread.pinning.monitor.content.search=true
virtualthread.pinning.monitor.content.browse=true
virtualthread.pinning.monitor.content.routing=true

# Diagnostic settings
# ------------------
# Log level for pinning detection (ERROR, WARN, INFO, DEBUG, TRACE)
virtualthread.pinning.log.level=WARN
# Include stack trace in logs
virtualthread.pinning.log.stacktrace=true
# Maximum number of stack frames to include in logs
virtualthread.pinning.log.stacktrace.max=20
# Log format for pinning events
virtualthread.pinning.log.format=Thread pinning detected in %s operation: duration=%dms, thread=%s

# Thread analytics settings
# ------------------------
# Enable thread analytics for pinning detection
virtualthread.pinning.analytics.enabled=true
# Collect statistics on pinning frequency
virtualthread.pinning.analytics.collect.frequency=true
# Collect statistics on pinning duration
virtualthread.pinning.analytics.collect.duration=true
# Collect statistics on pinning causes
virtualthread.pinning.analytics.collect.causes=true
# Report interval for analytics (in seconds)
virtualthread.pinning.analytics.report.interval=300

# Test-specific settings
# ---------------------
# Additional JVM flags for virtual thread tests
virtualthread.test.jvm.flags=-Djdk.virtualThreadScheduler.parallelism=16 -Djdk.virtualThreadScheduler.maxPoolSize=256
# Maximum allowed pinning duration in tests before failing (in milliseconds)
virtualthread.test.max.pinning.duration=500
# Maximum allowed pinning frequency in tests before failing (pinning events per second)
virtualthread.test.max.pinning.frequency=10
# Enable automatic test failure on excessive pinning
virtualthread.test.fail.on.excessive.pinning=true