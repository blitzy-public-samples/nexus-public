# Virtual Thread Test Configuration for Nexus Repository Manager Content Operations
# This file contains settings for testing repository content operations with Java 21 virtual threads

# Virtual Thread Executor Configuration
# ----------------------------------
# Controls the number of carrier threads in the virtual thread scheduler
jdk.virtualThreadScheduler.parallelism=16
# Maximum pool size for carrier threads
jdk.virtualThreadScheduler.maxPoolSize=256
# FIFO scheduling mode for the virtual thread scheduler
jdk.virtualThreadScheduler.schedulingMode=FIFO

# Thread Monitoring and Debugging
# ------------------------------
# Enable thread pinning detection with full stack traces
jdk.tracePinnedThreads=full
# Minimum duration (in milliseconds) for pinning events to be reported
jdk.virtualThread.pinningThreshold=20
# Enable virtual thread analytics collection
nexus.virtualThread.analytics.enabled=true
# Interval (in seconds) for virtual thread metrics collection
nexus.virtualThread.analytics.interval=5
# Enable tracking of thread creation and termination rates
nexus.virtualThread.analytics.trackCreationRate=true

# Default Timeouts for Content Operations
# --------------------------------------
# Default timeout (in milliseconds) for content retrieval operations
nexus.virtualThread.content.retrievalTimeout=10000
# Default timeout (in milliseconds) for content storage operations
nexus.virtualThread.content.storageTimeout=15000
# Default timeout (in milliseconds) for content indexing operations
nexus.virtualThread.content.indexingTimeout=20000
# Default timeout (in milliseconds) for content search operations
nexus.virtualThread.content.searchTimeout=30000
# Default timeout (in milliseconds) for content maintenance operations
nexus.virtualThread.content.maintenanceTimeout=60000

# Stack Trace Capture Configuration
# -------------------------------
# Enable stack trace capture for thread pinning events
nexus.virtualThread.captureStackTraces=true
# Maximum depth of stack traces to capture
nexus.virtualThread.stackTraceMaxDepth=64
# Include JDK internal frames in stack traces
nexus.virtualThread.includeInternalFrames=true

# Virtual Thread Pool Configuration
# -------------------------------
# Maximum number of virtual threads to create during tests
nexus.virtualThread.maxThreadCount=10000
# Timeout (in milliseconds) for virtual thread termination during test cleanup
nexus.virtualThread.shutdownTimeout=5000

# Content Test Execution Configuration
# ---------------------------------
# Number of concurrent content operations to execute during tests
nexus.virtualThread.test.concurrentContentOperations=1000
# Duration (in seconds) for content load tests
nexus.virtualThread.test.contentLoadTestDuration=30
# Enable comparison testing between platform and virtual threads
nexus.virtualThread.test.enableComparison=true
# Number of content items to process in batch operations
nexus.virtualThread.test.contentBatchSize=100
# Maximum repository size for testing (in MB)
nexus.virtualThread.test.maxRepositorySize=1024

# Content Store Monitoring
# ----------------------
# Enable monitoring of content store operations
nexus.virtualThread.contentStore.monitoring.enabled=true
# Interval (in seconds) for content store metrics collection
nexus.virtualThread.contentStore.monitoring.interval=10
# Track content store operation latency
nexus.virtualThread.contentStore.monitoring.trackLatency=true
# Track content store operation throughput
nexus.virtualThread.contentStore.monitoring.trackThroughput=true

# JFR Configuration for Virtual Thread Monitoring
# --------------------------------------------
# Enable JFR recording during virtual thread tests
nexus.virtualThread.jfr.enabled=true
# JFR recording duration (in seconds)
nexus.virtualThread.jfr.duration=60
# JFR file path pattern
nexus.virtualThread.jfr.path=target/jfr/content-virtualthread-test-${timestamp}.jfr

# Debug and Logging Parameters
# --------------------------
# Enable debug logging for virtual thread operations
nexus.virtualThread.debug.enabled=false
# Log level for virtual thread operations (TRACE, DEBUG, INFO, WARN, ERROR)
nexus.virtualThread.debug.logLevel=INFO
# Enable logging of thread scheduling events
nexus.virtualThread.debug.logScheduling=false
# Enable logging of thread pinning events
nexus.virtualThread.debug.logPinning=true