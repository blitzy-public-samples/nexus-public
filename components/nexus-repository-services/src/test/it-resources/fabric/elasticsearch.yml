cluster.name: nexus

path:
  home: ${testdir}
  conf: ${testdir}/etc
  data: ${testdir}/data
  logs: ${testdir}/log
  work: ${testdir}/tmp

# Node configuration
node.data: true
node.master: true

# Disable script execution for security
script.allowed_types: none
script.allowed_contexts: none

# Modern discovery settings (replacing deprecated zen discovery)
discovery.type: single-node
discovery.seed_hosts: []

# Disable HTTP as this is a test configuration
http.enabled: false

# JVM options for ZGC garbage collector
jvm.options: [
  "-XX:+UseZGC",
  "-XX:+ZGenerational",
  "-Xlog:gc*:file=${testdir}/log/gc.log:time,uptimemillis:filecount=5,filesize=20m"
]

# Virtual Thread configuration to prevent pinning
jvm.virtual_threads.enabled: true
jvm.virtual_threads.prevent_pinning: true