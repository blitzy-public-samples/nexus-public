# Virtual Thread Test Configuration for Repository View Component

# Thread Pool Configuration
virtualthread.pool.size=256
virtualthread.carrier.pool.size=16
virtualthread.carrier.pool.parallelism=8

# Timeout Configuration (in milliseconds)
virtualthread.timeout.connect=5000
virtualthread.timeout.read=30000
virtualthread.timeout.write=30000
virtualthread.timeout.idle=60000
virtualthread.timeout.request=120000

# Thread Monitoring Parameters
virtualthread.monitoring.enabled=true
virtualthread.monitoring.pinning.detection=true
virtualthread.monitoring.pinning.threshold=20
virtualthread.monitoring.jfr.enabled=true

# Concurrency Configuration for Repository View Handler Tests
virtualthread.concurrency.handler.chain=100
virtualthread.concurrency.request.processing=50
virtualthread.concurrency.content.negotiation=25
virtualthread.concurrency.io.operations=200

# Performance Test Thresholds
virtualthread.performance.throughput.threshold=1000
virtualthread.performance.latency.threshold=50
virtualthread.performance.concurrency.threshold=500

# Virtual Thread JVM Parameters (for reference)
# -Djdk.tracePinnedThreads=full
# -Djdk.virtualThreadScheduler.parallelism=16
# -Djdk.virtualThreadScheduler.maxPoolSize=256

# Repository View Specific Settings
repository.view.handler.virtualthread.enabled=true
repository.view.router.virtualthread.enabled=true
repository.view.content.virtualthread.enabled=true
repository.view.httpclient.virtualthread.enabled=true

# Test Data Configuration
test.data.request.count=1000
test.data.content.size.min=1024
test.data.content.size.max=1048576
test.data.concurrent.users=500