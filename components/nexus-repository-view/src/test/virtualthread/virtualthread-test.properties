# Virtual Thread Test Configuration for Repository View Component

# Thread Pool Configuration
virtualthread.pool.enabled=true
virtualthread.pool.maxSize=10000
virtualthread.pool.minSize=10
virtualthread.pool.keepAliveTime=60000

# Thread Monitoring Configuration
virtualthread.monitoring.enabled=true
virtualthread.monitoring.pinningDetection=true
virtualthread.monitoring.pinningStackTraceDepth=20
virtualthread.monitoring.samplingInterval=1000

# Operation Timeout Configuration
virtualthread.timeout.repository.fetch=5000
virtualthread.timeout.repository.browse=3000
virtualthread.timeout.repository.search=10000
virtualthread.timeout.repository.upload=30000

# Concurrency Test Configuration
virtualthread.concurrency.testThreadCount=1000
virtualthread.concurrency.warmupIterations=10
virtualthread.concurrency.testIterations=100
virtualthread.concurrency.maxConcurrentRequests=5000

# Performance Thresholds
virtualthread.performance.maxResponseTimeP95=350
virtualthread.performance.maxResponseTimeP99=600
virtualthread.performance.minThroughput=1000
virtualthread.performance.maxErrorRate=0

# Repository Handler Test Configuration
virtualthread.handler.testBatchSize=100
virtualthread.handler.maxParallelHandlers=50
virtualthread.handler.simulateNetworkLatency=true
virtualthread.handler.networkLatencyMs=50

# Virtual Thread vs Platform Thread Comparison
virtualthread.comparison.enabled=true
virtualthread.comparison.platformThreadPoolSize=200
virtualthread.comparison.expectedSpeedup=1.3
virtualthread.comparison.expectedMemoryReduction=0.7

# JVM Configuration for Virtual Thread Tests
virtualthread.jvm.tracePinnedThreads=full
virtualthread.jvm.virtualThreadSchedulerParallelism=16
virtualthread.jvm.virtualThreadSchedulerMaxPoolSize=256

# Test Data Configuration
virtualthread.test.repositoryCount=10
virtualthread.test.componentsPerRepository=1000
virtualthread.test.assetsPerComponent=5
virtualthread.test.averageAssetSizeKb=100

# Logging Configuration
virtualthread.logging.level=INFO
virtualthread.logging.includeThreadInfo=true
virtualthread.logging.includeVirtualThreadMetrics=true