# ============================================================================
# Context Propagation Configuration for Virtual Thread Tests
# ============================================================================
# This configuration file controls the behavior of virtual thread context 
# propagation tests, allowing customization of test execution parameters
# without code changes.

# ============================================================================
# General Configuration
# ============================================================================

# Enable/disable context propagation tests
context.propagation.tests.enabled=true

# Enable/disable specific test categories
context.propagation.mdc.tests.enabled=true
context.propagation.security.tests.enabled=true

# ============================================================================
# Timeout Settings
# ============================================================================

# Maximum time (in milliseconds) to wait for test completion
context.propagation.test.timeout.ms=30000

# Maximum time (in milliseconds) to wait for a single operation
context.propagation.operation.timeout.ms=5000

# Maximum time (in milliseconds) to wait for context propagation verification
context.propagation.verification.timeout.ms=1000

# ============================================================================
# Concurrency Settings
# ============================================================================

# Number of concurrent threads to use for testing
context.propagation.concurrency.level=100

# Maximum number of concurrent operations to execute
context.propagation.max.concurrent.operations=1000

# Interval (in milliseconds) between starting new operations
context.propagation.operation.interval.ms=10

# ============================================================================
# Diagnostic Settings
# ============================================================================

# Enable/disable detailed diagnostic logging
context.propagation.diagnostics.enabled=true

# Enable/disable thread dump on test failure
context.propagation.thread.dump.on.failure=true

# Enable/disable thread pinning detection
context.propagation.thread.pinning.detection=true

# Enable/disable carrier thread monitoring
context.propagation.carrier.thread.monitoring=true

# ============================================================================
# MDC Context Settings
# ============================================================================

# Enable/disable MDC context propagation tests
context.propagation.mdc.enabled=true

# Number of MDC context keys to use in tests
context.propagation.mdc.key.count=5

# Size (in characters) of MDC context values
context.propagation.mdc.value.size=32

# Enable/disable MDC context verification after operations
context.propagation.mdc.verify.after.operation=true

# Enable/disable MDC context cleanup verification
context.propagation.mdc.verify.cleanup=true

# ============================================================================
# Security Context Settings
# ============================================================================

# Enable/disable security context propagation tests
context.propagation.security.enabled=true

# Enable/disable security context verification after operations
context.propagation.security.verify.after.operation=true

# Enable/disable security context cleanup verification
context.propagation.security.verify.cleanup=true

# ============================================================================
# Thread Pinning Simulation
# ============================================================================

# Enable/disable thread pinning simulation tests
context.propagation.pinning.simulation.enabled=true

# Duration (in milliseconds) of simulated blocking operations
context.propagation.blocking.operation.duration.ms=100

# Percentage of operations that should simulate blocking I/O
context.propagation.blocking.operation.percentage=50

# Enable/disable synchronized block tests for pinning detection
context.propagation.synchronized.block.tests.enabled=true

# Duration (in milliseconds) of synchronized block operations
context.propagation.synchronized.block.duration.ms=50

# ============================================================================
# Advanced Settings
# ============================================================================

# Virtual thread scheduler parallelism (0 = use JVM default)
context.propagation.virtual.thread.scheduler.parallelism=0

# Maximum carrier thread pool size (0 = use JVM default)
context.propagation.max.carrier.thread.pool.size=0

# Enable/disable structured concurrency tests
context.propagation.structured.concurrency.tests.enabled=true

# Enable/disable scoped value comparison tests
context.propagation.scoped.value.comparison.enabled=true