# JUnit Jupiter configuration for Nexus Scheduling module tests with Java 21 Virtual Threads support

# Enable Virtual Thread execution for tests
# This allows tests to validate Java 21 virtual thread capabilities for the scheduling module
test.virtual.threads=true

# Configure parallel execution mode for concurrent testing
# This enables tests to run concurrently, leveraging Virtual Threads
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Configure parallel execution strategy
# Using dynamic to adjust based on available resources
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1.0

# Enable thread pinning detection to identify potential performance issues
# This helps detect when Virtual Threads get pinned to carrier threads
jdk.tracePinnedThreads=full

# Configure default test timeout to handle potential virtual thread starvation scenarios
# This prevents tests from hanging indefinitely if virtual threads are starved
junit.jupiter.execution.timeout.default=60s
junit.jupiter.execution.timeout.testable.method.default=30s

# Enable test instance lifecycle per-class for more efficient test execution
junit.jupiter.testinstance.lifecycle.default=per_class

# Configure display names for better test reporting
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores