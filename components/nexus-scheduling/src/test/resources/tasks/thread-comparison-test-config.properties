# Thread Comparison Test Configuration
# Configuration for comparative testing between platform threads and virtual threads
# This file supports testing of Java 21 virtual threads in the Nexus Repository scheduling component

# ======================================================================
# General Test Configuration
# ======================================================================

# Enable/disable thread comparison tests
thread.comparison.enabled=true

# Test duration in seconds
thread.comparison.test.duration=60

# Number of warmup iterations before measurements
thread.comparison.warmup.iterations=5

# Number of measurement iterations
thread.comparison.measurement.iterations=10

# ======================================================================
# Thread Pool Configuration
# ======================================================================

# Platform Thread Pool Settings
platform.thread.pool.min=10
platform.thread.pool.max=200
platform.thread.pool.keepalive=60

# Virtual Thread Pool Settings
# Note: Virtual threads don't require traditional pool sizing
# but these settings control the carrier thread pool
virtual.thread.scheduler.parallelism=${jdk.virtualThreadScheduler.parallelism:-16}
virtual.thread.scheduler.maxPoolSize=${jdk.virtualThreadScheduler.maxPoolSize:-256}

# ======================================================================
# Diagnostic Settings
# ======================================================================

# Thread pinning detection (none, short, full)
# Detects when virtual threads are pinned to carrier threads, which can impact performance
# - none: No detection
# - short: Basic information about pinned threads
# - full: Complete stack trace of pinned threads
thread.pinning.detection=full

# Enable thread dump collection
thread.dump.enabled=true

# Thread dump interval in seconds
thread.dump.interval=10

# ======================================================================
# Performance Measurement Parameters
# ======================================================================

# Client load settings
thread.comparison.client.start=10
thread.comparison.client.max=1000
thread.comparison.client.step=100

# Performance thresholds (milliseconds)
# These thresholds define the expected performance improvements with virtual threads
# P95 = 95th percentile response time (ms)
# P99 = 99th percentile response time (ms)
thread.comparison.virtual.p95.threshold=350
thread.comparison.platform.p95.threshold=500
thread.comparison.virtual.p99.threshold=600
thread.comparison.platform.p99.threshold=800

# Memory utilization thresholds (MB)
# Virtual threads should use significantly less memory than platform threads
# under high concurrency scenarios
thread.comparison.virtual.memory.threshold=300
thread.comparison.platform.memory.threshold=1000

# ======================================================================
# JVM Argument Templates
# ======================================================================

# Standard Java 21 JVM arguments for platform threads
# Uses ZGC garbage collector with generational mode for optimal performance
platform.thread.jvm.args=-Xms512m -Xmx1g -XX:+UseZGC -XX:+ZGenerational

# Java 21 JVM arguments optimized for virtual threads
# Includes virtual thread specific settings and diagnostic options
virtual.thread.jvm.args=-Xms512m -Xmx1g -XX:+UseZGC -XX:+ZGenerational \
  -Djdk.tracePinnedThreads=${thread.pinning.detection} \
  -Djdk.virtualThreadScheduler.parallelism=${virtual.thread.scheduler.parallelism} \
  -Djdk.virtualThreadScheduler.maxPoolSize=${virtual.thread.scheduler.maxPoolSize}

# ======================================================================
# Test Execution Parameters
# ======================================================================

# Test categories to run
# VirtualThreadTestGroup contains tests specifically designed to validate virtual thread behavior
# Java21TestGroup contains tests for Java 21 features including virtual threads
thread.comparison.test.categories=org.sonatype.goodies.testsupport.group.VirtualThreadTestGroup,org.sonatype.goodies.testsupport.group.Java21TestGroup

# Test execution mode (sequential, parallel)
thread.comparison.execution.mode=parallel

# Thread factory configuration for tests
# These factories are used by the test framework to create threads of the appropriate type
# The test will run identical workloads with both thread types for comparison
thread.comparison.platform.factory=java.lang.Thread.ofPlatform().factory()
thread.comparison.virtual.factory=java.lang.Thread.ofVirtual().factory()

# ======================================================================
# Reporting Configuration
# ======================================================================

# Report output directory
thread.comparison.report.dir=target/thread-comparison-reports

# Enable HTML report generation
thread.comparison.report.html.enabled=true

# Enable CSV data export
thread.comparison.report.csv.enabled=true

# Chart configuration
thread.comparison.chart.title=Thread Model Comparison
thread.comparison.chart.xaxis=Concurrent Clients
thread.comparison.chart.yaxis=Response Time (ms)

# ======================================================================
# Additional Test Metrics
# ======================================================================

# Thread scaling efficiency (percentage)
# Measures how efficiently the system scales as thread count increases
thread.comparison.virtual.scaling.efficiency.threshold=90

# Thread creation time (microseconds)
# Expected thread creation time for each thread type
thread.comparison.virtual.creation.time=5
thread.comparison.platform.creation.time=50

# Maximum concurrent connections
# Expected maximum number of concurrent connections each thread type can handle
thread.comparison.virtual.max.connections=10000
thread.comparison.platform.max.connections=1000