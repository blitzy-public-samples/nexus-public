# Virtual Thread Test Suite Configuration for Nexus Scheduling Component
# This file configures the test environment for virtual threads in Java 21

# ======================================================================
# JVM Configuration
# ======================================================================

# Virtual Thread Scheduler Configuration
virtual.thread.scheduler.parallelism=4
virtual.thread.scheduler.maxPoolSize=256

# JVM Arguments for test execution
test.jvm.args=-Djdk.virtualThreadScheduler.parallelism=${virtual.thread.scheduler.parallelism} -Djdk.virtualThreadScheduler.maxPoolSize=${virtual.thread.scheduler.maxPoolSize}

# Enable pinned thread tracing during tests (comment out to disable)
test.jvm.pinning.detection=-Djdk.tracePinnedThreads=short

# ======================================================================
# Thread Factory Configuration
# ======================================================================

# Thread factory implementation class to use for tests
test.thread.factory.class=java.util.concurrent.Executors

# Thread factory method to use (newVirtualThreadPerTaskExecutor is recommended for Java 21)
test.thread.factory.method=newVirtualThreadPerTaskExecutor

# Thread naming pattern for test threads
test.thread.name.pattern=nexus-vt-test-%d

# ======================================================================
# Test Execution Parameters
# ======================================================================

# Number of concurrent tasks to run in throughput tests
test.concurrency.level=100

# Maximum wait time for test completion (in milliseconds)
test.timeout.ms=30000

# Delay between task submissions (in milliseconds)
test.submission.delay.ms=10

# Number of iterations for performance tests
test.performance.iterations=5

# ======================================================================
# Diagnostic and Reporting Settings
# ======================================================================

# Enable JFR recording during tests
test.jfr.enabled=true

# JFR configuration file location (relative to classpath)
test.jfr.config=virtual-thread/jfr-config.jfc

# JFR recording file location
test.jfr.output.dir=${project.build.directory}/jfr-recordings

# Enable detailed logging of virtual thread operations
test.verbose.logging=true

# Log level for virtual thread operations (TRACE, DEBUG, INFO, WARN, ERROR)
test.log.level=DEBUG

# Enable virtual thread events in JFR
test.jfr.events.virtualthread.enabled=true

# Threshold for pinned thread detection (milliseconds)
test.pinned.thread.threshold.ms=20

# Enable thread dump on test failure
test.dump.threads.on.failure=true

# Thread dump output directory
test.thread.dump.dir=${project.build.directory}/thread-dumps

# Enable memory usage monitoring
test.memory.monitoring.enabled=true

# Memory snapshot interval (milliseconds)
test.memory.snapshot.interval.ms=1000

# ======================================================================
# Nexus Scheduling Specific Configuration
# ======================================================================

# Task execution configuration
task.execution.mode=virtual-thread

# Maximum number of concurrent tasks
task.max.concurrent=1000

# Task priority levels (higher number = higher priority)
task.priority.levels=10

# Default task timeout (in milliseconds)
task.default.timeout.ms=60000

# Task queue capacity
task.queue.capacity=10000

# Enable task statistics collection
task.statistics.enabled=true

# Task execution history size
task.history.size=100

# ======================================================================
# Test Scenarios Configuration
# ======================================================================

# Test scenarios specific to Nexus Scheduling component
test.scenarios=task-execution,task-cancellation,task-scheduling,task-recovery,task-priority

# Task execution test parameters
test.scenario.task-execution.concurrent-tasks=500
test.scenario.task-execution.task-duration.ms=100
test.scenario.task-execution.iterations=10

# Task cancellation test parameters
test.scenario.task-cancellation.tasks=100
test.scenario.task-cancellation.cancel-percentage=50

# Task scheduling test parameters
test.scenario.task-scheduling.cron-tasks=20
test.scenario.task-scheduling.once-tasks=50
test.scenario.task-scheduling.duration.seconds=30

# Task recovery test parameters
test.scenario.task-recovery.failed-tasks=25
test.scenario.task-recovery.recovery-attempts=3

# Task priority test parameters
test.scenario.task-priority.priority-levels=5
test.scenario.task-priority.tasks-per-level=20

# ======================================================================
# Test Groups Configuration
# ======================================================================

# Define test groups for different scenarios
test.groups=basic,performance,stress,regression

# Basic tests for functionality verification
test.group.basic.classes=**/VirtualThreadBasicTest.class

# Performance tests for throughput measurement
test.group.performance.classes=**/VirtualThreadPerformanceTest.class

# Stress tests for stability under load
test.group.stress.classes=**/VirtualThreadStressTest.class

# Regression tests for specific scenarios
test.group.regression.classes=**/VirtualThreadRegressionTest.class