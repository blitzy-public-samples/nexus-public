# Java 21 Security Properties for Sonatype Nexus Repository
# This file contains Java 21-specific security settings for the Nexus security subsystem
#
# This configuration file enables Java 21 security features and ensures compatibility
# with BouncyCastle 1.78.1 for cryptographic operations and TLS 1.3 communications.

#============================================================================
# Java 21 Security Provider Configuration
#============================================================================

# Configure security providers with BouncyCastle 1.78.1 for Java 21 compatibility
# The order is important - standard providers first, then BouncyCastle
# Java 21 includes updated provider names and ordering
security.provider.1=SUN
security.provider.2=SunRsaSign
security.provider.3=SunEC
security.provider.4=SunJSSE
security.provider.5=SunJCE
security.provider.6=SunJGSS
security.provider.7=SunSASL
security.provider.8=XMLDSig
security.provider.9=SunPCSC
security.provider.10=JdkLDAP
security.provider.11=JdkSASL
security.provider.12=org.bouncycastle.jce.provider.BouncyCastleProvider
security.provider.13=org.bouncycastle.jsse.provider.BouncyCastleJsseProvider

# Allow security properties to be overridden via system properties
security.overridePropertiesFile=true

#============================================================================
# TLS Configuration
#============================================================================

# Enable TLS 1.3 by default with TLS 1.2 fallback
jdk.tls.client.protocols=TLSv1.3,TLSv1.2
jdk.tls.server.protocols=TLSv1.3,TLSv1.2

# Set TLS 1.3 cipher suite priorities
jdk.tls.client.cipherSuites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256

# Disable weak algorithms for TLS
# Updated for Java 21 security recommendations
jdk.tls.disabledAlgorithms=SSLv3, TLSv1, TLSv1.1, RC4, DES, MD5withRSA, DH keySize < 2048, EC keySize < 224, 3DES_EDE_CBC, anon, NULL

# Disable weak algorithms for certificate path validation
# Updated for Java 21 security recommendations
jdk.certpath.disabledAlgorithms=MD2, MD5, SHA1 jdkCA & usage TLSServer, RSA keySize < 2048, DSA keySize < 2048, EC keySize < 224, SHA1 usage TLSServer

# Set TLS session cache timeout (in seconds)
jdk.tls.sessionCacheSize=20480
jdk.tls.sessionTimeout=3600

# Enable server cipher suite preference
jdk.tls.server.honorCipherOrder=true

#============================================================================
# Key Management System Configuration
#============================================================================

# Configure key management system settings for Java 21 compatibility
# These settings ensure proper master key rotation with Java 21's security model

# Set default keystore type
keystore.type=PKCS12

# Configure SecureRandom implementation
securerandom.source=file:/dev/urandom
securerandom.strongAlgorithms=NativePRNGBlocking:SUN,DRBG:SUN

# Configure PKCS12 keystore settings
keystore.pkcs12.keyProtectionAlgorithm=PBEWithHmacSHA256AndAES_256
keystore.pkcs12.certProtectionAlgorithm=PBEWithHmacSHA256AndAES_256
keystore.pkcs12.macAlgorithm=HmacPBESHA256
keystore.pkcs12.macIterationCount=10000

#============================================================================
# BouncyCastle Provider Configuration
#============================================================================

# Configure BouncyCastle 1.78.1 provider for Java 21
# These settings ensure proper integration with Java 21's security model

# Enable BouncyCastle FIPS compliance mode if required
# org.bouncycastle.fips.approved_only=false

# Configure BouncyCastle JSSE provider for TLS support
org.bouncycastle.jsse.client.cipherSuites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256
org.bouncycastle.jsse.server.cipherSuites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256

# Configure BouncyCastle to use Java 21's enhanced security features
org.bouncycastle.ec.enable_fallback=false
org.bouncycastle.pkcs12.legacy_mode=false

# Configure BouncyCastle provider version
# Explicitly set to 1.78.1 for Java 21 compatibility
org.bouncycastle.provider.version=1.78.1

# Configure BouncyCastle TLS version support
org.bouncycastle.jsse.client.protocols=TLSv1.3,TLSv1.2
org.bouncycastle.jsse.server.protocols=TLSv1.3,TLSv1.2

# Configure BouncyCastle to use Java 21's native JSSE diagnostics features
org.bouncycastle.jsse.enableTracing=false
org.bouncycastle.jsse.enableRetransmissions=true

#============================================================================
# JCE Configuration
#============================================================================

# Configure Java Cryptography Extension settings for Java 21
# Java 21 includes unlimited strength cryptography by default

# Set preferred JCE providers for common algorithms
jce.provider.AES=SunJCE
jce.provider.RSA=SunRsaSign
jce.provider.EC=SunEC

# Configure crypto policy
crypto.policy=unlimited

#============================================================================
# Master Key Rotation Configuration
#============================================================================

# Configure settings for master key rotation with Java 21's security model
# These settings ensure proper key rotation and management

# Set key rotation parameters
keystore.pkcs12.keyProtectionPBEIterationCount=10000
keystore.pkcs12.certPbeIterationCount=10000

# Configure key derivation functions
keystore.PKCS12.macAlgorithm=HmacPBESHA256
keystore.PKCS12.macIterationCount=10000