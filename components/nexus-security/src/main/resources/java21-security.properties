# Java 21 Security Properties for Sonatype Nexus Repository
# This file contains Java 21-specific security settings for the Nexus security subsystem
#
# This configuration file is used to leverage Java 21's enhanced security capabilities
# and ensure compatibility with the upgraded BouncyCastle 1.78.1 cryptographic provider.
# It configures TLS 1.3 as the default protocol with appropriate cipher suites and
# ensures that master-key rotation processes operate correctly with Java 21's
# revamped security manager.

#----------------------------------------------------------------------
# TLS Configuration
#----------------------------------------------------------------------

# Enable TLS 1.3 by default with TLS 1.2 as fallback
# This ensures modern secure connections while maintaining compatibility
jdk.tls.client.protocols=TLSv1.3,TLSv1.2
jdk.tls.server.protocols=TLSv1.3,TLSv1.2

# Set server preference for cipher suite selection
# TLS 1.3 cipher suites are listed first, followed by TLS 1.2 cipher suites
# Order is from most secure to less secure, but all are considered strong
jdk.tls.server.cipherSuites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# Increase default TLS Diffie-Hellman group size from 1024-bit to 2048-bit
# This is a Java 21 security enhancement for stronger key exchange
jdk.tls.ephemeralDHKeySize=2048

# Honor server's cipher suite preference by default
# This allows the server to select the most secure cipher suite that the client supports
jdk.tls.server.useCipherSuitesOrder=true

#----------------------------------------------------------------------
# BouncyCastle Provider Configuration
#----------------------------------------------------------------------

# Configure BouncyCastle 1.78.1 provider for Java 21 compatibility
# Note: These providers are registered programmatically in DefaultSecuritySystem.java
# but the configuration is included here for reference and to ensure proper operation

# BouncyCastle JCE Provider - provides cryptographic algorithms
# Commented out as it's registered programmatically in DefaultSecuritySystem.java
#security.provider.1=org.bouncycastle.jce.provider.BouncyCastleProvider

# BouncyCastle JSSE Provider for TLS operations
# Commented out as it's registered programmatically when needed
#security.provider.2=org.bouncycastle.jsse.provider.BouncyCastleJsseProvider

# BouncyCastle provider configuration properties
# These ensure proper operation with Java 21's security model
org.bouncycastle.asn1.allow_unsafe_integer=true
org.bouncycastle.jsse.allowUnsafeLegacyRenegotiation=false
org.bouncycastle.jsse.namedGroups=secp256r1,secp384r1,secp521r1,x25519,x448

#----------------------------------------------------------------------
# Key Management System Settings
#----------------------------------------------------------------------

# Enable unlimited strength cryptography (automatically enabled in Java 21)
# This ensures that master-key rotation processes operate correctly with Java 21's
# revamped security manager and allows for AES-256 and other strong algorithms
crypto.policy=unlimited

# Configure SecureRandom implementation for better performance and security
# Java 21 has improved SecureRandom implementations that should be leveraged
securerandom.source=file:/dev/urandom
securerandom.strongAlgorithms=NativePRNGBlocking:SUN,DRBG:SUN

# Configure PKCS12 as the default keystore type
# PKCS12 is the recommended keystore format for Java 21
keystore.type=PKCS12

# Key management algorithm settings
# These ensure proper operation of master-key rotation processes
keystore.PKCS12.keyProtectionAlgorithm=PBEWithHmacSHA256AndAES_256
keystore.PKCS12.certProtectionAlgorithm=PBEWithHmacSHA256AndAES_256
keystore.PKCS12.macAlgorithm=HmacPBESHA256

#----------------------------------------------------------------------
# Security Algorithm Restrictions
#----------------------------------------------------------------------

# Disabled algorithms for certification path validation
# These restrictions align with Java 21 security best practices
jdk.certpath.disabledAlgorithms=MD2, MD5, SHA1 jdkCA & usage TLSServer, \
    RSA keySize < 2048, DSA keySize < 2048, EC keySize < 224, \
    include jdk.disabled.namedCurves

# Disabled algorithms for TLS
# Ensures only secure protocols and algorithms are used
jdk.tls.disabledAlgorithms=SSLv3, TLSv1, TLSv1.1, RC4, DES, MD5withRSA, \
    DH keySize < 2048, EC keySize < 224, 3DES_EDE_CBC, anon, NULL, \
    include jdk.disabled.namedCurves

# Disabled named curves
# Removes curves that are considered weak or vulnerable
jdk.disabled.namedCurves=secp112r1, secp112r2, secp128r1, secp128r2, secp160k1, \
    secp160r1, secp160r2, secp192k1, secp192r1, secp224k1, secp256k1, \
    sect113r1, sect113r2, sect131r1, sect131r2, sect163k1, sect163r1, \
    sect163r2, sect193r1, sect193r2, sect233k1, sect233r1, sect239k1, \
    sect283k1, sect283r1, sect409k1, sect409r1, sect571k1, sect571r1, \
    brainpoolP256r1, brainpoolP384r1, brainpoolP512r1

# Legacy algorithms that should be phased out but may still be needed for compatibility
# These are allowed but will be logged with warnings when used
jdk.tls.legacyAlgorithms=TLS_RSA_WITH_AES_256_CBC_SHA, \
    TLS_RSA_WITH_AES_128_CBC_SHA, \
    TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA, \
    TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA

# Set limits on the amount of data that can be encrypted with a single key
# Format: algorithm:limit
jdk.tls.keyLimits=AES/GCM/NoPadding:2^24