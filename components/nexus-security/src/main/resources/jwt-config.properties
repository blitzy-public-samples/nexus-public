# JWT Configuration for Java 21 compatibility
# This file contains settings for JWT token generation, validation, signing algorithms, and cryptographic providers

#############################################################################
# Java-JWT Library Configuration for Java 21
#############################################################################
# Java-JWT must be upgraded to 4.4.0 for Java 21 compatibility
jwt.library.version=4.4.0
jwt.library.name=com.auth0.java-jwt

#############################################################################
# Cryptographic Provider Configuration
#############################################################################
# BouncyCastle 1.78.1 integration for JWT cryptographic operations
# Configured for Java 21 compatibility with proper JCE integration
jwt.crypto.provider=org.bouncycastle.jce.provider.BouncyCastleProvider
jwt.crypto.provider.version=1.78.1
jwt.crypto.provider.priority=1
jwt.bouncycastle.register.provider=true
jwt.bouncycastle.use.fips=false
jwt.bouncycastle.preferred.for.hmac=true

# Provider registration method for Java 21
jwt.provider.registration.method=Security.addProvider

#############################################################################
# JWT Signing Algorithm Configuration
#############################################################################
# Default algorithm setting
jwt.algorithm.default=HMAC256

# JCA algorithm names for Java 21 compatibility
# Configured JWT signing algorithm settings compatible with Java 21's JCE
jwt.algorithm.hmac256.jca=HmacSHA256
jwt.algorithm.hmac384.jca=HmacSHA384
jwt.algorithm.hmac512.jca=HmacSHA512
jwt.algorithm.rs256.jca=SHA256withRSA
jwt.algorithm.rs384.jca=SHA384withRSA
jwt.algorithm.rs512.jca=SHA512withRSA

# Algorithm implementation classes for Java 21
jwt.algorithm.hmac256.impl=com.auth0.jwt.algorithms.HmacAlgorithm
jwt.algorithm.rs256.impl=com.auth0.jwt.algorithms.RSAAlgorithm

# Java 21 specific algorithm parameters
jwt.algorithm.hmac256.java21.provider=BC

# HMAC Key Length Requirements (in bits) - RFC 7518 compliance
jwt.key.hmac256.min.length=256
jwt.key.hmac384.min.length=384
jwt.key.hmac512.min.length=512

# RSA Key Length Requirements (in bits) - RFC 7518 compliance
jwt.key.rsa.min.length=2048

#############################################################################
# Token Validation Parameters optimized for Java 21
#############################################################################
# Added token validation parameters optimized for Java 21
jwt.validation.leeway.seconds=60
jwt.validation.verify.signature=true
jwt.validation.verify.expiration=true
jwt.validation.verify.notbefore=true
jwt.validation.verify.issuer=true

# Java 21 specific validation enhancements
jwt.validation.java21.use.concurrent.verification=true
jwt.validation.java21.verification.timeout.ms=5000

# Token Generation Parameters
jwt.token.expiration.default.minutes=60
jwt.token.issuer=nexus-repository
jwt.token.audience=nexus-clients

# Token handling configurations updated for Java 21 compatibility
jwt.token.parser.java21.optimized=true
jwt.token.parser.use.virtual.threads=true

#############################################################################
# Security Settings
#############################################################################
# Prevent security vulnerabilities
jwt.security.allow.unsecured=false
jwt.security.allow.none.algorithm=false
jwt.security.enforce.key.length=true

#############################################################################
# Java 21 Specific Optimizations
#############################################################################
# Leverage Java 21 features for improved performance
jwt.java21.use.virtual.threads=true
jwt.java21.use.string.templates=true
jwt.java21.use.pattern.matching=true

# Java 21 specific cryptographic enhancements
jwt.java21.crypto.use.modern.api=true
jwt.java21.crypto.prefer.native.implementations=true

# Java 21 HMAC256 signing workflow validation
jwt.java21.hmac256.validation.enabled=true
jwt.java21.hmac256.validation.check.key.length=true
jwt.java21.hmac256.validation.check.algorithm=true

#############################################################################
# JWT Header Parameters
#############################################################################
jwt.header.type=JWT
jwt.header.content.type=application/json

#############################################################################
# JWT Claim Validation
#############################################################################
jwt.claims.required=iss,sub,exp
jwt.claims.custom.allowed=true

#############################################################################
# Error Handling
#############################################################################
jwt.error.verbose=false
jwt.error.include.exception.class=false