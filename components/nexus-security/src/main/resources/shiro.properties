# Apache Shiro 2.0.0 Configuration for Java 21 Compatibility
# This file contains properties that ensure proper realm initialization,
# authentication flow, and security manager configuration with Java 21.

# =====================================================
# Core Shiro 2.0.0 Java 21 Compatibility Settings
# =====================================================

# Enable Java 21 compatibility mode
java21.compatibility.enabled=true

# Use enhanced security features available in Java 21
security.enhanced.mode=true

# Configure proper class loading for Java 21 modules
classLoader.useModulePathFirst=true

# =====================================================
# Authentication Chain Configuration
# =====================================================

# Updated authentication chain order for Shiro 2.0.0
authentication.chain.order=NexusAuthenticatingRealm,NexusAuthorizingRealm,ldapRealm,kerberosRealm

# Ensure proper realm initialization with Java 21
realm.initialization.parallel=true
realm.initialization.timeout=30000

# Configure authentication caching for improved performance
authentication.cache.enabled=true
authentication.cache.timeToLiveSeconds=1800
authentication.cache.timeToIdleSeconds=900

# =====================================================
# TLS Cipher Suite Preferences for Java 21
# =====================================================

# Enable strong TLS cipher suites compatible with Java 21
tls.enabled=true
tls.protocols=TLSv1.2,TLSv1.3

# Preferred cipher suites for TLS 1.3 (Java 21 optimized)
tls.cipherSuites.tls13=TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_AES_128_GCM_SHA256

# Preferred cipher suites for TLS 1.2 (Java 21 optimized)
tls.cipherSuites.tls12=TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# Honor server cipher suite order (Java 21 recommendation)
tls.honorCipherOrder=true

# Disable vulnerable protocols and cipher suites
tls.disabledProtocols=SSLv2,SSLv3,TLSv1,TLSv1.1
tls.disabledCipherSuites=.*NULL.*,.*RC4.*,.*MD5.*,.*DES.*,.*DSS.*

# =====================================================
# Session Management Configuration for Java 21
# =====================================================

# Enable Shiro's native session management
session.native.enabled=true

# Session timeout in milliseconds (30 minutes)
session.timeout=1800000

# Session validation settings
session.validation.enabled=true
session.validation.interval=1800000

# Session cookie configuration
session.cookie.name=NEXUS_JSESSIONID
session.cookie.path=/
session.cookie.maxAge=-1
session.cookie.secure=true
session.cookie.httpOnly=true
session.cookie.sameSite=Lax

# Session ID generation settings for Java 21
session.idGenerator.class=org.apache.shiro.session.mgt.eis.JavaUuidSessionIdGenerator
session.idLength=32

# Enable Virtual Thread support for session operations (Java 21 feature)
session.virtualThread.enabled=true
session.virtualThread.poolSize=100

# =====================================================
# Miscellaneous Security Settings
# =====================================================

# Enable security manager debugging (set to false in production)
security.debug=false

# Configure secure random number generation for Java 21
secureRandom.algorithm=NativePRNG
secureRandom.provider=SUN

# Enable enhanced cryptography features in Java 21
crypto.argon2.enabled=true
crypto.argon2.iterations=3
crypto.argon2.memory=65536
crypto.argon2.parallelism=4