# Virtual Thread Test Configuration for Nexus Repository Security Module
# This file contains configuration properties for virtual thread testing
# of security components as part of the Java 21 migration.

# -----------------------------------------------------------------------
# Virtual Thread Executor Configuration
# -----------------------------------------------------------------------

# Parallelism level for the virtual thread scheduler
# Controls how many carrier threads are available for virtual threads
# Default is set to the number of available processors (0)
virtualthread.scheduler.parallelism=0

# Maximum number of virtual threads to create in the test pool
# Set to 0 for unlimited (bounded only by system memory)
# For security testing, we need to simulate high concurrency scenarios
virtualthread.pool.max-size=0

# Minimum number of carrier threads to maintain in the pool
# Ensures responsiveness even under low load conditions
virtualthread.carrier.min-threads=4

# Maximum number of carrier threads to allow
# Prevents excessive resource consumption while still allowing scalability
virtualthread.carrier.max-threads=128

# -----------------------------------------------------------------------
# Thread Pinning Detection
# -----------------------------------------------------------------------

# Enable thread pinning detection
# Detects when virtual threads are pinned to carrier threads, which reduces scalability
virtualthread.pinning.detection.enabled=true

# Capture stack traces when thread pinning is detected
# Helps identify code causing thread pinning for optimization
virtualthread.pinning.stacktrace.enabled=true

# Stack trace depth to capture (0 for full stack trace)
virtualthread.pinning.stacktrace.depth=0

# Log level for thread pinning events (ERROR, WARN, INFO, DEBUG, TRACE)
virtualthread.pinning.log-level=WARN

# Enable thread creation/termination rate tracking
virtualthread.analytics.enabled=true

# Sampling interval for thread analytics in milliseconds
virtualthread.analytics.sampling-interval=1000

# -----------------------------------------------------------------------
# Authentication and Authorization Testing
# -----------------------------------------------------------------------

# Number of concurrent authentication attempts to simulate
# Tests authentication flow under high concurrency with virtual threads
virtualthread.security.auth.concurrent-attempts=1000

# Authentication test duration in seconds
# Longer durations help identify memory leaks or resource exhaustion
virtualthread.security.auth.test-duration=60

# Enable simulation of slow authentication providers
# Tests how virtual threads handle blocking operations during authentication
virtualthread.security.auth.simulate-slow-provider=true

# Slow authentication provider delay in milliseconds
# Simulates external authentication systems with latency
virtualthread.security.auth.slow-provider-delay=500

# Number of concurrent authorization checks to simulate
# Tests permission evaluation under high concurrency
virtualthread.security.authz.concurrent-checks=2000

# Enable permission cache testing with virtual threads
# Validates cache behavior under concurrent access patterns
virtualthread.security.authz.permission-cache-testing=true

# -----------------------------------------------------------------------
# Apache Shiro Configuration
# -----------------------------------------------------------------------

# Enable Shiro session testing with virtual threads
# Tests WebSessionManager and session persistence with virtual threads
virtualthread.security.shiro.session-testing=true

# Number of concurrent sessions to create during tests
# Tests session management under high concurrency
virtualthread.security.shiro.concurrent-sessions=5000

# Session operation timeout in milliseconds
# Prevents test hangs if session operations block
virtualthread.security.shiro.session-timeout=5000

# Enable Shiro cache testing with virtual threads
# Validates cache behavior under concurrent access
virtualthread.security.shiro.cache-testing=true

# Cache entry expiration time in seconds for testing
# Short expiration helps test cache refresh behavior
virtualthread.security.shiro.cache-expiration=10

# Enable Shiro realm testing with virtual threads
# Tests realm operations under concurrent access
virtualthread.security.shiro.realm-testing=true

# -----------------------------------------------------------------------
# Concurrency Testing Parameters
# -----------------------------------------------------------------------

# Concurrency levels to test (comma-separated list)
# Tests scalability across different thread counts
virtualthread.security.concurrency-levels=10,100,1000,10000

# Enable gradual ramp-up of concurrent threads
# Helps identify at which concurrency level issues appear
virtualthread.security.gradual-ramp-up=true

# Ramp-up step size (number of threads to add per step)
virtualthread.security.ramp-up-step=100

# Delay between ramp-up steps in milliseconds
virtualthread.security.ramp-up-delay=1000

# Maximum test duration in seconds (0 for unlimited)
virtualthread.security.max-test-duration=300

# -----------------------------------------------------------------------
# Security Component Testing
# -----------------------------------------------------------------------

# Enable JWT token validation testing with virtual threads
# Tests token validation under high concurrency
virtualthread.security.jwt.testing=true

# Number of concurrent JWT validations to simulate
virtualthread.security.jwt.concurrent-validations=1000

# Enable API key validation testing with virtual threads
virtualthread.security.apikey.testing=true

# Number of concurrent API key validations to simulate
virtualthread.security.apikey.concurrent-validations=1000

# Enable user token testing with virtual threads
virtualthread.security.usertoken.testing=true

# Number of concurrent user token operations to simulate
virtualthread.security.usertoken.concurrent-operations=500

# Enable RBAC permission evaluation testing
virtualthread.security.rbac.testing=true

# Number of concurrent RBAC evaluations to simulate
virtualthread.security.rbac.concurrent-evaluations=2000

# -----------------------------------------------------------------------
# Timeout Settings
# -----------------------------------------------------------------------

# Default timeout for blocking operations in virtual thread context (ms)
virtualthread.timeout.default=10000

# Authentication operation timeout in milliseconds
virtualthread.timeout.authentication=5000

# Authorization check timeout in milliseconds
virtualthread.timeout.authorization=2000

# Session operation timeout in milliseconds
virtualthread.timeout.session=3000

# Retry count for operations that can be retried after timeout
virtualthread.timeout.retry-count=3

# Delay between retries in milliseconds
virtualthread.timeout.retry-delay=100

# -----------------------------------------------------------------------
# JVM Flags (for reference, set these via JVM arguments)
# -----------------------------------------------------------------------

# Enable tracing of pinned virtual threads with full stack traces
# -Djdk.tracePinnedThreads=full

# Set the parallelism level for the virtual thread scheduler
# -Djdk.virtualThreadScheduler.parallelism=<value>

# Set the maximum pool size for the virtual thread scheduler
# -Djdk.virtualThreadScheduler.maxPoolSize=<value>