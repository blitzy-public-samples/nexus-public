# Virtual Thread Test Configuration for Nexus Security Module
# This file contains settings for testing security components under Java 21 Virtual Threads

# ======================================================================
# Virtual Thread Executor Configuration
# ======================================================================

# Enable virtual thread testing mode
virtualthread.testing.enabled=true

# Virtual thread executor configuration
virtualthread.executor.parallelism=16
virtualthread.executor.maxPoolSize=256
virtualthread.executor.queueSize=10000

# I/O operations configuration for virtual threads
virtualthread.io.timeout.millis=5000
virtualthread.io.buffer.size=8192

# ======================================================================
# Thread Pinning Detection Configuration
# ======================================================================

# Enable thread pinning detection
virtualthread.pinning.detection.enabled=true

# Thread pinning detection mode (full, short, none)
virtualthread.pinning.detection.mode=full

# Minimum duration threshold for reporting pinned threads (milliseconds)
virtualthread.pinning.threshold.millis=20

# Thread pinning logging configuration
virtualthread.pinning.logging.enabled=true
virtualthread.pinning.logging.level=WARN

# ======================================================================
# Authentication Testing Configuration
# ======================================================================

# Authentication concurrency test parameters
virtualthread.auth.concurrentUsers=1000
virtualthread.auth.requestsPerUser=50
virtualthread.auth.thinkTime.millis=100

# Shiro session testing configuration
virtualthread.shiro.session.timeout.seconds=1800
virtualthread.shiro.session.validation.interval.seconds=300
virtualthread.shiro.session.persistence.enabled=true

# Authentication flow validation parameters
virtualthread.auth.flow.validation.enabled=true
virtualthread.auth.flow.validation.iterations=5

# ======================================================================
# Authorization Testing Configuration
# ======================================================================

# Authorization concurrency test parameters
virtualthread.authz.concurrentRequests=500
virtualthread.authz.requestsPerSecond=1000

# Permission evaluation testing
virtualthread.authz.permission.evaluation.depth=5
virtualthread.authz.permission.evaluation.breadth=10

# Content selector testing with virtual threads
virtualthread.authz.contentSelector.enabled=true
virtualthread.authz.contentSelector.complexity=medium

# ======================================================================
# Test Environment Configuration
# ======================================================================

# Test execution parameters
virtualthread.test.duration.seconds=60
virtualthread.test.warmup.seconds=10
virtualthread.test.cooldown.seconds=5

# Monitoring and reporting
virtualthread.monitoring.interval.seconds=5
virtualthread.monitoring.detailed=true
virtualthread.monitoring.jfr.enabled=true

# Test data configuration
virtualthread.test.data.users=100
virtualthread.test.data.roles=20
virtualthread.test.data.privileges=50