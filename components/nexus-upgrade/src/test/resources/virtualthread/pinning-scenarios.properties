# Thread Pinning Detection Scenarios for Upgrade Operations
# This file defines test scenarios for detecting thread pinning during upgrade operations
# Thread pinning occurs when a virtual thread is forced to stay on a carrier thread,
# which negates the benefits of virtual threads

# Global configuration
pinning.detection.enabled=true
pinning.detection.threshold.ms=20
pinning.detection.sampling.interval.ms=5
pinning.detection.thread.dump.enabled=true
pinning.detection.thread.dump.count=3
pinning.detection.thread.dump.interval.ms=500

# Database upgrade operations

# Schema migration operations
scenario.schema_migration.enabled=true
scenario.schema_migration.description=Database schema migration operations
scenario.schema_migration.expected_pinning=false
scenario.schema_migration.threshold.ms=50
scenario.schema_migration.operations=CREATE_TABLE,ALTER_TABLE,CREATE_INDEX
scenario.schema_migration.monitoring.carrier_thread_count=4
scenario.schema_migration.monitoring.max_pinned_percentage=5

# Data migration operations
scenario.data_migration.enabled=true
scenario.data_migration.description=Data migration between tables
scenario.data_migration.expected_pinning=false
scenario.data_migration.threshold.ms=100
scenario.data_migration.operations=SELECT_INSERT,UPDATE,DELETE
scenario.data_migration.monitoring.carrier_thread_count=8
scenario.data_migration.monitoring.max_pinned_percentage=10

# Blob store operations

# File operations
scenario.file_operations.enabled=true
scenario.file_operations.description=File system operations during upgrade
scenario.file_operations.expected_pinning=false
scenario.file_operations.threshold.ms=30
scenario.file_operations.operations=READ,WRITE,DELETE,MOVE
scenario.file_operations.monitoring.carrier_thread_count=4
scenario.file_operations.monitoring.max_pinned_percentage=5

# S3 operations
scenario.s3_operations.enabled=true
scenario.s3_operations.description=S3 blob store operations during upgrade
scenario.s3_operations.expected_pinning=false
scenario.s3_operations.threshold.ms=200
scenario.s3_operations.operations=GET_OBJECT,PUT_OBJECT,DELETE_OBJECT,LIST_OBJECTS
scenario.s3_operations.monitoring.carrier_thread_count=8
scenario.s3_operations.monitoring.max_pinned_percentage=15

# Synchronization operations

# Lock-based operations
scenario.lock_operations.enabled=true
scenario.lock_operations.description=Lock-based synchronization during upgrade
scenario.lock_operations.expected_pinning=true
scenario.lock_operations.threshold.ms=10
scenario.lock_operations.operations=SYNCHRONIZED_BLOCK,REENTRANT_LOCK,READ_WRITE_LOCK
scenario.lock_operations.monitoring.carrier_thread_count=4
scenario.lock_operations.monitoring.max_pinned_percentage=50

# Transaction operations
scenario.transaction_operations.enabled=true
scenario.transaction_operations.description=Database transaction operations
scenario.transaction_operations.expected_pinning=false
scenario.transaction_operations.threshold.ms=150
scenario.transaction_operations.operations=BEGIN_TRANSACTION,COMMIT_TRANSACTION,ROLLBACK_TRANSACTION
scenario.transaction_operations.monitoring.carrier_thread_count=4
scenario.transaction_operations.monitoring.max_pinned_percentage=10

# Content indexing operations

# Elasticsearch operations
scenario.elasticsearch_operations.enabled=true
scenario.elasticsearch_operations.description=Elasticsearch indexing operations during upgrade
scenario.elasticsearch_operations.expected_pinning=false
scenario.elasticsearch_operations.threshold.ms=300
scenario.elasticsearch_operations.operations=INDEX_DOCUMENT,UPDATE_DOCUMENT,DELETE_DOCUMENT,SEARCH
scenario.elasticsearch_operations.monitoring.carrier_thread_count=8
scenario.elasticsearch_operations.monitoring.max_pinned_percentage=20

# Known problematic operations

# Native method calls
scenario.native_methods.enabled=true
scenario.native_methods.description=Native method calls that may cause pinning
scenario.native_methods.expected_pinning=true
scenario.native_methods.threshold.ms=5
scenario.native_methods.operations=JNI_CALL,NATIVE_IO,NATIVE_CRYPTO
scenario.native_methods.monitoring.carrier_thread_count=4
scenario.native_methods.monitoring.max_pinned_percentage=80

# Legacy synchronized code
scenario.legacy_synchronized.enabled=true
scenario.legacy_synchronized.description=Legacy code using synchronized blocks
scenario.legacy_synchronized.expected_pinning=true
scenario.legacy_synchronized.threshold.ms=15
scenario.legacy_synchronized.operations=SYNCHRONIZED_METHOD,SYNCHRONIZED_STATIC_METHOD,SYNCHRONIZED_THIS
scenario.legacy_synchronized.monitoring.carrier_thread_count=4
scenario.legacy_synchronized.monitoring.max_pinned_percentage=70

# Monitoring configuration

# Thread dump settings
monitoring.thread_dump.path=target/thread-dumps
monitoring.thread_dump.filename.pattern=pinning-detected-{timestamp}-{scenario}-{operation}.tdump
monitoring.thread_dump.include.all_threads=true
monitoring.thread_dump.include.stack_trace=true
monitoring.thread_dump.include.locked_monitors=true
monitoring.thread_dump.include.locked_synchronizers=true

# Metrics collection
monitoring.metrics.enabled=true
monitoring.metrics.collection.interval.ms=1000
monitoring.metrics.export.prometheus=true
monitoring.metrics.export.jmx=true
monitoring.metrics.export.csv=true
monitoring.metrics.export.csv.path=target/metrics
monitoring.metrics.export.csv.filename.pattern=pinning-metrics-{timestamp}.csv

# Reporting thresholds
reporting.alert.pinning.percentage.warn=30
reporting.alert.pinning.percentage.error=60
reporting.alert.pinning.percentage.critical=80
reporting.alert.pinning.duration.warn.ms=100
reporting.alert.pinning.duration.error.ms=500
reporting.alert.pinning.duration.critical.ms=1000

# Test execution configuration
test.virtual_thread.pool.size=100
test.carrier_thread.pool.size=16
test.execution.duration.seconds=30
test.execution.warmup.seconds=5
test.execution.cooldown.seconds=5
test.execution.operations.per.thread=1000
test.execution.delay.between.operations.ms=10