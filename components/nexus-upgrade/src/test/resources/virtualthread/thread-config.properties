# Virtual Thread Configuration for Nexus Upgrade Module Tests
# Java 21 Virtual Thread settings for testing upgrade operations

# -------------------------------------------------------
# Virtual Thread Scheduler Configuration
# -------------------------------------------------------

# Number of carrier threads to use for the virtual thread scheduler
# Default is equal to available processors
jdk.virtualThreadScheduler.parallelism=16

# Maximum number of carrier threads in the pool
jdk.virtualThreadScheduler.maxPoolSize=256

# Use FIFO scheduling for virtual threads (default is true)
jdk.virtualThreadScheduler.fifoMode=true

# -------------------------------------------------------
# Thread Pinning Detection
# -------------------------------------------------------

# Enable thread pinning detection during tests
# Options: 'full' (with stack trace), 'short' (basic info), or 'off'
jdk.tracePinnedThreads=full

# -------------------------------------------------------
# Virtual Thread Pool Settings
# -------------------------------------------------------

# Maximum number of virtual threads to create in the pool
virtualthread.pool.max-size=10000

# Timeout in milliseconds for virtual thread operations
virtualthread.operation.timeout=30000

# Thread name prefix for virtual threads created during tests
virtualthread.name.prefix=nexus-upgrade-vt-

# -------------------------------------------------------
# Performance Testing Parameters
# -------------------------------------------------------

# Expected minimum throughput improvement factor compared to platform threads
virtualthread.performance.throughput-factor=2.0

# Maximum acceptable memory overhead per 1000 virtual threads (in MB)
virtualthread.performance.memory-overhead=300

# Maximum acceptable P95 response time for virtual threads (in ms)
virtualthread.performance.p95-response-time=350

# -------------------------------------------------------
# JVM Flags for Virtual Thread Tests
# -------------------------------------------------------

# Enable ZGC garbage collector for virtual thread tests
jvm.flags.gc=-XX:+UseZGC -XX:+ZGenerational

# Additional JVM flags for virtual thread testing
jvm.flags.virtual-threads=-Djdk.virtualThreadScheduler.parallelism=16 -Djdk.virtualThreadScheduler.maxPoolSize=256 -Djdk.tracePinnedThreads=full

# -------------------------------------------------------
# Test Environment Configuration
# -------------------------------------------------------

# Enable virtual thread execution for all tests in this module
test.virtual.threads=true

# Enable thread pinning detection during upgrade operations
test.detect.thread.pinning=true

# Enable performance comparison between platform and virtual threads
test.compare.thread.performance=true

# Number of concurrent operations to test with virtual threads
test.concurrent.operations=1000