# Virtual Thread Metrics Configuration for Nexus Repository Upgrade Tests
# This file configures metrics collection for validating virtual thread performance during upgrades

#-------------------------------------------------------
# General Configuration
#-------------------------------------------------------

# Enable/disable metrics collection
metrics.enabled=true

# Logging level for metrics collection (TRACE, DEBUG, INFO, WARN, ERROR)
metrics.logging.level=INFO

# Output directory for metrics data files
metrics.output.directory=${java.io.tmpdir}/nexus-vt-metrics

# File name pattern for metrics output
metrics.output.filename=vt-upgrade-metrics-{timestamp}.json

#-------------------------------------------------------
# Performance Thresholds
#-------------------------------------------------------

# Minimum expected throughput improvement ratio (virtual vs platform threads)
# A value of 1.5 means virtual threads should be at least 50% faster
metrics.threshold.throughput.ratio=1.5

# Maximum acceptable memory overhead for virtual threads (in MB)
# Virtual threads should use less memory, but tracking structures add overhead
metrics.threshold.memory.overhead=50

# Maximum acceptable response time for upgrade operations with virtual threads (ms)
metrics.threshold.response.time=5000

# Maximum acceptable thread pinning percentage
# Higher values indicate potential performance issues
metrics.threshold.pinning.percentage=5

#-------------------------------------------------------
# Thread Monitoring Settings
#-------------------------------------------------------

# Enable thread pinning detection
metrics.thread.pinning.detection=true

# Minimum duration (ms) for a pinned thread to be reported
metrics.thread.pinning.threshold=20

# Enable carrier thread utilization tracking
metrics.thread.carrier.tracking=true

# Sample interval for thread metrics collection (ms)
metrics.thread.sample.interval=100

# Maximum number of thread samples to keep in memory
metrics.thread.sample.max=10000

# Enable thread creation/termination rate tracking
metrics.thread.lifecycle.tracking=true

#-------------------------------------------------------
# Reporting Configuration
#-------------------------------------------------------

# Report generation frequency (in seconds, 0 = only at end of test)
metrics.report.frequency=30

# Report formats (comma-separated: json,html,csv)
metrics.report.formats=json,html

# Include stack traces in reports for pinned threads
metrics.report.include.stacktraces=true

# Enable visualization in HTML reports
metrics.report.visualization=true

# Chart types to include in visualization (comma-separated)
metrics.report.charts=throughput,memory,response-time,thread-count,pinning

#-------------------------------------------------------
# Upgrade-specific Settings
#-------------------------------------------------------

# Enable detailed metrics for database operations during upgrade
metrics.upgrade.database.tracking=true

# Enable detailed metrics for blob store operations during upgrade
metrics.upgrade.blobstore.tracking=true

# Enable detailed metrics for content indexing operations during upgrade
metrics.upgrade.indexing.tracking=true

# Track upgrade task execution times
metrics.upgrade.task.timing=true

# Compare execution times between virtual threads and platform threads
metrics.upgrade.comparative.analysis=true

# Baseline performance data file from platform thread execution
# If empty, no comparison will be performed
metrics.upgrade.baseline.file=

#-------------------------------------------------------
# Advanced Settings
#-------------------------------------------------------

# JVM flags for virtual thread optimization
# These are applied automatically when metrics collection is enabled
metrics.jvm.flags=-Djdk.tracePinnedThreads=full -Djdk.virtualThreadScheduler.maxPoolSize=256

# Enable JFR (Java Flight Recorder) integration for detailed profiling
metrics.jfr.enabled=false

# JFR recording file path (if enabled)
metrics.jfr.path=${java.io.tmpdir}/nexus-vt-upgrade.jfr

# Enable heap dump on virtual thread OutOfMemoryError
metrics.heap.dump.on.error=true

# Maximum number of concurrent virtual threads to allow during upgrade
# 0 means unlimited (not recommended for production)
metrics.thread.max.concurrent=10000